name: commit-rules
# Fails a push or pull request whose commits carry AI attribution lines (see CLAUDE.md).
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  no-ai-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then range="$HEAD"; else range="$BASE..$HEAD"; fi
          bad=$(git log --format='%h %s%n%b' "$range" | grep -iE '^(co-authored-by:.*(claude|anthropic|openai|copilot|chatgpt|gemini)|claude-session:|.*generated with \[?claude)' || true)
          if [ -n "$bad" ]; then echo "::error::Commit messages name an AI tool (CLAUDE.md):"; echo "$bad"; exit 1; fi
          echo "No AI attribution lines."
