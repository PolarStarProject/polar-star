  rs_use_h:"What you may reuse", rs_use:["Facts and figures: always, with a citation. Government records are public domain.", "The data files and every \"Show the numbers\" table: any use, with credit to the Polar Star Project (CC BY 4.0).", "Flight data: any use, with credit to adsb.lol contributors and the Polar Star Project; any database you build from it must be shared under the same license (ODbL).", "The page's text, explanations, charts and design: non-commercial use, with credit, and adapted versions under the same license (CC BY-NC-SA 4.0).", "The code: non-commercial use, including by charities, schools, researchers and government bodies (PolyForm Noncommercial 1.0.0).", "The Polar Star names, logo and seal: not licensed for reuse. You may show them unaltered to refer or link to Polar Star, or in reporting and research about it, but not in a way that suggests the Polar Star Project made or endorses something it did not."],
  tp_ar_h:"Arrests, removals and alternatives to detention", tp_ar_lead:"ICE's own records: who it arrested and how, which agency made the arrest behind each detention, how many it removed, and how many people it watches outside detention.", tp_ar_m:"ICE arrests, per month", tp_ar_all:"All ICE arrests", tp_ar_comm:"In the community", tp_ar_jail:"From jails and prisons", tp_ar_287:"Through a 287(g) agreement", tp_ar_rest:"Everything else", tp_ar_note:d => `Counted from ICE's arrest records, released under the Freedom of Information Act and cleaned by the Deportation Data Project (records through ${dateText(d)}). Likely duplicates (the same person within a day) are left out. These counts are close to the totals DHS announced: about 43,000 in June 2026 and more than 49,000 in July.`, tp_ar_nc:"Share of ICE arrests of people with no criminal conviction and no pending charge, per month", tp_ar_ncnote:"As ICE records it at the arrest (its label: “other immigration violator”). People with a pending charge but no conviction are not in this share.", tp_ar_how:"How ICE recorded each arrest", tp_ar_lab:{"Non-Custodial Arrest":"In the community (ICE: non-custodial arrest)", "Custodial Arrest":"Taken from police or jail custody (ICE: custodial arrest)", "CAP Local Incarceration":"From a local jail (Criminal Alien Program)", "CAP State Incarceration":"From a state prison (Criminal Alien Program)", "CAP Federal Incarceration":"From a federal prison (Criminal Alien Program)", "287(g) Program":"Through a 287(g) agreement with local police", "Located":"Located by ICE", "ERO Reprocessed Arrest":"Arrest re-processed by ICE", "Other efforts":"Other efforts", "Other":"Other methods, each under 1% of arrests"}, tp_ar_ice:k => `ICE's label: ${k}`, tp_t_ar:m => `ICE arrests in ${m}`, tp_bk_h:"Who made the arrest behind each new detention, per month", tp_bk_ice:"Arrested by ICE", tp_bk_cbp:"Arrested by CBP at the border", tp_bk_note:"From ICE's detention statistics: initial book-ins by arresting agency. Until early 2025 most people entering ICE detention had been arrested by CBP at the border; now almost all are arrested by ICE inside the country.", tp_ag2_h:"Who arrested the people held on the latest count", tp_ag2:(n, d, p, d0, p0) => `Of the ${n} people ICE held on ${d}, ${p}% had been arrested by ICE and ${100 - p}% by CBP.${p0 != null ? ` On ${d0}, ${p0}% had been arrested by CBP.` : ""}`, tp_rm_h:"Removals", tp_rm:(n, d, n0, d0) => `ICE reports ${n} removals in fiscal year 2026 through ${d}.${n0 ? ` Its fiscal year 2025 report counted ${n0} through ${d0}.` : ""}`, tp_rm_note:"Removals are deportations with an order. ICE's fiscal year runs October to September; returns and expulsions by CBP are not included.", tp_t_rm:d => `removals by ICE in fiscal year 2026, through ${d}`, tp_rm_chg:(n, d) => `Fiscal year 2025: ${n} through ${d}`, tp_pa_chg:(p, a, na, ka, b, nb, kb) => `Audits from ${a}: ${(na / ka).toFixed(1)} allegations per audit (${na} in ${ka}), against ${(nb / kb).toFixed(1)} per audit (${nb} in ${kb}) in ${b}. Different years audit different facilities, so this is not a trend at any one site.`, tp_oc_chg:(p, a, b, y) => `${p > 0 ? "Up" : "Down"} ${Math.abs(p)}% a month from fiscal year ${y} (${a} a month, from ${b})`, tp_rm_fy:d => { const x = new Date(d + "T12:00:00"); return "FY " + (x.getMonth() >= 9 ? x.getFullYear() + 1 : x.getFullYear()); }, tp_rm_day:"Removals per day", tp_rm_dayh:"ICE removals per day, by fiscal year", tp_rm_thru:d => `through ${d}`, tp_rm_pct:(p, a, b) => `${p > 0 ? "Up" : "Down"} ${Math.abs(p)}% per day from fiscal year 2025 (${a} a day, from ${b})`, tp_rm_daynote:x => `Compared per day because each year\u2019s report stops on a different date: ${x}. From ICE\u2019s detention statistics.`, tp_atd_h:"People on alternatives to detention", tp_atd:(n, d, per) => `${n} people were enrolled on ${d}: phone check-ins, ankle monitors and wrist monitors run by BI Inc., a GEO Group company.${per ? ` The technology alone cost about $${per} per person a day; case management and the rest of the contract cost more.` : ""}`, tp_atd_note:"From ICE's detention statistics, which take these counts from BI Inc.'s participant reports. Each bar is the count on the day of a report.", tp_atd_t:{smartlink:"Phone app check-ins (SmartLINK)", ankle_monitor:"Ankle monitor", wristworn:"Wrist monitor", voiceid:"Voice check-ins", gps:"GPS monitor", dual_tech:"Two technologies", dual_technology:"Two technologies", no_tech:"No technology", no_technology:"No technology", veriwatch:"VeriWatch"}, tp_t_atd:d => `people on alternatives to detention (ankle monitors, phone check-ins) on ${d}`,
  sf_h:"Staff: who is paid to do this work", sf_lead:"Federal employees at ICE and at the other agencies that arrest, hold, judge and remove people, from the government's own workforce files. Counts only; no names.", sf_ice:"ICE employees", sf_ice_h:"ICE employees, end of each month", sf_ice_note:y => `From OPM's federal workforce files (everyone on the rolls on the last day of the month). Earlier Septembers: ${y}.`, sf_fl_h:"People who joined and left ICE, per month", sf_hire:"Joined", sf_left:"Left", sf_fl_note:"Hires and transfers in, and resignations, retirements, firings and transfers out, as OPM records them.", sf_off_h:"Officers and agents", sf_off:(a, b, c, m) => `In the two job series that cover ICE's officers and agents (1801 enforcement and 1811 criminal investigators), OPM counts ${(a || 0).toLocaleString()} in January 2025, ${(b || 0).toLocaleString()} in January 2026 and ${c.toLocaleString()} in ${m}.`, sf_claim:(a, b) => `In January 2026 DHS said ICE had grown to more than 22,000 officers and agents, from 10,000 when the administration began (as reported by Government Executive). OPM's files put the start higher, at ${a.toLocaleString()}, and the rise to January 2026 at about ${(Math.round((b - a) / 100) * 100).toLocaleString()}, not 12,000. Series 1801 also includes some jobs that are not deportation officers.`, sf_all_h:m => `Staff at each agency, ${m}`, sf_ag:{ICE:"ICE", CBP:"CBP (Border Patrol and ports)", USCIS:"USCIS (citizenship and immigration services)", EOIR:"Immigration courts (EOIR)", USMS:"U.S. Marshals"}, sf_ser_h:m => `ICE jobs with the most people, ${m}`, sf_ser:{"1801":"Enforcement and compliance officers (incl. deportation officers) · 1801", "1811":"Criminal investigators (special agents) · 1811", "0905":"Attorneys · 0905", "0301":"Administrative and program staff · 0301", "0343":"Management and program analysts · 0343", "1805":"Investigative assistants · 1805", "0318":"Secretaries · 0318", "2210":"IT specialists · 2210", "0303":"Clerks and assistants · 0303", "1802":"Compliance and inspection support · 1802"}, sf_other:"All other jobs", tp_t_sf:m => `people working at ICE at the end of ${m}`,
  oc_h:a => `${a} spending, by kind`, oc_pay:"Its own staff (pay and benefits)", oc_svc:"Contracts, services and supplies", oc_own:"Buildings, land and equipment", oc_rest:"Grants and other", oc_part:(y, m) => `* Fiscal year ${y} through ${m}: the agency's last quarterly report.`, oc_gap:(a, b, c) => `In fiscal year 2025 ICE's accounts show ${a} for contracts, services and supplies, while contract records show ${b} committed to contractors. The difference, about ${c}, is not listed payee by payee in public records. Payments to other agencies, such as the Bureau of Prisons, and to counties for jail space are recorded this way.`, oc_note:"From the reports ICE files with the Treasury each quarter (USAspending's account data): money committed (obligated) in each fiscal year from ICE's two main accounts (Operations and Support; Procurement, Construction and Improvements), including the 2025 budget law's money. ICE's smaller fee-funded accounts (the student visa program, user fees and forfeited bonds, about $0.2 to $0.4 billion a year) do not report by kind, so these totals run a little below \"ICE's money by fiscal year\", which counts every account. The newest year runs only through the last quarter ICE has reported. This counts payroll and everything else; contract records show only who was paid under contracts.", oc_t:(y, m, a, b, c) => `committed by ICE in fiscal year ${y}${m ? ` through ${m}` : ""}, from its two main accounts: ${a} on its own staff, ${b} on contracts and services, ${c} on buildings and equipment`,
  dk_t_last:(d, n) => `Last file posted ${d}. ICE has now missed about ${n} two-week updates.`,
  xl_state:"Numbers for one state, side by side", xl_cd:"Deaths and allegations by year and by who runs each site, set against how many people each site held, on Trends and patterns, under Harm and conditions", xl_ovt:"Refusals and inspections over time, and where they happened, on Trends and patterns, under Harm and conditions", xl_agt:"Agreements signed over time and those no longer listed, at the end of this tab", xl_lobt:"Lobbying and political money over time, on Trends and patterns", xl_wl:"Every facility on the alert list, with who oversees it", xl_watch:"Facilities whose deaths, allegations or long stays are well above others, on Alerts from the records", xl_src:"Every source, overdue ones first, with its date and link, is on About this data", xl_gone:n => `Every agreement no longer on ICE\u2019s list (${n}), state by state, is on State and local agencies working with ICE`, gone_lead:"Agreements that were on ICE\u2019s published 287(g) list at some point since May 19, 2025 and are not on it now, with the signing date and the last list each appeared on. ICE gives no reason or end date; a few may be the same agency listed again under a changed name.", xl_fl:"Flights over time, busiest airports and destination countries, on Trends and patterns, under Enforcement", xl_lim:"Known limits of the whole page, for researchers", xl_ocp:"Tap the number in the Money tiles above for the chart.", xl_oc:"The full breakdown, with finer categories, is on Follow the money", xl_hab:"How many people go to federal court to challenge their detention (habeas petitions)", xl_bond:"Where immigration judges grant bond most and least often", xl_mw:"What every agency and program pays, side by side, on Follow the money", xl_gov:"Each agency's own records (CBP, HHS, FEMA, the Army and others), on Federal agencies, state programs and other countries working with ICE", xl_cbpd:"Deaths in Border Patrol and port custody (CBP) are on the Federal agencies, state programs and other countries working with ICE tab", xl_stagr:"Each state-run site, listed with the other state and local bodies on State and local agencies working with ICE", xl_stdet:"Detention run by states, on Federal agencies, state programs and other countries working with ICE", xl_ops:"Each operator's sites and what is on record there, on Trends and patterns, under Harm and conditions", wt_h:"Figures that stand out in the records", wt_lead:"Worked out from this page's own records at every update. Each item says what the records show, where to check it, and which bodies oversee it. Facts only: nothing here says why something happened.", wt_t:n => n === 1 ? "open item on the alert list, with who oversees it" : "open items on the alert list, with who oversees each", wt_ice_t:"ICE has not posted its required detention statistics", wt_why:{deaths:"deaths", allegations:"sexual abuse allegations", long:"share held more than a year"}, wt_fac_t:(n, st, w) => `${n}, ${st}: ${w.length > 1 ? w.slice(0, -1).join(", ") + " and " + w[w.length - 1] : w[0]} well above other facilities`, wt_since:d => `On this list since ${d}.`, wt_ice:(D, last, ck) => [`ICE's last detention statistics file is dated ${last}: ${D.days} days with no new file when ICE's page was checked on ${ck}.`, `Congress asked for this file every two weeks, so about ${D.missed} updates have been missed.`, "The requirement was added in the fiscal 2020 DHS appropriations law; reporting has noted debate over whether it still binds ICE."], wt_long_t:"Share of people in ICE detention held more than a year", wt_long:(D, d) => [`${D.n365.toLocaleString()} people in ICE detention on ${d} had been held more than a year, and ${D.n180.toLocaleString()} more than six months (${D.p365}% and ${D.p180}% of the ${D.n.toLocaleString()} held).`, "Long stays often come from cases still before a judge or on appeal, which can take more than a year. ICE's records do not say why any one stay has lasted this long, whether it has been reviewed, or whether the person has a final removal order.", D.ice365 != null ? `ICE's own twice-monthly file gives a lower figure, ${D.ice365.toLocaleString()} held more than a year on ${dateText(D.ice_day)}. This count runs from the start of each continuous stay in ICE detention, across transfers; ICE's file does not say how it measures, so the two are not directly comparable.` : "", "For people with a final removal order, the Supreme Court set six months as the presumptively reasonable limit when removal is not reasonably foreseeable (Zadvydas v. Davis, 2001). The records cannot show how many of these stays that applies to; that is the question for the bodies below."], wt_fac:(D, a, b, au, lo) => [D.dead != null ? `${D.dead} deaths ICE reported here from ${a} to ${b}: ${D.drate} for every 10,000 people held for a year, against ${D.dnat} across all facilities on ICE's list over the same months. At the overall rate, a count this high would come up by chance about ${Math.max(1, Math.round(100 * D.p))} times in 100.` : "", D.alleg != null ? `ICE's audit of ${au} counted ${D.alleg} sexual abuse allegations (reports made, not findings that abuse happened): ${D.arate} for every 1,000 people held for a year, against ${D.anat} across audited facilities. At the overall rate, a count this high would come up by chance ${D.pa < 0.01 ? "less than once" : "about " + Math.round(100 * D.pa) + " times"} in 100.` : "", D.n365 != null ? `${D.n365.toLocaleString()} of the ${D.lheld.toLocaleString()} people held here on ${lo} had been in ICE detention more than a year (${D.lpct}%), against ${D.lnat}% of everyone held. At the national share, a count this high would come up by chance ${D.pl < 0.01 ? "less than once" : "about " + Math.max(1, Math.round(100 * D.pl)) + " times"} in 100. The records give no reason for any of these stays.` : "", D.denied ? `Officials were refused entry here ${D.denied === 1 ? "once" : D.denied + " times"}${a ? " since " + a : ""}. Listed beside the figures above as a fact; it does not show that one caused the other.` : "", D.avgk === "d" ? `About ${D.avg.toLocaleString()} people a day were held here from ${a} to ${b}.${D.dead < 5 ? " Rates from a handful of deaths move a lot with one event." : ""}` : D.avgk === "a" ? `About ${D.avg.toLocaleString()} people a day were held here over the audit's period.` : ""].filter(Boolean), wt_open:"Open this facility", wt_fnote:(w, d) => `On the alert list since ${d}: ${w} well above other facilities. Worried about someone held here? Steps 4 and 7 under For families list free help and the person's consulate, who can ask about them.`, wt_fopen:"See the figures and who oversees it", wt_fac_h:n => `Facilities (${n}), by state`, wt_members:st => `Members of Congress from ${st}, both parties (each member's own site)`, wt_to:"Who oversees this", wt_to_n:"Every body is listed regardless of party. Their public pages are linked; this page sends nothing on anyone's behalf.", wt_feed:"Follow this list (feed)", wt_feed_n:"New items appear in the feed at the update that opens them.", wt_rule:f => f ? "A facility is listed when its rate of deaths over the most recent 12 months of ICE's population records, the rate of allegations in its latest ICE audit, or its share of people held more than a year is at least twice the rate across all facilities, rests on at least 3 deaths, 5 allegations or 10 people, and a count that high would come up by chance no more than 5 times in 100, after allowing for the fact that every facility is tested at once (the Benjamini–Hochberg correction): at that setting, about 1 listed item in 20 could still be chance." : "Facility alerts are worked out at every update but are not shown here until their rules have been reviewed.", tab_watch:"Alerts from the records", wt_sort:"Sort facilities by", wt_s_state:"State", wt_s_why:"What is well above others", wt_s_name:"Name", wt_sum_h:"Facilities at a glance", wt_c_fac:"Facility", wt_c_item:"Item", wt_c_st:"State", wt_c_why:"Well above others", wt_c_since:"On the list since", wt_c_facts:"What the records show", wt_c_src:"Sources", wt_c_to:"Who oversees it", wt_c_link:"Link", wt_cite_l:"Cite as:", wt_copy:"Copy", wt_copied:"Copied", wt_cite:(pub, ti, since, built, u) => `${pub}, Polar Star alerts from the records: “${ti}” (on the list since ${since}; data built ${built}). ${u}`, tab_pol:"Politicians", pol_none:"The voting records have not been read yet.", pol_lead:"How every member of Congress voted on the laws passed since 2025 that expand immigration detention or fund immigration enforcement, the committees that oversee ICE they sit on, and money their campaigns and committees received from detention-company committees (GEO, CoreCivic, MTC). Every voting member is listed, whichever way they voted.", pol_note:"Votes are the public record of a position, read from the House and Senate roll calls. Nothing here says why anyone voted as they did, and receiving money is not evidence that it changed a vote. Statements and positions are on each member's own site, linked below.", pol_laws_h:"The laws, and how each chamber voted", pol_law:{"P.L. 119-1":["Laken Riley Act (S. 5), signed January 29, 2025", "Requires ICE to detain people who are not citizens and are charged with, arrested for, or convicted of theft, burglary, shoplifting, assaulting a police officer, or a crime that killed or seriously injured someone, and lets states sue the federal government over immigration enforcement decisions. It sets rules; it does not provide money.", "Laken Riley Act"], "P.L. 119-21":["The July 2025 budget law (H.R. 1), signed July 4, 2025", "Gave $158.5 billion for border and immigration enforcement through 2029, including $45 billion for ICE detention. Follow the money has the detail. It was a broad budget bill, mostly about taxes, health care, energy and other spending, so a vote on it was not only a vote on immigration enforcement.", "July 2025 budget law"], "P.L. 119-98":["Secure America Act (S. 2), signed June 10, 2026", "Gave a further $46.6 billion for immigration enforcement through 2029: $31.1 billion for ICE (hiring, transport, technology, facilities, 287(g) agreements, legal staff), $13.0 billion for Border Patrol and $2.5 billion for DHS.", "Secure America Act"]}, pol_rec:"Official record", pol_house:"House", pol_senate:"Senate", pol_ch_on:(c, d) => `${c}, ${d}`, pol_result:(y, n) => `${y} yes, ${n} no.`, pol_party_line:(p, y, n) => `${p}: ${y} yes, ${n} no`, pol_pty:{R:"Republicans", D:"Democrats", I:"Independents"}, pol_money_h:"Money from detention-company committees (GEO, CoreCivic, MTC)", pol_money_p:(n, tot, byp, cyc) => `${n} members received ${tot} from the political committees of the three detention companies (GEO, CoreCivic, MTC) in the ${cyc} election cycles, to their campaigns or their leadership committees: ${byp}.`, pol_money_c:"Read with care. Votes on these laws split almost entirely along party lines, and this money went mostly to one party. Money given and votes cast do not show why a member voted as they did. Only committee (PAC) money is counted here, from the Federal Election Commission; money from executives as individuals, and lobbying, are on Follow the money.", xl_polmoney:"Committee money by quarter and recipient, named donors and lobbying, under Political money and lobbying on Follow the money", xl_pol:"Every member's votes on the enforcement laws, on Politicians", pol_find_h:"Find a member", pol_find_n:(a, c) => a === c ? String(a) : `${a} (${c} serving now)`, pol_q:"Name or state", pol_f_ch:"Chamber", pol_f_pa:"Party", pol_f_st:"State", pol_f_pos:"Votes", pol_f_ex:"Also", pol_all:"All", pol_pos:{yes:"Voted for every one of these laws they voted on", no:"Voted against every one they voted on", mixed:"Voted both ways"}, pol_ex_com:"Sits on a committee that oversees ICE", pol_ex_money:"Received detention or ICE contractor committee money", pol_ex_now:"In Congress now", pol_n_shown:n => `${n.toLocaleString()} ${n === 1 ? "member" : "members"}`, pol_who:(p, st, ch, d) => `${p.replace(/s$/, "")}, ${st} · ${ch}${d === "" || d == null ? "" : +d === 0 ? ", at-large seat" : ", district " + d}`, pol_y:"Yes", pol_n:"No", pol_p:"Present", pol_x:"Did not vote", pol_novote:"Did not vote on these laws (not in that chamber at the time)", pol_com:c => `Committees that oversee ICE: ${c}`, pol_got:(t, c, l) => `Received ${t} from detention-company committees (GEO, CoreCivic, MTC), 2024 and 2026 cycles (${[c ? "campaign " + c : "", l ? "leadership committee " + l : ""].filter(Boolean).join(", ")}).`, pol_bio:"Congressional biography", pol_site:"Official site", pol_more:n => `Show more (${n.toLocaleString()} left)`, pol_c_name:"Member", pol_c_party:"Party", pol_c_state:"State", pol_c_ch:"Chamber", pol_c_com:"Committees that oversee ICE", pol_c_camp:"Campaign money from detention-company committees (GEO, CoreCivic, MTC) ($)", pol_c_lead:"Leadership committee money ($)", pol_c_bio:"Biography", pol_src:"Sources: House Clerk and Senate roll-call records; committee membership and official sites from the public-domain congress-legislators files; committee money from the Federal Election Commission; governors from Wikidata, checked against each governor's official site; jail heads from county and sheriff's office websites; former officials from federal lobbying filings (lda.gov); under Other political money, country-focused PACs from the FEC and registered foreign agents from the Justice Department's FARA records. Officials are named for acts in office, and former officials only for the past posts they reported.", pv_h:"Votes on the enforcement laws, and detention-company money", pv_p:"Members who voted on each law, split by party and by whether their campaigns or leadership committees received money from detention-company committees (GEO, CoreCivic, MTC).", pv_row:(p, gy, gt, ny, nt) => `${p}: ${gy} of ${gt} who received the money voted yes; ${ny} of ${nt} who did not`, pol_qs:{}, pv_row0:(p, y, n) => `${p}: none received the money; ${y} of ${n} voted yes`, pv_note:"Within each party the votes barely differ, because almost every member voted with their party. The money mostly reached one party, so a comparison across parties would show party, not influence.", nd_h:"Named donors who work for these companies", nd_p:(n, usd, ppl, cyc, read) => `${n} contributions adding to ${usd}, from ${ppl} people who told the Federal Election Commission they work for one of these companies, in the ${cyc} election cycles. Read from the FEC on ${read}.`, nd_c:["Each gift is on the public record: the donor's name, employer and job are printed as the donor gave them on the filing, and are not checked here. Two people can share a name, and one person can appear under two spellings.", "A donor is named only once their gifts to one committee pass $200 in a year (or in an election, for a candidate), so smaller givers are not here.", "Gifts to the company's own political committee are shown on their own line: that committee's gifts to candidates are already counted in the section above, so adding the two would count the same money twice. Gifts made through WinRed or ActBlue are counted once.", "Giving to a candidate is legal. A gift is not evidence that any vote was bought or changed.", "Some totals to one candidate are above the limit for a single election. They usually cover both a primary and a general election, or include gifts later moved to another committee or refunded. Each gift links to the FEC\u2019s own record of it (its receipts search), not to the scanned filing, which prints the donor\u2019s street address.", "Street addresses are never shown. Federal law (52 U.S.C. 30111(a)(4)) forbids using these names to ask for money or for any commercial purpose, and the FEC adds made-up names to filings to catch anyone who does."], nd_by_to:"Where the money went", nd_and:" and ", nd_by_co:"By employer", nd_to:{O:"To the company's own political committee", R:"To Republican candidates and party committees", D:"To Democratic candidates and party committees", Q:"To other committees (leadership funds, super PACs and others)", X:"To other candidates"}, nd_co:{GEO:"The GEO Group", CC:"CoreCivic", MTC:"Management & Training Corporation", LAS:"LaSalle Corrections", ICA:"Immigration Centers of America", CSI:"CSI Aviation"}, nd_list:"Every named donor", nd_q:"Search a name, job, recipient or member", nd_f_co:"Employer", nd_shown:n => `${n.toLocaleString()} donor${n === 1 ? "" : "s"} shown`, nd_gifts:n => `${n} gift${n === 1 ? "" : "s"}`, nd_each:"Each gift", nd_to_c:"to", nd_rec:"FEC record", nd_mem:n => `member of Congress: ${n}`, nd_c_name:"Name as filed", nd_c_emp:"Employer as filed", nd_c_job:"Job as filed", nd_c_st:"State", nd_c_co:"Company", nd_c_date:"Date", nd_c_usd:"Dollars", nd_c_to:"Recipient committee", nd_c_party:"Party", nd_c_mem:"Member of Congress", nd_c_url:"FEC record (receipts search)", nd_fec:"FEC individual contributions", nd_src:"Source: itemized individual contributions (Schedule A) filed with the Federal Election Commission, where the donor named one of these employers. Large companies whose ICE work is a small share of what their staff do (Amentum, Akima, Ahtna) are left out.", xl_dn:"Named donors who work for these companies", pol_staff:(u, n) => `Contributions from individuals who listed a detention or removal company as their employer (self-reported on FEC filings): ${u} from ${n} named donor${n === 1 ? "" : "s"}.`, pol_staff_p:(n, u) => `Separately, ${n} members' committees received ${u} from people who reported working for these companies. Each donor is named, with the filing, on Follow the money.`, pol_c_staff:"Gifts from company staff (dollars)", nd_small:(n, u) => `Every itemized gift is counted, however small: ${n} of these gifts were under $200, adding to ${u}. Small gifts repeated many times are added into each donor's total and each recipient's total.`, nd_rec_line:(n, u) => `${n.toLocaleString()} ${n === 1 ? "gift" : "gifts"}, ${u}`, nd_more_rec:n => `and ${n} more`, sted one by one, so that no one of them is picked over the others; the FEC record of the member's committee lists them all.`, pc_top_fec:"FEC record", pc_top_n:n => `${n.toLocaleString()} ${n === 1 ? "expenditure" : "expenditures"}`, pc_top_note:"Committee names are as filed. Gifts from party committees and transfers from joint fundraisers are not included; outside spending is money a group spent on its own, not money given to the member. Being on this list says only that a group gave or spent; it says nothing about the member's views or votes.", off_to_h:"Where questions about a member's conduct can be raised", pol_ex_flag:"Committee seats, contractor money and facilities overlap", pc_flag:"This member meets the overlap rule (committee seats, contractor money and facilities) shown under Politicians.", pc_flag_go:"See the rule and the list", fam_7h:"7. Contact the person's consulate", fam_7p:"The person's country has consulates in the US that can find its citizens in ICE custody, visit them, help with documents and follow the case, whether or not the person has a lawyer. Tell the consulate the person's full name, date of birth, A-number if you have it, and the facility from step 2.", fam_7mx:"For Mexican citizens, the Mexican government's 24-hour help line (CIAM, in Spanish):", fam_7n:"For any country, its embassy in Washington, D.C. lists its consulates on its website. A consulate cannot get someone released, but it can check on their treatment and help with travel papers.", fam_7ca:"For other countries:", fam_cons:{consular:"Every country's consulates in the US (State Department list)", gt:"Guatemala: Ministry of Foreign Affairs (consulates and help for citizens)", hn:"Honduras: Ministry of Foreign Affairs (consulates and help for citizens)", sv:"El Salvador: Ministry of Foreign Affairs (consulates and help for citizens)"}, fam_8h:"8. If the person may already have been deported", fam_8p:"ICE's locator stops showing a person after they are removed from the country. The immigration court line in step 3 shows whether a judge ordered removal. The consulate in step 7 is usually told when one of its citizens is deported and can say when and where they arrived.", fam_8n:"Removal flights to many countries leave from a few airports; the Flights tab shows them, but no public record lists who was on a flight.", fam_8l:["Ask the consulate (step 7) whether its country meets removal flights, and where the person can get help on arrival.", "Belongings and money the person had in detention: ask the facility where they were held (step 2) how to get them back.", "Appeals and requests to reopen a case have strict deadlines, some as short as 30 days. Talk to a lawyer (step 4) as soon as you can."], tab_state:"Your state", sv_lead:"Pick a state to see who represents it in Congress, each with a scorecard, and every figure this page has for the state side by side: facilities, agreements with ICE, inspections, refusals of entry and more.", sv_score:s => `${s}: scorecard`, sv_reps:s => `${s}: members of Congress`, sv_mem_h:"Who represents this state", sv_pick:"State:", sv_choose:"Choose a state", cv_co:"Company", cv_award:"Award", cv_what:"What it is for", cv_usd:"Dollars", cv_musd:"Millions of dollars committed", cv_from:"Start", cv_to:"End", cv_comp:"How it was awarded (C competed, N not competed, L order without fair opportunity)", cv_offers:"Offers received", cv_reason:"Reason on record", cv_link:"Link", cv_date:"Date", cv_place:"Place", cv_who:"Who was refused", cv_kind:"Kind of official", cv_body:"Body", cv_code:"Facility code", cv_fac:"Facility", cv_title:"Report", cv_def:"Deficiencies cited", sec_cite:(pub, ti, d, u) => `${pub}, Polar Star: “${ti}” (data built ${d}). ${u}`, pol_pty1:{R:"Republican", D:"Democrat", I:"Independent"}, nw_h:"News coverage", nw_lead:"News about ICE and immigration from many outlets, gathered by Ground News, which shows how outlets across the political spectrum cover each story. The links open Ground News; this page does not choose the stories.", nw_ice:"Immigration and Customs Enforcement (ICE)", nw_us:"US immigration", nw_dhs:"Department of Homeland Security", nw_note:"Ground News is an independent site supported by subscriptions. Its left, center and right labels are its own ratings, built from outside media-rating groups, not this page's. The topic pages open without an account; some features ask you to sign up.", so_h:"Organizations that share news and updates", so_lead:"Organizations, news outlets and government agencies that post about ICE, detention and immigration on Bluesky or Instagram, when their accounts pass the weekly check. Groups in a particular state are listed on Your state.", so_warn:"These accounts are for news and updates, not legal help. For a lawyer, use step 4 under For families. Never pay someone you found online to find a person or get them released.", fo_lead:"Nonprofits, legal clinics and public agencies that help people held by ICE and their families: free legal help, help for children, women and LGBTQ people, bond funds, visits, faith groups and immigrant services. Pick the kinds of help you need and your state.", fo_warn:"Being listed is not an endorsement. Real help is free: never pay someone you found online to find a person or get them released. Call before you go.", fo_kind:"Kind of help", fo_who:"Who it is for", fo_what:"What it does", fo_t:{kids:"Children", women:"Women", lgbtq:"LGBTQ people", legal:"Free legal help", bond:"Bond funds", visitation:"Visits", services:"Immigrant services", faith:"Faith groups", community:"Community groups", advocacy:"Advocacy", research:"Research", news:"News"}, fo_st:"State", fo_st_any:"Any state", fo_n:(n, st) => `${n} organizations${st ? ` working in ${st} or nationwide` : ""}`, fo_and:"With more than one kind picked, the list shows organizations that offer all of them.", fo_none:"None offer every kind you picked here. Remove one to see more.", fo_natl:"Nationwide", fo_offices:s => `Nationwide; local work in ${s}`, fo_in:s => `Works in ${s}`, fo_web:"Website", fo_meta:(d, n) => `Websites, phone numbers and IRS records checked ${d}. ${n} organizations.`, fo_how_h:"How organizations are chosen", fo_how:"An organization is listed only if it is a government agency, a nonprofit registered with the IRS (or a project of one), a university clinic or a faith institution; helping immigrants or detained people is central to its work; it sells nothing and never charges to find or free anyone; it does not raise money for single cases on its listing; and it does not post personal details of officers or detained people. Each week the page checks that its website still loads and is still its own, that its phone numbers are still on its site, and that its IRS record exists. An organization that fails is hidden until it passes again.", fo_st_h:s => `Organizations that help families in ${s}`, fo_st_go:"See national organizations too", so_warn_s:"For news and updates, not legal help. Never pay someone you found online to find a person or get them released.", so_in:s => `Works in ${s}`, so_natl:"Works nationwide", so_based:x => `based in ${x}`, so_st_h:"Organizations in this state that share news and updates", so_how_h:"How organizations are chosen", so_how:"An account is listed only if it belongs to a government agency, a nonprofit registered with the IRS, a news outlet, a university or a faith institution; the organization's own website links to it; immigration or detention is central to its work; and it does not sell services, charge to find or free someone, raise money for single cases, or post personal details of officers or detained people. Every week the website link, the IRS record and, for Bluesky, a post in the last 90 days are checked automatically, and an account that fails is taken off. Instagram does not let anyone check activity without signing in, so Instagram activity is not checked. The page covers Bluesky and Instagram only. Being listed is not an endorsement.", so_meta:(d, n) => `Checked ${d}. ${n} organizations in all, including those listed by state.`, so_kind:{government:"Government agency", news:"News outlet", advocacy:"Advocacy organization", community:"Community organization", research:"Research organization", service:"Refugee and immigrant services"}, so_bi:"English and Spanish", so_es:"Spanish", rb_line:(n, ti, of) => `Run by ${ti} ${n}, ${of}.`, rb_src:d => `Official page, checked ${d}`, ag_moa:"Signed agreement (PDF; copy archived from ICE's 287(g) page)", go_fail:d => `not confirmed on the official site this week (check failed ${d})`, go_h:"Governors", go_lead:"Each state's governor and, beside each, what the records on this page show for that state. Governors direct state agencies, including any that sign their own agreements with ICE; county and city agreements are signed by those local agencies.", go_since:d => `in office since ${d}`, go_287:n => `${n.toLocaleString()} 287(g) ${n === 1 ? "agreement" : "agreements"} in the state.`, go_ban:"State law bars these agreements.", go_stag:(n, x) => `${n} signed by state agencies: ${x}.`, go_sites:x => `State-run detention sites: ${x}.`, go_fac:n => `${n} ICE detention ${n === 1 ? "facility" : "facilities"} in the state on this page.`, go_site:"Governor's official site", go_more:n => `, and ${n} more`, go_note:d => `Names and party come from Wikidata or, where Wikidata is unclear, a list kept by hand, and are checked each week against the governor's own official website (last checked ${d}). Where that site could not be reached or did not name the governor, the name is still listed and marked. State agencies are those named for the state on ICE's list. Political money in state races is filed with each state, not the FEC, and is not shown here.`, lo_cov:(n, m) => `${n} of the ${m} jails on file are shown: the others have no official page that names the person in charge, or the page could not be checked.`, lo_h:"Sheriffs and jail heads holding people for ICE", lo_lead:"Local jails that hold people for ICE under an agreement, and the official who runs each one, usually the elected sheriff.", lo_note:"Each name is shown only while the county's or office's own website names that person; the check runs weekly, and an office that changes hands drops off until its site is updated. Jails without an official page to check are not listed. Agencies that signed 287(g) agreements link their signed agreement under State and local agencies working with ICE.", rv_h:"Former government officials lobbying for detention companies", rv_lead:"Lobbyists working for GEO Group, CoreCivic, Management & Training Corp. and CSI Aviation who reported a past government post on their federal lobbying filings.", rv_was:cp => `Past post, as filed: ${cp}`, rv_for:(co, firm, y) => `Lobbied for ${co} through ${firm}, ${y}`, rv_note:"From Lobbying Disclosure Act filings (lda.gov). Federal law requires each lobbyist to list any covered executive or congressional post held in the last 20 years; the wording is the lobbyist's own.", ag_cty:k => /\b(County|Parish|Borough|Municipality|Census Area|City)$/.test(k) ? k : k + " County", pol_vp:"The Vice President broke the tie in favor.", cy_held:n => `${n} ${n === 1 ? "amount is" : "amounts are"} left out until checked: each is filed as a contribution from the committee's own funds but is more than the $10,000 a PAC may give a candidate for a primary and a general election. That can be lawful when the member also ran in a special election or a runoff, or it can be donors' money filed under the wrong code.`, cy_h:"PACs focused on US policy toward a specific country", cy_lead:"Political action committees and super PACs whose registered name names a foreign country (or its people, the way a foreign-policy group does), plus any committee whose own FEC registration names one of them as its affiliate, and what each gave to or spent on current members of Congress. The same rule is applied to every country. A PAC whose name does not name a country is not found by this rule, whatever country it focuses on.", cy_by_name:"Listed because its registered name names the country", cy_by_aff:x => `Listed as an affiliate of ${x}`, cy_gave:(u, n, p) => `Gave ${u} from its own funds to ${n} current ${n === 1 ? "member" : "members"}${p ? " (" + p + ")" : ""}.`, cy_sup:u => `Spent ${u} supporting current members.`, cy_opp:u => `Spent ${u} opposing current members.`, cy_who:"Members", cy_m_g:u => `gave ${u} from its own funds`, cy_m_e:u => `forwarded ${u} from individual donors`, cy_fwd:(u, n, p) => `Forwarded ${u} from individual donors to ${n} current ${n === 1 ? "member" : "members"}${p ? " (" + p + ")" : ""}: donors gave to the committee and named the member; the committee passed the money on. This is the donors' own money, counted separately from what the committee gave.`, cy_m_s:u => `spent ${u} supporting`, cy_m_o:u => `spent ${u} opposing`, cy_src:"Public record of the affiliation", cy_note:(c, d) => `From each committee's own FEC reports for the ${c} cycle, read ${d}. Three kinds of money are kept apart and never added together: contributions from the committee's own funds to members' campaign committees; donors' money the committee forwarded as a conduit (earmarked contributions); and independent spending for or against members. Names built on "American" alone (for example "Irish American") describe a US community and are not included. A US PAC must be funded by US citizens or permanent residents: foreign nationals may not give to US campaigns.`, cy_pc_h:"PACs focused on US policy toward a specific country", cy_pc_p:"Committees on the list under Politicians that gave to or spent on this member this cycle.", opm_h:"Other political money", xl_opm:"US PACs focused on one country, and registered foreign agents, on Other political money (under Money and patterns)", opm_lead:"Two public records, kept apart from the ICE records on the other tabs: US political action committees that focus on US policy toward one country (funded, by law, by US citizens and permanent residents), and people and firms registered as agents of a foreign government or party. The same members of Congress vote on immigration enforcement and its funding, so these records are here for readers who want the whole picture of who funds and lobbies them. Where a registered foreign agent's firm also lobbies for a detention company, that is noted; nothing else here connects these groups to detention.", fg_h:"Registered foreign agents", fg_lead:"People and firms registered with the Justice Department under the Foreign Agents Registration Act to represent a foreign government, party or other foreign principal in the US.", fg_sum:(r, p, c) => `${r.toLocaleString()} registrants working for ${p.toLocaleString()} foreign principals in ${c} countries and territories.`, fg_pick:"Country", fg_choose:"Choose a country", fg_rem_n:n => `${n.toLocaleString()} removed by ICE`, fg_rem:(n, span) => `ICE removed ${n.toLocaleString()} people to this country (${span}).`, fg_by:(rg, n) => `Registered agent: ${rg} (FARA no. ${n})`, fg_both:"This registrant also lobbies for a detention company (see Political money and lobbying).", fg_since:d => `principal since ${d}`, fg_doc:"Filing that describes the work (Exhibit A/B)", fg_note:d => `From the Justice Department's FARA eFile records, read ${d}. "Foreign agent" is a legal registration status reported by the registrant, not a finding of wrongdoing. Registrants also report political contributions, but only in scanned filings, which are not read here. Countries are listed alphabetically.`, tab_orgs:"Organizations that help families", tab_news:"News coverage", tab_disp:"ICE disputes with state and local governments", dp_lead:"Formal disputes on the public record between ICE (or the Department of Homeland Security or the Justice Department acting on immigration enforcement) and a state, county, city or tribal government, or one of its agencies or officials: lawsuits either side has filed, signed orders, formal letters and subpoenas, and criminal charges and investigations involving officials or officers on either side. Each entry links its own source. Who started each one is shown; nothing here says who is right.", dp_kind:{lawsuit:"Lawsuit", law:"State or local law, and the federal response", order:"Signed order, formal letter or subpoena", charge:"Criminal charge", investigation:"Criminal investigation"}, dp_natl:"Nationwide", dp_kn:{lawsuit:n => `${n} ${n === 1 ? "lawsuit" : "lawsuits"}`, law:n => `${n} ${n === 1 ? "law" : "laws"} with a federal response`, order:n => `${n} ${n === 1 ? "order or letter" : "orders and letters"}`, charge:n => `${n} criminal ${n === 1 ? "charge" : "charges"}`, investigation:n => `${n} criminal ${n === 1 ? "investigation" : "investigations"}`}, dp_by:{federal:"Started by the federal side", state_local:"Started by the state or local side"}, dp_sum:(n, parts, f, l, last) => `${n} disputes on record: ${parts.join(", ")}. ${f} started by the federal side and ${l} by the state or local side. Latest: ${last}.`, dp_f_st:"State", dp_f_kind:"Kind", dp_all:"All", dp_shown:n => `${n} shown`, dp_status:(d, s) => `Latest on record (${d}): ${s}`, dp_stsrc:"source for this step", dp_src:"Source", dp_gov:n => `Governor now: ${n}`, dp_key_i:"Solid tags are the person\u2019s own record. Dashed tags are indirect links, through a joint fundraiser, a lobbying firm with many clients, or someone who once worked for them; they say less about the person.", dp_stale:(d, n) => `The last step found is from ${d}, ${n} days before this update; the case may have moved since.`, dp_fac:n => `Named in ${n} ${n === 1 ? "dispute" : "disputes"} between ICE and state or local governments.`, dp_fac_go:"See them", dp_sv:(n, s) => `${n} ${n === 1 ? "dispute" : "disputes"} between ICE and ${s} or its local governments`, dp_sv_go:"Open the list", dp_pc_mine:n => `Named in, or wrote the law at the center of, ${n} ${n === 1 ? "dispute" : "disputes"}:`, dp_sk:{copy:"(copy of the record, hosted elsewhere)", news:"(news report)"}, dp_dock:"Court docket", dp_newer:d => `The court docket has filings after this step (newest: ${d}); open the docket to see them.`, dp_key_h:"How to read the people on this tab", dp_key_p:"Each member of Congress is marked by how they voted on the three federal enforcement laws above, and every person is checked against the rest of this page. A marker means this page's own records show that link; tap it for the detail.", dp_v:{for:(y, n) => `voted for ${y} of ${y + n}`, ag:(y, n) => `voted against ${n} of ${y + n}`, mix:(y, n) => `split: ${y} for, ${n} against`}, dp_vk:{for:"Voted for every one of the enforcement laws they voted on", ag:"Voted against every one they voted on", mix:"Voted both ways"}, dp_tn:{dm:"detention $", jf:"joint fund", lf:"lobby firm $", fs:"ex-staff lobbies", ov:"overlap", re:"refused entry", vi:"oversight visit"}, dp_tk:{dm:"Received money from detention-company committees, or from people who work for those companies (Politicians, Follow the money)", jf:"Takes part in a joint fundraiser that received detention-company committee money; the share that reached them cannot be known", lf:"A lobbying firm hired by a detention or ICE flight company, or its lobbyists, gave to them or honored them (lobbying firm profiles)", fs:"Someone who worked for them now lobbies at a firm hired by a detention or ICE flight company (interns not counted)", ov:"Meets the overlap rule on Politicians: committee seats, contractor money and facilities", re:"Was refused entry to an ICE facility (Official visits and inspections)", vi:"Made an oversight visit to an ICE facility and published a statement"}, dp_tt:{dm:(p, s) => `Detention-company committee money: ${p}; gifts from company staff: ${s}.`, jf:x => `Joint fundraisers that received detention-company committee money: ${x}.`, lf:x => `Lobbying firms hired by detention or ICE flight companies whose political money reached them: ${x}.`, fs:x => `Former staff now lobby at: ${x}.`, ov:"Meets the overlap rule on Politicians.", re:x => `Refused entry: ${x}.`, vi:n => `${n} published oversight ${n === 1 ? "visit" : "visits"}.`}, dp_key_n:"People with no vote on record (governors, mayors, state legislators) are not marked for or against: this page has no vote of theirs on these laws. Names are matched by first and last name, so two people with the same name could be confused; each marker's detail says where the match came from. A marker is a record, not a finding of wrongdoing. The money markers come from what this page tracks: detention and ICE contractor money and the lobbying firms those companies hire. Money from groups on other sides of immigration policy is not tracked here, so its absence says nothing.", dp_law:"Law or order at issue:", dp_by_w:"written by", dp_com:s => `${s} members on the committees that write immigration law (Judiciary, Homeland Security):`, dp_fed_h:"The federal enforcement laws, and who sponsored them", dp_fed_p:"Most of ICE\u2019s powers come from the Immigration and Nationality Act and its amendments. These are the laws passed since 2025 that expand detention or fund enforcement, the same ones whose votes are on Politicians.", dp_spon:"Sponsor:", dp_gov_then:n => `Governor at the time: ${n}`, dp_reps:s => `${s}\u2019s members of Congress`, sv_gov:n => `Governor: ${n}`, dp_dead:d => `(this link did not load when checked on ${d})`, xl_dp_ref:"State and local officials refused entry to ICE facilities are listed with the other refusals on Oversight", dp_how:"Listed when two governments are on opposite sides and one of them took a formal step on the public record: filed a lawsuit, signed an order or sent a formal letter, issued a subpoena, enacted a law that the other side formally answered, or brought a criminal charge or opened a criminal investigation. ICE is on one side of every entry, or DHS or the Justice Department acting on immigration enforcement. Every entry rests on the record itself: the court filing or docket, the signed text, or the government body\u2019s own release. Where the record could only be found as a copy hosted elsewhere, or a later step only in a news report, the link says so. Protests, speeches and disputes involving only private people or groups are not listed. Federal officers below political appointees, and local employees who are not elected or appointed officials, are not named.", dp_note:"Found by hand from public records since January 2025, so the list is not complete. Each status is the latest step found, with its date; a case may have moved since. Every source link is checked each week.", xl_orgs:"Nonprofits, news outlets and agencies that post about ICE and immigration on Bluesky and Instagram", xl_news:"News about ICE and immigration from outlets across the political spectrum, through Ground News", xl_orgs_st:"Groups in one state, under Your state", tab_ven:"Other ICE contractors", vn_lead:"Companies ICE pays for things other than running detention sites: technology and data, flights, equipment, consultants and staff, medical care, construction. Each company is placed by what most of its ICE money paid for, so its whole total sits in one group; the Money tab sorts each contract by its own federal product code, so the two breakdowns differ. Detention-site operators are on Companies working with ICE.", vn_caution:"A contract shows what ICE bought, not what the company thinks about immigration. Lobbying shows what a company reported working on in Congress or the agencies, not how it voted or what it asked for.",
