  ob_note:"Ordenados por palabras en cada nombre, así que revise el nombre mismo. Los departamentos de policía universitaria se cuentan con la policía, no aquí. La lista dice quién firmó, no cuántos agentes participan ni qué han hecho.",
  gv_h:"Organismos públicos que detienen personas para ICE", gv_fed_h:"Centros federales y otros en la misma lista", ag_all_h:"Todos los acuerdos 287(g), por estado", ag_all_sum:(n, st, k) => `${n} acuerdos con ${k} agencias en ${st} estados y territorios`, gv_lead:"Los centros de la lista de detención de ICE que pertenecen a un gobierno estatal o local, o que ICE usa mediante un acuerdo con uno. Agrupados por el tipo de contrato que da ICE. Esto es aparte de los acuerdos 287(g) de arriba.",
  ct:{"IGSA":"Acuerdo con un gobierno estatal o local", "DIGSA":"Acuerdo con un gobierno local; el centro solo tiene detenidos de ICE", "USMS IGA":"Cárcel local usada mediante un acuerdo del Servicio de Alguaciles", "STATE":"Prisión estatal", "BOP":"Oficina Federal de Prisiones", "SPC":"Propiedad de ICE", "STAGING":"Sitio de tránsito de ICE", "FAMILY":"Centro de detención familiar", "CDF":"Empresa privada con contrato con ICE", "USMS CDF":"Empresa privada con contrato del Servicio de Alguaciles"},
  ct_def:{"IGSA":"Término de ICE: Intergovernmental Service Agreement (IGSA). ICE dice que son de propiedad pública y los opera el gobierno estatal o local o un contratista privado, y por lo general también tienen otros presos.", "DIGSA":"Término de ICE: Dedicated Intergovernmental Service Agreement (DIGSA). El acuerdo es con un organismo público, pero ICE dice que estos centros suelen ser operados por contratistas privados. La lista de ICE no nombra a la empresa.", "USMS IGA":"Término de ICE: USMS IGA. ICE usa camas bajo un contrato que el Servicio de Alguaciles ya tiene con la cárcel.", "BOP":"Una prisión federal operada por la Oficina de Prisiones.", "SPC":"Término de ICE: Service Processing Center. Propiedad del gobierno, con personal federal y contratado.", "FAMILY":"La lista de ICE no da un tipo de contrato para este centro.", "CDF":"Etiqueta de ICE: CDF, centro de detención por contrato.", "USMS CDF":"Etiqueta de ICE: USMS CDF. Un centro privado contratado por el Servicio de Alguaciles donde ICE usa camas."},
  ct_gm:n => `ICE paga por al menos ${n} camas`, ct_rate:(r, d, nw) => `calificación del propio ICE: ${r}${d ? ", por su inspección del " + d : ""}${nw ? ". Hay una inspección más reciente, iniciada el " + nw + ", en la lista de informes; el archivo de ICE aún no la califica" : ""}`, ct_insp:d => `última inspección ${d}`, ct_sched:fy => `inspección programada ${/^FY\d\d$/.test(fy) ? "para el año fiscal 20" + fy.slice(2) : fy}`, ct_rating:{"Pass":"aprobada", "Fail":"reprobada", "Pending Final Report":"informe pendiente"},
  ct_note:(d, n) => `De la lista de centros en el archivo de estadísticas de detención de ICE con fecha ${d} (${n} centros). Solo incluye los lugares que ICE usaba en esa fecha y no nombra a la empresa que opera cada centro.`, ct_h:"Contrato y última inspección", ct_src:"Del archivo de estadísticas de detención de ICE. La calificación es la del propio ICE, aprobada o reprobada según sus normas de detención, a la fecha de ese archivo. Un centro puede aprobar con deficiencias citadas: el número de deficiencias aparece con cada informe.",
  co_lead:"Centros de detención que ICE opera mediante una empresa privada. A quién se le paga, y cuánto, está en la pestaña Siga el dinero. Solo organizaciones; no se nombra a ninguna persona.", co_fac_h:"Centros de detención operados bajo contrato privado", co_fac_lead:"Centros que ICE mismo clasifica como centros de detención por contrato. Muchos otros centros son operados por empresas mediante un acuerdo con un gobierno local; esos están en la pestaña Agencias estatales y locales que trabajan con ICE, porque un gobierno firmó el acuerdo.",
  mf_h2:"Qué compró ICE y a quién se le pagó", mf_owned:p => `Propiedad de ${cn(p)}`, mf_anc:"Propiedad de una corporación nativa de Alaska", co_amt1:m => m < 0 ? "\u2212" + T.es.co_amt1(-m) : m >= 1000 ? `$${(m / 1000).toFixed(1)} mil millones` : m > 0 && m < 1 || m === 0 ? "menos de $1 millón" : m === 1 ? "$1 millón" : `$${m} millones`,
  mf_src_h:"El presupuesto de ICE y las dos leyes de presupuesto", mf_src_p:"El Congreso le da a ICE su dinero. Casi todo está en una sola cuenta, Operaciones y Apoyo. En julio de 2025 el Congreso agregó unos $75 mil millones al presupuesto anual de ICE, incluidos $45 mil millones para detención, para gastar hasta septiembre de 2029. Por eso el monto disponible es mucho mayor que lo que se gasta cada año.", mf_src_cols:["Año", "Disponible", "Comprometido", "Pagado"], mf_fy:fy => `AF ${fy}`,
  mf_src_note:"Los años fiscales federales van de octubre a septiembre. El AF 2026 terminó el 30 de septiembre; sus cifras aún pueden revisarse. \"Disponible\" incluye dinero que quedó del año anterior, así que no sume los años. Los contratos fueron cerca de un tercio de lo que ICE comprometió; el resto es sobre todo el pago de su propio personal y pagos a otros gobiernos, que esta página no puede desglosar.",
  mf_acct_h:fy => `Cuentas de las que ICE gastó en el AF ${fy}`, mf_acct:{"Operations and Support":"Operaciones y Apoyo", "Procurement, Construction, and Improvements":"Adquisiciones, Construcción y Mejoras", "Student and Exchange Visitor Program (fees)":"Tarifas que pagan estudiantes extranjeros y sus escuelas", "Immigration User Fee Account (fees)":"Tarifas a pasajeros internacionales de avión y barco", "Breach Bond/Detention Fund (forfeited bonds)":"Fianzas de inmigración perdidas"},
  mf_acct_note:"Las tres últimas no son dinero de impuestos: son tarifas y fianzas perdidas que la ley permite gastar a ICE.", mf_law:"La ley de julio de 2025 (H.R. 1) en Congress.gov",
  mf_own_h:"Quién es dueño de las empresas", mf_own_p:"La empresa matriz de cada compañía, según el registro federal de contratistas. Las empresas sin línea aquí figuran como su propio dueño principal.", mf_own_roll:"Un dueño, varios contratistas", mf_own_list:"Empresas matrices registradas",
  mf_own_note:"Esto llega solo hasta las empresas. No enumera accionistas ni nombra a las personas dueñas de empresas privadas: esta página no nombra a dueños particulares. Para las empresas que cotizan en bolsa, los mayores accionistas figuran en sus informes ante la Comisión de Bolsa y Valores (SEC). El registro puede tardar en reflejar una venta o fusión.",
  mf_sub_h:"A quién pagaron después los contratistas", mf_sub_p:"", mf_sub_p2:(tot, n, p, top, pct) => `Todos los subcontratos que los contratistas informaron sobre contratos de ICE en el mismo período: ${tot} de ${p} contratistas a ${n} empresas. El ${pct}% viene de un solo contratista, ${top}.`, mf_sub_by:"Por contratista", mf_sub_share:(c, pct) => `ICE comprometió ${c} con este contratista; los subcontratos que informó son el ${pct}% de eso.`, mf_sub_both:"Pagadas por dos vías: empresas que son contratistas directas y también subcontratistas", mf_sub_bothp:"Estas empresas reciben dinero directamente de ICE y también a través de otro contratista.", mf_sub_bothl:(d, s2) => `${d} directamente de ICE · ${s2} más como subcontratista`, mf_sub_end:"El rastro termina aquí. Las reglas federales solo exigen informar el primer nivel de subcontratos, así que lo que un subcontratista pagó a sus propios proveedores, personal o arrendadores no está en ningún registro público. Para una empresa que cotiza en bolsa, su informe anual da totales pero no a quién se le pagó.", mf_sub_note:"Muy incompleto. Los contratistas deben informar los subcontratos por encima de cierto monto, y muchos no lo hacen: solo se informan unos {subs} frente a {total} en contratos. CSI Aviation, el mayor contratista, no informa ninguno, aunque alquila aviones a aerolíneas. Una línea ausente significa que no se informó, no que no se pagó a nadie.",
  mg_find:"Buscar una empresa o un dueño", mf_short:v => { const a = Math.abs(v), x = a >= 1000 ? `$${(a / 1000).toFixed(1)} mil millones` : a >= 1 ? `$${Math.round(a)} millones` : `$${Math.round(a * 1000)} mil`; return v < 0 ? "−" + x : x; },
  mt_total:(a, b) => `comprometidos con contratistas en los años fiscales ${a} a ${b}, en contratos del propio ICE (el dinero de ICE en contratos de la sede del DHS se suma en el gráfico por agencia)`, mt_top:g => `de eso para una sola cosa: ${g.toLowerCase()}`, mt_big:n => `para ${n}, la mayor empresa individual`, mt_fam:(n, k, top) => `para ${n} a través de ${k} de sus empresas${top ? ", la mayor cantidad para un solo dueño" : ""}`, mf_ice_note:(a, b) => `${a} en contratos propios de ICE más ${b} de dinero de ICE en contratos adjudicados por la sede del DHS. En otras partes de la página se usa la cifra de ${a} cuando se habla solo de los contratos propios de ICE.`, mt_five:"de todo el dinero de contratos fue para cinco contratistas", mt_beds:n => `camas que ICE paga estén ocupadas o no, en ${n} centros`, mt_beds_est:(a, r) => `Unos ${a} al año a la tarifa mediana de ICE de $${r} por cama al día (una estimación).`, mt_bf:"Ocupadas en un día promedio", mt_be:"Pagadas y vacías", mt_bu:"Sin cifra en el archivo de ICE", mt_empty_op:e => `${e} camas pagadas vacías en un día promedio`, mt_empty_t:(e, r) => `al año por unas ${e} camas garantizadas vacías en un día promedio, a $${r} por cama (estimación)`, mt_empty_chg:d => `Unos $${d} al día`, mt_empty_note:fy => `Vacía significa que un centro tuvo menos personas en un día promedio del año fiscal ${fy} hasta ahora que el mínimo que ICE garantizó pagar, según el propio archivo de estadísticas de detención de ICE. Las cifras en dólares usan la tarifa mediana de ICE por cama al día y son estimaciones, no precios de contrato. Si una cama pagada y vacía es un desperdicio lo decide el lector.`, mt_bcost_all:(e, d, y, r) => `Todos los centros: unas ${e} camas pagadas vacías en un día promedio. A $${r} por cama, unos $${d} al día, ${y} al año (estimación).`, mt_bcost:(y, d, r) => `Camas vacías a $${r} al día: unos $${d} al día, ${y} al año (estimación)`, mt_bseg:(f, e, tot, u) => `${f} ocupadas · ${e} vacías · ${tot} garantizadas${u ? ` · ${u} sin cifra` : ""}`, mt_beds_empty:(e, a) => `Unas ${e} quedaron vacías en un día promedio: aproximadamente ${a} al año pagados por camas sin usar.`,
  mt_beds_used:(b, n, u, e, fy, a, r) => `Ocupadas y vacías: en los ${n} centros donde el archivo de ICE da ambas cifras hay ${b} camas garantizadas. En un día promedio del año fiscal ${fy} hasta ahora, unas ${u} estuvieron ocupadas y unas ${e} vacías (contando solo los centros con menos personas que su mínimo garantizado). A $${r} por cama al día, las camas garantizadas vacías suman aproximadamente ${a} al año, con las mismas salvedades: las tarifas reales varían por contrato, y un centro cuya garantía empezó a mitad de año parece más vacío de lo que está ahora. Los centros por encima de su mínimo pagan aparte por las personas adicionales; eso no se cuenta aquí.`, mt_beds_how:(b, r, a) => `Estimación: ${b} camas garantizadas × $${r} al día (la tarifa mediana por cama de ICE en el año fiscal 2026, según la GAO) × 365 días ≈ ${a} al año. Es una guía aproximada, no una cifra que informe ICE: cada contrato fija sus propias tarifas, a menudo con precios distintos para el mínimo garantizado y para las camas adicionales, y algunos centros cuestan mucho más (los centros de la Oficina de Prisiones una mediana de $182; el centro de carpas de Florida $249).`,
  mb_h:"Camas: cuánto cuestan y las que ICE paga estén ocupadas o no", mb_g:"Camas que ICE paga estén ocupadas o no", mb_p:(tot, n, all) => `La lista de centros de ICE muestra un "mínimo garantizado" en ${n} de ${all} centros: la cantidad de camas que paga cada día aunque estén vacías. En total son ${tot} camas. La lista da el número de camas, no el precio por cama.`, mb_by:"Camas garantizadas por tipo de contrato", mb_top:"Las 15 garantías más grandes",
  mb_note:d => `Del archivo de estadísticas de detención de ICE con fecha ${d}. A un centro sin mínimo garantizado se le paga solo por las camas usadas. Las tarifas diarias están en los contratos mismos, que esta página no tiene.`,
  mp_h:"Dinero político de las empresas de detención", mp_p:(tot, n, d) => `Tres empresas que operan centros de detención para ICE tienen cada una un comité político que da dinero a campañas de candidatos y a comités de partidos. En los ciclos electorales de 2024 y 2026 (desde enero de 2023) esos tres comités informaron haber dado ${tot} a otros ${n} comités. Datos consultados en la Comisión Federal de Elecciones (FEC) el ${d}.`,
  mp_pac:{G:"The GEO Group", C:"CoreCivic", M:"Management & Training Corporation"}, mp_cyc:(a, b) => `ciclo 2024 ${a} · ciclo 2026 hasta ahora ${b}`, mp_by:"A dónde fue", mp_list:"Todos los comités que recibieron dinero",
  mp_k:{PREP:"Comités del Partido Republicano", PDEM:"Comités del Partido Demócrata", HREP:"Campañas a la Cámara, republicanas", HDEM:"Campañas a la Cámara, demócratas", H:"Campañas a la Cámara, otro partido o sin partido registrado", SREP:"Campañas al Senado, republicanas", SDEM:"Campañas al Senado, demócratas", S:"Campañas al Senado, otro partido o sin partido registrado", Q:"Otros comités: fondos de liderazgo, recaudaciones conjuntas y otros comités políticos"},
  mp_from:x => `de ${x}`, mp_usd:n => (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString("en-US"),
  mp_note:"Qué es esto: dinero que pasó de un comité registrado a otro, en registro público. Los nombres son los de los comités receptores tal como están registrados; un comité de campaña lleva el nombre de su candidato, pero un comité de partido o una recaudación conjunta no es ningún funcionario en particular. Qué no es: no incluye donaciones personales de ejecutivos o empleados (esas están en Donantes identificados, más abajo), gastos de asociaciones gremiales ni cabildeo. Un monto negativo es un reembolso. Una donación no muestra por qué se dio ni que haya cambiado un voto. Otros contratistas de ICE no tienen comité registrado, o lo tienen pero su negocio principal no es la detención, y quedan fuera.",
  mv_h:"Miembros del Congreso vinculados a ese dinero, y su voto sobre la ley de presupuesto de julio de 2025", mv_p:(n, usd, loose) => `${usd} del total fueron a un comité de campaña o fondo de liderazgo que la FEC vincula a un solo miembro del Congreso: ${n} miembros. Los otros ${loose} fueron a comités de partido y comités de recaudación conjunta que no pertenecen a ningún miembro en particular. El voto mostrado es sobre H.R. 1, la ley de julio de 2025 que dio a ICE su mayor presupuesto de detención: votación 190 de la Cámara el 3 de julio de 2025 (218 a 214) y votación 372 del Senado el 1 de julio de 2025 (50 a 50, con el desempate del Vicepresidente).`,
  mv_base:(y, n, t) => `Léalo teniendo en cuenta que casi todos votaron con su partido. De los ${t} miembros vinculados que estaban en el cargo, ${y} votaron a favor y ${n} votaron en contra. Pero todos los republicanos del Congreso salvo cinco votaron a favor y todos los demócratas votaron en contra, recibieran o no este dinero. Los registros muestran quién recibió fondos y cómo votó; no muestran que una cosa causara la otra.`,
  mv_yes:"Votaron a favor", mv_no:"Votaron en contra", mv_out:"No estaban en el Congreso para la votación", mv_ch:{H:"Cámara", S:"Senado"}, mv_pt:{R:"Republicano", D:"Demócrata", I:"Independiente"}, mv_split:(c, l) => l ? (c ? `campaña ${c} + fondo de liderazgo ${l}` : `fondo de liderazgo ${l}`) : "comité de campaña",
  ml_h:"Cabildeo de las empresas de detención y de vuelos de ICE", ml_p:"Lo que cada empresa informó haber gastado en cabildeo ante el Congreso y agencias federales, según sus informes trimestrales bajo la Ley de Divulgación de Cabildeo. 2026 cubre de enero a junio.",
  ml_co:{GEO:"The GEO Group", CC:"CoreCivic", MTC:"Management & Training Corporation", CSI:"CSI Aviation"}, ml_own:"Informe de la propia empresa", ml_out:"Informes de firmas externas", ml_yr:"Año", ml_firms:"Firmas de cabildeo contratadas, 2023 a mediados de 2026", ml_tg:"A quién cabildearon (número de informes que nombran a cada uno)",
  ml_note:"Las dos columnas no deben sumarse sin cuidado. Una empresa con cabilderos propios debe informar todo lo que gasta, incluido lo que paga a firmas externas, así que las columnas pueden superponerse; pero los informes de las firmas externas a veces superan el de la propia empresa. La cifra real es al menos la columna mayor y como máximo las dos juntas. Los informes nombran la cámara o agencia, no al miembro o funcionario, y los montos se redondean a $10,000. Los nombres de los cabilderos están en los informes y no se repiten aquí. No se encontraron informes de cabildeo de Akima, MVM, GardaWorld, Deployed Resources ni LaSalle Corrections con esos nombres.",
  ms_h:"Lo que las empresas en bolsa dicen a sus inversionistas", ms_p:"GEO Group y CoreCivic cotizan en bolsa, por lo que deben presentar informes anuales ante la Comisión de Bolsa y Valores (SEC). Esos informes dicen cuánto de sus ingresos viene de ICE.",
  ms_line:(fy, rev, pct, ice) => `${fy}: ingresos ${rev}, ${pct}% de ICE (unos ${ice})`, ms_hold:"Mayores accionistas registrados", ms_ins:"Todos los directores y ejecutivos juntos", ms_src:"informe anual", ms_prx:"declaración a accionistas",
  ms_note:"Los accionistas listados son los que superan el 5%, según la declaración de marzo de 2026 de cada empresa. BlackRock y Vanguard son administradoras de fondos: las acciones están sobre todo en fondos indexados de millones de ahorristas, incluidos planes de jubilación. El monto de ICE es el porcentaje declarado por los ingresos declarados, así que está redondeado. Los otros grandes contratistas son privados o parte de grupos mayores y no presentan nada comparable.",
  mx_h:"Lo que los registros no muestran", mx:["El precio diario de una cama de detención en cada centro. La GAO da la mediana de ICE; la tarifa de cada centro está en su contrato, no en una tabla pública.", "Quién es dueño de las empresas privadas. Los mayores accionistas de las empresas que cotizan están en Dinero político y cabildeo.", "Lo que se ha pagado a cada empresa, a diferencia de lo comprometido. Los montos comprometidos pueden cancelarse o crecer."],
  oc_link:(y, a, b, c) => `En el año fiscal ${y} ICE comprometió ${a} en contratos, servicios y suministros. ${b} están ligados a una adjudicación publicada con un beneficiario identificado. El resto, unos ${c}, no tiene beneficiario en los registros públicos: los pagos a otras agencias, como la Oficina de Prisiones, y a condados por espacio en cárceles se registran de esta forma.`, oc_min_h:y => `Gasto de ICE en categorías más detalladas, año fiscal ${y}`, oc_min_note:"Las categorías de gasto del propio gobierno federal (clases de objeto), según las reporta ICE. El número tras cada nombre es el código de la categoría.", oc_min:{"11.1":"Sueldos, personal de tiempo completo", "11.3":"Sueldos, otro personal", "11.5":"Horas extra y otros pagos", "11.8":"Pagos especiales", "12.1":"Prestaciones", "13.0":"Prestaciones de exempleados", "21.0":"Viajes y traslado de personas", "22.0":"Transporte de bienes", "23.1":"Alquiler pagado a la GSA", "23.2":"Otros alquileres", "23.3":"Teléfonos, servicios y otros cargos", "24.0":"Impresión", "25.1":"Asesoría y consultoría", "25.2":"Otros servicios de fuentes no federales", "25.3":"Bienes y servicios de otras agencias federales", "25.4":"Operación y mantenimiento de instalaciones", "25.5":"Investigación", "25.6":"Atención médica", "25.7":"Mantenimiento de equipo", "25.8":"Manutención de personas", "26.0":"Suministros", "31.0":"Equipo", "32.0":"Terrenos y edificios", "41.0":"Subvenciones", "42.0":"Reclamaciones e indemnizaciones", "43.0":"Intereses", "44.0":"Reembolsos", "99.0":"Otros"},
  st_money:"Trabajo de contratos de ICE realizado en el estado", st_money_n:(p, a, b) => `${p}% de todo el dinero de contratos financiados por ICE, del ${a} al ${b}, según dónde se hace el trabajo; los servicios gestionados desde la sede aparecen en Virginia y DC`,
  net_back:(b, n) => `Aquí se dibuja el dinero pagado. También se recuperaron ${b} de contratos anteriores, así que la cifra neta es ${n}.`, net_h:"Toda la red: quién paga a quién", net_lead:"Cada pagador a la izquierda; a la derecha, las empresas y los gobiernos a los que paga, agrupados por dueño. El ancho de cada banda es el dinero comprometido de octubre de 2023 a septiembre de 2026. Una empresa con bandas de varios pagadores recibe pagos de varias agencias. Toque cualquier recuadro para resaltar sus vínculos.", net_rest:"Todos los demás", net_n:n => `${n} pagadores`, net_tap:"Toque un pagador o una empresa para ver sus vínculos.", net_paidby:"Le pagan:", net_parts:x => `Incluye: ${x}`, net_subs:n => `Informó ${n} subcontratos; los mayores:`, net_chain:x => `Propiedad: ${x}`,
  mgr_src:"De dónde viene el dinero", mgr_src_l:"Las leyes de presupuesto y el gasto de ICE por tipo (incluido su propio personal).", mgr_who:"Quién lo recibe", mgr_who_l:"En el orden en que se mueve el dinero: cada agencia que paga, toda la red de una vez, lo que compró ICE, contratos sin competencia, cada gran contratista, empresas a las que pagan varias agencias, quién es su dueño, camas (cuánto cuestan y las que se pagan llenas o vacías) y a quién pagaron después los contratistas.", mgr_infl:"Dinero político y cabildeo", mgr_infl_l:"El dinero de los comités políticos y del personal de las empresas a miembros del Congreso, y el cabildeo.", mgr_gaps:"Lo que los registros no muestran",
  mf_h:"Siga el dinero", mf_lead:(tot, M) => `ICE comprometió ${tot} con contratistas del ${M.from} al ${M.to}, y otras agencias pagaron miles de millones más para detener, cuidar o trasladar a personas. Empiece por el recorrido de abajo: toque un pagador para seguir su dinero hasta las empresas que recibieron pagos.`,
  mf_g:{GUARD:"Guardias y operación de centros de detención", AIR:"Vuelos", SUPPORT:"Servicios de gestión, logística y apoyo", IT:"Sistemas informáticos y software", EQUIP:"Radios, chalecos antibalas y otro equipo", MEDICAL:"Atención médica", BUILD:"Construcción", OTHER:"Todo lo demás"}, mf_oc_lead:n => `Todos los códigos federales de productos y servicios que no están en un grupo de arriba: ${n} códigos. Primero los más grandes, con el nombre que les da el propio gobierno (en inglés), y luego las empresas que más cobraron bajo ellos.`, mf_oc_h:"En qué se gastó", mf_oc_who:"A quién se pagó más", mf_oc_rest:n => `${n} códigos más pequeños juntos, descontadas las adjudicaciones canceladas`,
  mf_gd:{GUARD:"Código federal S206, servicios de guardia. Es el código que se usa para operar centros de detención y para custodiar y transportar detenidos.", AIR:"Código federal V211, viajes aéreos de pasajeros. Vuelos chárter, incluidos los vuelos de deportación.", SUPPORT:"Nueve códigos federales de gestión de programas, logística, verificación de antecedentes y servicios similares. El código no dice cuál fue el trabajo.", IT:"Doce códigos federales de software, equipos y mano de obra informática.", EQUIP:"Equipo de radio y video, chalecos antibalas, ropa especial y muebles de oficina.", MEDICAL:"Código federal Q201, atención médica administrada.", BUILD:"Código federal Y1JZ, construcción de edificios.", OTHER:"Todos los códigos más pequeños juntos. No se desglosan aquí."},
  mf_rest:"Otras empresas de este grupo", mf_note:"Sobre estas cifras de contratos. Los montos son obligaciones (dinero comprometido), no pagos, consultados en USAspending.gov (la fecha está en Acerca de estos datos), y cambiarán. Los grupos vienen del código escrito en cada contrato, no de leer los contratos. Solo cubren contratos: el dinero que ICE paga a condados y al Servicio de Alguaciles por detener personas en su mayoría no está aquí. Lo que las empresas pagaron a subcontratistas está en A quién pagaron después los contratistas; quién es dueño de cada empresa está en Camas y dueños.",
  nc_h:"Contratos adjudicados sin competencia y competencias con una sola oferta", nc_lead:(n, all, a, tot, pct) => `${n} de los ${all} contratos de ICE de $1 millón o más se adjudicaron sin competencia. Suman ${a} de los ${tot} comprometidos en esos contratos en el período: ${pct}%.`, nc_what:"«Sin competencia» es la etiqueta del propio gobierno. La ley lo permite en casos fijos, como cuando solo una empresa puede hacer el trabajo o la necesidad es urgente, y el registro debe decir cuál. Esta sección enumera cada uno de esos contratos para que se puedan revisar. No dice que alguno haya sido indebido.", nc_reason_h:"La razón que consta", nc_none:"No consta la razón", nc_all:"Todos los contratos adjudicados sin competencia", nc_find:"Buscar por empresa, razón o descripción", nc_hits:n => n === 1 ? "1 contrato coincide." : `${n} contratos coinciden.`, nc_off:n => n === 1 ? "1 oferta recibida" : `${n} ofertas recibidas`, nc_one_h:"Abiertos a competencia, una sola oferta recibida", nc_one_p:(n, a) => `${n} contratos constan como competidos pero recibieron una sola oferta, por ${a} en el período. El registro los cuenta como competidos.`, nc_one_all:"Todos los contratos con una sola oferta", nc_flag_h:"Patrones que merecen una mirada más de cerca", nc_flag_p:"Cada lista es un filtro simple sobre los registros, elegido porque son los casos que los auditores suelen examinar primero. Aparecer aquí no es una conclusión contra nadie.", nc_f1:"Sin competencia y $50 millones o más en el período", nc_f2:fy => `Sin competencia, a una empresa sin dólares de contratos de ICE en el año fiscal ${fy}`, aw_more:n => `${n} empresas más con un contrato de $1 millón o más`, aw_h:"Sus contratos de $1 millón o más", aw_h2:n => `${n}: contratos de $1 millón o más`, aw_open:"Abrir este contrato en USAspending", aw_win:(w, l) => `${w} comprometidos en este período · ${l} durante la vida del contrato hasta ahora`, aw_life:l => `${l} durante la vida del contrato hasta ahora (no se leyó el monto de este período)`, aw_c:{C:"Con competencia", N:"Sin competencia", L:"Orden sin oportunidad justa de competir", "":"No consta cómo se adjudicó"}, nc_L:"Orden sin oportunidad justa de competir", nc_lead_L:(n, a) => `${n} de ellos son órdenes hechas bajo un contrato que sí se adjudicó con competencia, pero sin dejar competir por la orden a los demás titulares del contrato (el registro nombra la excepción, como fuente única, urgencia u orden de continuación). Suman ${a}. Versiones anteriores de esta página los contaban como adjudicados con competencia.`, fw_h:c => `Contratos de ICE de servicios de guardia realizados en ${c}`, fw_note:c => `Contratos de ICE de $1 millón o más registrados bajo el código federal de servicios de guardia, el código que se usa para operar centros de detención, con ${c} como lugar de ejecución. Se muestran aquí porque este es el único centro de la lista de ICE en ${c}. Los registros nombran un lugar, no un centro, así que un contrato puede cubrir otro trabajo en la misma ciudad.`, aw_note:M => `Cada contrato de ICE de $1 millón o más con actividad del ${M.from} al ${M.to}, según USAspending, consultado el ${M.read}. El primer monto es lo que ICE comprometió dentro de ese período; el segundo es durante toda la vida del contrato, que puede empezar antes. Un contrato de menos de $1 millón en toda su vida no se lista, así que la suma puede ser menor que el total de tres años de la empresa.`, co_ven_find:"Buscar un contratista", co_ven_hits:n => n === 1 ? "1 contratista coincide." : `${n} contratistas coinciden.`, yr_see:"Los montos de cada empresa año por año están en \u201cTodos los grandes contratistas\u201d.", co_ven_all:"Todos los grandes contratistas, de mayor a menor", co_ven_h:"Empresas a las que ICE ha comprometido más dinero", co_ven_lead:(n, M) => `Los ${n} mayores receptores de contratos de ICE del ${M.from} al ${M.to}, según USAspending.gov el ${M.read}.`, co_amt:m => m < 0 ? "\u2212" + T.es.co_amt(-m) : m >= 1000 ? `$${(m / 1000).toFixed(1)} mil millones` : m > 0 && m < 1 || m === 0 ? "menos de $1 millón" : m === 1 ? "$1 millón" : `$${m} millones`, co_dg:a => a ? `Registrado bajo los códigos de industria de servicios de guardia e instalaciones: ${a} (\u201cQué compró ICE\u201d agrupa según lo que se compró, así que sus totales difieren)` : "Registrado bajo los códigos de industria de servicios de guardia e instalaciones",
  co_ven_note:"Son obligaciones (dinero comprometido en contratos), no pagos realizados, y los informes posteriores las cambiarán. La etiqueta marca contratos registrados bajo los códigos federales de servicios de guardias de seguridad y de apoyo a instalaciones; los registros no dicen qué más hace una empresa. Una misma empresa matriz puede aparecer con varios nombres. Los pagos a condados mediante acuerdos en su mayoría no están en estos datos.", co_ven_src:"USAspending.gov",
  lg_h:st=>`Ayuda legal gratuita listada para ${st}`, lg_aba_any:n=>`Una línea de referencia para personas en detención migratoria, que la misma lista nombra para tribunales de inmigración en ${n} estados.`, lg_aba:"Desde la detención de ICE, marque 2150# para esta línea. El Departamento de Justicia indica el número gratuito para personas detenidas en sitios militares.", lg_note:"De la lista de proveedores de servicios legales gratuitos del Departamento de Justicia, octubre de 2026. Es una copia parcial: consulte la lista completa para ver más proveedores y qué hace cada uno.", lg_full:"Abrir la lista completa",
  lg_kind:{nonprofit:"Sin fines de lucro", referral:"Servicio de referencia", attorney:"Abogado privado"}, lg_courts:c=>`Listado para: ${c}`,
  vs_ice:"Página de ICE sobre este centro: horarios de visita, llamadas, correo y dinero", vs_none:"ICE no tiene una página pública sobre este centro.",
  vs_wait:"Las reglas de visita y de llamadas de cada centro en lenguaje sencillo aún no están en esta página. Llamar al centro es la forma más segura de preguntar.",
  dr_h:n=>`Informes públicos de ICE: ${n} ${n==1?"muerte vinculada":"muertes vinculadas"} a este centro desde octubre de 2022`, dr_link:d=>`Informe de ICE sobre la muerte del ${d}`,
  dr_ev:{B:"El informe de ICE nombra este centro, y el registro de detención de ICE muestra una muerte aquí en esa fecha.", R:"El registro de detención de ICE muestra una muerte aquí en esa fecha. El informe no era claro o no se podía leer.", P:"El informe de ICE dice que la persona estaba detenida aquí. No hay registro de detención que coincida."},
  dr_note:"Cada enlace abre el informe del propio ICE, que nombra a la persona. Una muerte se vincula al centro que tenía detenida a la persona cuando murió o fue llevada al hospital, así que la muerte pudo ocurrir en un hospital. Se omiten los informes que no se pudieron vincular con confianza a un centro.",
  nat_match:m=>`De ${m.total} muertes que ICE ha informado desde ${m.from}, ${m.placed} aparecen en la página de un centro, ${m.both} de ellas confirmadas tanto por el informe de ICE como por sus registros de detención. ${m.outside} ocurrieron fuera de cualquier centro: durante un arresto, en tránsito o antes de llegar a uno. ${m.checking} no se pudieron vincular a un solo centro. Cada informe se leyó completo.`,
  nat_none:"Los informes de este año aún no se han leído.", nat_how:"Cada fecha abre el informe de ICE sobre esa muerte. Toque el nombre de un centro para abrir su página.", nat_untied:"No vinculada a un solo centro",
  nat_ev:{B:"confirmada por el registro de detención de ICE", R:"según el registro de detención de ICE; informe poco claro", P:"según el informe de ICE", O:"", U:""},
  fm_h:"Mapa de centros, por tipo", fm_show:"Mostrar", fm_show_all:"Todos los centros", fm_show_watch:"Centros en la lista de alertas", fm_k:{D:"Centro de detención migratoria", J:"Cárcel local o estatal", H:"Sala de retención u oficina de ICE", F:"Prisión federal", S:"Centro de tránsito", O:"Otro o no claro"},
  fm_note:"Toque un punto para abrir ese centro (cada centro también está en el buscador y en las listas, para quien usa teclado o lector de pantalla). Toque una etiqueta para ocultar o mostrar ese tipo. Los tipos se deducen del nombre y código de cada centro, porque la clasificación de ICE no está en estos registros, así que algunos están mal agrupados.",
  fm_about:"Cómo leer el mapa", fm_extra_h:"Sobre el mapa de centros",
  fm_nopos_h:"En los registros de ICE, pero sin ubicación", fm_nopos_note:"Estos centros aparecen en los registros de detención de ICE, así que hubo personas detenidas allí, pero los registros no dan dirección ni posición en el mapa. La mayoría son salas de espera. Se listan por el estado que dan los registros.",
  fm_off_h:"En territorios de EE. UU., no dibujados en este mapa", fm_off_note:"Tienen una ubicación conocida en Puerto Rico, Guam o las Islas Marianas del Norte, que este mapa no muestra.", fm_nostate:"Sin estado indicado",
  fm_noloc:"Este centro está en los registros de detención de ICE, pero los registros no dan dirección ni ubicación.",
  om_h:"Dónde hubo inspecciones, visitas y negaciones de entrada", om_k:["Informe de inspección de ICE", "Entrada negada a un funcionario", "Visita de miembro del Congreso", "Muerte informada por ICE"], om_note:"Los puntos azules más grandes indican más informes de inspección. Toque un punto para abrir ese centro (cada uno también está en las listas de abajo), o una etiqueta para ocultar o mostrar ese tipo. Las visitas y negaciones solo aparecen cuando la fuente nombra un solo centro, así que la mayoría no está en el mapa.",
  ptr_h:"Patrones en los registros", ptr_lead:"Contado a partir de lo que hay en esta página. Los números son pequeños y las fuentes incompletas: son pistas para verificar, no conclusiones.",
  tr_q_h:"Comunicados de los miembros a lo largo del tiempo", tr_q:Q=>{ const d = Q.reduce((s,q)=>s+q[2],0), v = Q.reduce((s,q)=>s+q[1],0); return `${v} comunicados sobre visitas y ${d} sobre negación de entrada, de ${Q[0][0]} a ${Q[Q.length-1][0]}.`; },
  tr_q_note:(a, b, old, und) => `De las páginas de prensa de los propios miembros. Se pudieron leer las páginas de ${a} de ${b} miembros, el comunicado más antiguo leído es del ${old}, y las páginas más antiguas se leyeron de forma menos completa, así que un trimestre tranquilo puede significar solo que no se leyó.${und ? " " + und + " comunicados no tienen fecha y no están en este gráfico." : ""}`,
  tr_r_h:"Razones dadas para negar la entrada", tr_r:(n,k)=>`De las ${n} negaciones verificadas, ${k} citan un requisito de aviso previo.`,
  tr_i_h:"Inspecciones de ICE por año fiscal", tr_i:(n,m)=>`Hay ${n} informes de inspección enlazados. ${m} centros tienen más de uno.`, tr_i_note:"Solo informes que ICE ha publicado y que se pudieron vincular a un centro. ICE publica los informes con retraso, así que el año más reciente aún puede crecer.",
  tr_s_h:"Estados con más informes de inspección",
  tr_d_h:"Muertes e inspecciones", tr_d:(n,k)=>`${n} centros tienen al menos una muerte vinculada desde octubre de 2022. ${k} de ellos no tienen ningún informe de inspección de ICE enlazado aquí.`, tr_d_note:"El número entre paréntesis son las muertes vinculadas al centro. Que no haya informe enlazado puede significar que no se publicó o que no se pudo vincular por nombre. Las salas de espera y cárceles de uso breve a menudo no se inspeccionan bajo el mismo programa.",
  lf_psum:P=>{ const a = P.find(r => /postpartum/i.test(r[0])), m = P.find(r => /Miscarr/.test(r[0])); return (a ? `${a[2]} personas embarazadas, en posparto o lactantes bajo custodia el 16 de febrero de 2026. ` : "") + (m ? `${m[2]} abortos espontáneos registrados. ` : "") + "Los nacimientos no se informan."; },
  lf_dsum:(Y,m,E)=>`Desde octubre de 2022: ${Y.map(([y,c]) => `${c} en el año fiscal ${y}`).join(", ")}.` + (m ? ` ${m.placed} de ${m.total} vinculadas a un centro.` : "") + (E && E.length ? ` Años anteriores, contadas pero no ubicadas en un centro aquí: ${E.map(([y,c]) => `${c} en el año fiscal ${y}`).join(", ")}.` : ""),
  pa_h:"Denuncias de abuso sexual", pa_k:"Denuncias de abuso sexual en la auditoría de ICE", pa_link:"Leer el informe de auditoría de ICE",
  pa_when:d => "Auditoría de " + new Date(d + "T12:00:00").toLocaleDateString("es-US", {month:"long", year:"numeric"}), pa_n:n => n === 1 ? "1 denuncia en el período auditado" : `${n} denuncias en el período auditado`, pa_floor:n => `al menos ${n} (el informe no da un total)`, pa_zero:"el informe dice que no hubo ninguna", pa_ns:"el informe no da una cifra", pa_unread:"publicado; la cifra aún no se ha leído del informe", pa_sub:n => +n === 0 ? "ninguna comprobada" : +n === 1 ? "1 comprobada" : `${n} comprobadas`,
  pa_sum:(a, n, tot) => `${tot} denuncias contadas · ${a} auditorías leídas · ${n} centros con al menos una denuncia`, pa_lead:M => `La ley federal exige una auditoría externa de cómo cada centro previene y responde al abuso sexual. ICE publica los informes. Se leyeron los ${M.audits} informes que ha publicado desde ${M.from}. El mapa y esta lista muestran la auditoría más reciente de cada centro; las anteriores están en la página del centro.`, pa_more:n => n === 1 ? "1 auditoría anterior en la página del centro" : `${n} auditorías anteriores en la página del centro`, pa_un_h:"Lugares auditados que no están en los registros de detención", pa_un_note:"Estas auditorías nombran una sala de retención, un sitio de tránsito o un centro cerrado que no se pudo vincular con un centro de esta página, por lo que no están en el mapa.",
  pa_some_h:"Denuncias informadas", pa_zero_h:"La auditoría dice que no hubo ninguna", pa_ns_h:"La auditoría no da una cifra",
  pa_note:"Son denuncias, no conclusiones: la mayoría de las auditorías no dice cuántas se comprobaron. Cada cifra cubre solo el período que revisó la auditoría, por lo general el año anterior y a veces más, y solo aparecen los centros auditados; un centro sin punto no fue auditado en ese período: no significa que no haya pasado nada allí. Un centro más grande tiene más personas y tenderá a tener más denuncias. Aquí no se nombra a ninguna persona.",
  pg_h:"Embarazos y nacimientos", pg_lead:"Lo que el gobierno ha dicho sobre personas embarazadas, en posparto y lactantes bajo custodia de ICE, lo que no ha dicho, y cuánto tiempo están detenidas las mujeres.",
  pg_rep_h:"Lo que ICE y DHS han informado", pg_rep_note:"Solo totales nacionales. Las cifras de 2025-2026 vienen de las respuestas del Departamento de Seguridad Nacional a una consulta del Senado, según las fuentes enlazadas. Los dos conteos del 16 de febrero de 2026 usan definiciones distintas. Una fuente sitúa las deportaciones en unas 400.",
  pg_not_h:"Lo que no se informa", pg_not:["Nacimientos bajo custodia: no se ha publicado ningún conteo.", "Qué centros: ninguna cifra está desglosada por centro, así que nada de esto puede mostrarse en la página de un centro.", "Abortos espontáneos fuera de las instalaciones médicas del propio ICE: ICE dice que allí no los registra.", "Informes periódicos: DHS envió al Congreso un informe dos veces al año al menos desde 2019. Se dejaron de enviar en 2025.", "Cuánto tiempo de embarazo había al ingresar, o cuándo comenzó: no está en ningún registro público."],
  pg_len_h:"Cuánto tiempo están detenidas las mujeres", pg_len:W=>`Según los registros de detención de ICE: ${W.ended.n.toLocaleString()} estancias de mujeres terminaron en el año hasta el ${W.as_of}. La mitad duró ${W.ended.median_days} días o menos. ${W.ended.bands[3].toLocaleString()} duraron ${(W.edges || [[0],[0],[0],[280]])[3][0] === 365 ? "un año" : (W.edges ? W.edges[3][0] : 280) + " días"} o más, y otras ${W.open.bands[3].toLocaleString()} mujeres que seguían bajo custodia en esa fecha llevaban ese tiempo detenidas.`,
  pg_bands:["Menos de 30 días", "30 a 89 días", "90 a 364 días", "Un año o más"], pg_ended:n=>`Estancias que terminaron en el último año (${n.toLocaleString()})`, pg_open:(n,d)=>`Aún bajo custodia el ${d} (${n.toLocaleString()})`,
  pg_len_note:"Una estancia es un período continuo bajo custodia de ICE, a través de todos los centros por los que pasó la persona. Estos registros cubren a todas las mujeres, no solo a las embarazadas; no registran embarazos.",
  pg_q_h:"Denunciar abuso y agresión sexual", pg_q:["ICE está obligado a informar sobre abuso y agresión sexual en sus centros. Sus informes y la forma de presentar una denuncia están en la página del propio ICE:"], pg_prea:"ICE: prevención y denuncia de abuso y agresión sexual",
  dt_h:"Muertes", dt_yes:(y,a,s)=>`Los registros de detención de ICE muestran ${a} ${a==1?"muerte":"muertes"} en este centro desde ${s}, ${y} en el último año.`,
  dt_no:"Ninguna estancia en este centro en los registros de detención de ICE (desde octubre de 2021) terminó en una muerte. Los informes de muerte del propio ICE, que pueden incluir muertes que estos registros no tienen, se listan aparte más abajo.",
  dt_note:"Una muerte aparece aquí solo cuando ICE registró \"murió\" como la razón por la que la persona salió de este centro. En total, los informes públicos de muertes de ICE listan más muertes que estos registros, pero en un solo centro las dos cifras pueden diferir en cualquier sentido: un informe puede vincular una muerte al centro que envió a la persona al hospital, mientras que el registro muestra dónde terminó su estancia.",
  rp_h:"Quién representa esta zona en el Congreso", rp_house:d=>`Cámara, ${d}`, rp_sen:"Senado", rp_wait:"Miembro de la Cámara: aún sin consultar.",
  vi_h:"Visitas de funcionarios", vi_none:"Aún no hay ninguna visita registrada para este centro. Se agrega una visita cuando hay una fuente pública: una noticia, una declaración oficial o una publicación en la cuenta verificada del propio funcionario.", vi_denied:"Entrada negada", vi_admitted:"Admitido",
  vi_rules:"La ley federal de gastos prohíbe al Departamento de Seguridad Nacional impedir que miembros del Congreso visiten centros de detención o exigir aviso previo. Un juez federal suspendió las reglas de aviso que el departamento emitió en 2025 y en enero de 2026; el gobierno apeló. Desde el 11 de mayo de 2026, ICE pide a los miembros nombrar con dos días hábiles de anticipación a los detenidos que quieren ver. La cronología en la pestaña Visitas oficiales e inspecciones tiene las fechas y las fuentes.", vi_rules_src:"Fuente: CBS News", vi_log:"Este registro está incompleto. Solo incluye visitas con una fuente pública.",
  insp_none:"Aún no hay ningún informe de inspección de ICE asignado a este centro.", a287_none:"Ninguna agencia local del condado de este centro está en la lista de acuerdos 287(g) de ICE.",
  ag_map:(c,n)=>`Cada punto es un condado con al menos un acuerdo; los puntos más grandes indican más agencias. Se muestran ${c} condados. ${n} agencias no tienen condado en la lista de ICE (en su mayoría agencias estatales), lo tienen mal escrito, o están en un territorio, y aparecen solo en la lista de abajo. Los estados en gris tienen una ley contra estos acuerdos. Toque un estado para ver su lista.`,
  ag_ban:st=>`${st} tiene una ley estatal que prohíbe a las agencias locales firmar estos acuerdos.`, ag_ban_some:st=>` La lista de ICE todavía muestra acuerdos aquí; pueden ser anteriores a la ley o estar en disputa.`, ag_src:"Fuente",
  ag_none:st=>`Ninguna agencia de ${st} está en la lista de ICE.`, agc_n:n => n === 1 ? "1 agencia de este condado firmó un acuerdo con ICE." : `${n} agencias de este condado firmaron un acuerdo con ICE.`, agc_list:"Ver este condado en la lista completa", agc_none:"No se pudieron listar las agencias de este condado.", ag_call:"Llamar", ag_nophone:"Aún no hay número de teléfono",
  ag_contact:n=>n ? `Los teléfonos y direcciones vienen de una lista federal de oficinas policiales revisada por última vez en 2018 o 2019. ${n} agencias coinciden. Los números pueden estar desactualizados: si uno falla, busque el sitio web de la agencia.` : "Los teléfonos de estas agencias aún no están cargados.",
  st_meta:(m)=>{ const by = Object.entries(m.party||{}).map(([p,n])=>`${n} de miembros ${({Democrat:"demócratas", Republican:"republicanos", Independent:"independientes"})[p] || p}`).join(", "); const rd = m.read ? " Páginas de prensa leídas: " + Object.entries(m.read).map(([p,[a,b]])=>`${a} de ${b} ${({Democrat:"demócratas", Republican:"republicanos", Independent:"independientes"})[p] || p}`).join(", ") + "." : " Hasta ahora solo se pudo leer cerca de un tercio de las páginas de prensa, así que esto está incompleto para ambos partidos."; return `Comunicados sobre negación de entrada: ${by || "ninguno"}. El comunicado más antiguo leído es del ${m.oldest || "fecha desconocida"}.${rd}`; },
  st_hist:"Años anteriores: una búsqueda en noticias y sitios de los miembros de enero de 2020 a enero de 2025 no encontró ningún caso, de ninguno de los dos partidos, en que una fuente diga que a un miembro se le negó la entrada a un centro de ICE, de la Patrulla Fronteriza o a un albergue de migrantes. No se cuentan los casos en que solo se prohibieron las cámaras o el sitio no era de custodia. Esa búsqueda no es exhaustiva.",
  st_h:"Lo que dicen los miembros del Congreso en sus propios sitios", st_fh:"Comunicados que mencionan este centro",
  st_note:"Recopilado automáticamente de las páginas de prensa oficiales .gov de los miembros. Son declaraciones de los propios miembros y no han sido verificadas. Un comunicado puede tratar de la visita de otra persona. Se aplica la misma regla a todos los miembros de ambos partidos: se conserva un comunicado cuando menciona a ICE, la inmigración o la detención junto con una visita, recorrido o inspección (o una visita negada), sea cual sea su tono. Se omiten los que solo planean, piden o discuten visitas. Cuántas declaraciones tiene cada partido depende de lo que los miembros deciden publicar.",
  tab_over:"Visitas oficiales e inspecciones", snap_open:"Abrir la página completa del centro", snap_close:"Seguir en esta página", snap_call:"Teléfono del centro:", insp_all_h:"Informes de inspección", bu_h:"Camas garantizadas que quedaron vacías", bu_p:(fy, k, n, e, tot, pct) => `En lo que va del año fiscal ${fy}, ${k} de los ${n} centros con un número garantizado tuvieron en un día promedio menos personas de las que ICE acordó pagar. En conjunto son unas ${e} camas pagadas y no usadas en un día promedio, el ${pct}% de las ${tot} garantizadas en esos ${n} centros.`, bu_row:(gm, avg, e, pct) => `Paga por al menos ${gm} · tuvo ${avg} en un día promedio · ${e} ${String(e) === "1" ? "vacía" : "vacías"} (${pct}%)`, bv_said:(co, amt, least, beds, doc, pay) => `Declarado por la empresa: ${co} dijo a sus inversionistas que espera ${least ? "más de" : "unos"} $${amt} millones al año de este centro, con ${beds} camas (${doc}).${pay ? " " + pay : ""}`, bv_calc:(n, least) => `Calculado por esta página: ${least ? "al menos" : "unos"} $${n} por cama por día, si esa cifra anual se repartiera por igual entre todas esas camas. No es un precio del contrato.`, bv_doc:{annual:y => `su informe anual de ${y}`, release:d => `su anuncio del ${d}`}, bv_pay:{fixed:"La empresa dice que recibe un monto fijo cada mes.", mixed:"La empresa dice que recibe un monto fijo cada mes más un monto por persona detenida."}, bv_rest:"Cifras declaradas por la empresa en otros centros", bv_sold:d => `La empresa vendió este centro al Departamento de Seguridad Nacional (anunciado el ${d}) y dice que espera seguir operándolo para ICE con su contrato vigente. La cifra anual se declaró antes de la venta.`, bv_src:"Fuente", bv_note:"Donde una línea empieza con «Declarado por la empresa», el monto anual es lo que la empresa dijo a sus inversionistas que espera, no lo que ICE ha pagado, y el número de camas es el de la empresa, que puede diferir del mínimo garantizado de ICE. La cifra por cama es una división hecha por esta página. El precio diario de ningún contrato es público, así que la cifra en dólares por las camas vacías en el recuadro de camas es una estimación de esta página con la tarifa diaria mediana de ICE, no un monto facturado.", bu_now:(n, d) => `Personas detenidas el ${d}: ${n}`, bu_note:fy => `Las dos cifras vienen del archivo de estadísticas de detención del propio ICE: el mínimo garantizado y el promedio de personas detenidas cada día en lo que va del año fiscal ${fy}. Lea esto con cuidado. El promedio abarca todo el año hasta ahora, así que un centro que abrió, o cuya garantía empezó, a mitad de año parece más vacío de lo que está hoy; la línea bajo cada centro da el conteo más reciente. Algunos contratos garantizan el pago de otras maneras. Una cama pagada y vacía es un costo para los contribuyentes; si es un desperdicio es un juicio que esta página no hace.`, mp_kind:{D:"Fondo de liderazgo: un comité que controla un político, aparte de su campaña", J:"Recaudación conjunta: reúne dinero y lo reparte entre varios comités"}, mp_spon:x => `Patrocinador registrado ante la FEC: ${x}`, mp_share:x => `Reparte lo que recauda con: ${x}`, mp_share_n:n => `Reparte lo que recauda con ${n} comités (toque para ver la lista)`, mp_nodetail:"De quién es cada uno de estos fondos, y a qué comités pasa su dinero una recaudación conjunta, consta en los registros de la FEC y aparecerá aquí cuando se configure la conexión de esta página con la FEC.", op_money_l:"Aparte, de Siga el dinero:", bu_left:n => `${n} ${n === 1 ? "centro más tiene" : "centros más tienen"} una garantía pero ninguna cifra de población en el archivo de ICE y ${n === 1 ? "queda" : "quedan"} fuera de esta comparación.`, two_l:"Dos vías", two_t:"Esta empresa tiene contratos directos con ICE y además recibe subcontratos de otro contratista de ICE.", st_link:w => `Declaración de ${w.replace(/^U\.S\. Representatives /, "los representantes de EE. UU. ").replace(/^U\.S\. Representative /, "la oficina del representante de EE. UU. ").replace(/^U\.S\. Senators /, "los senadores de EE. UU. ").replace(/^U\.S\. Senator /, "la oficina del senador de EE. UU. ").replace(/^Rep\. /, "la oficina del representante ").replace(/^Sen\. /, "la oficina del senador ")}`, st_member:"un miembro del Congreso", st_nodate:"sin fecha", tab_fam:"Para familias", fam_lead:"Si inmigración detuvo a alguien que usted conoce, empiece aquí. Esta página nunca pide un nombre y no envía nada sobre usted a ningún lado. (El historial de su navegador mostrará las páginas que abrió; bórrelo si otras personas usan su teléfono.)", fam_1h:"1. Averigüe dónde está la persona ahora", fam_1n:"Si el localizador no muestra nada: puede tardar días en actualizarse después de un arresto o un traslado. Vuelva a intentarlo más tarde y, mientras tanto, siga con el paso 2.", fam_kid:"Si la persona es menor de 18 años y estaba sola, la tiene otra agencia (ORR). Su centro de llamadas para padres y familiares:", fam_2h:"2. Llame al último lugar donde sabe que estuvo", fam_2p:"Escriba el último centro, ciudad, estado o código postal que conozca. Verá los números a los que llamar y adónde suelen enviar después a quienes estuvieron allí.", fam_call:"Pregunte si la persona está allí y cómo organizar una llamada o visita:", fam_nophone:"ICE no publica un teléfono para este lugar.", fam_office:o => `La oficina de ICE a cargo (${o}):`, fam_next:"Si la trasladaron, estos son los lugares adonde más se envió a quienes estuvieron aquí. Llame en este orden:", fam_pct:p => `${p}% de los trasladados`, fam_legal:s => `Ayuda legal gratuita en ${s} (de la lista del Departamento de Justicia):`, fam_full:"Todo lo registrado sobre este centro", fam_3h:"3. Revise el caso en la corte", fam_3p:"La línea automática de la corte de inmigración da la fecha de la próxima audiencia y el estado del caso, en inglés y español, a cualquier hora. Necesita el número A de la persona (la letra A y 8 o 9 dígitos, en sus papeles de inmigración).", fam_3n:"llamada gratuita", fam_3a:"Revisar el caso en línea", fam_5h:"5. Si ya se fijó una fianza", fam_5p:"Una fianza es dinero que se paga para que la persona salga libre mientras sigue el caso. ICE o un juez de inmigración fija el monto. Según ICE:", fam_5law:"Ahora no todos pueden tener una audiencia de fianza. Desde 2025, ICE ha detenido a muchas personas que entraron a EE. UU. sin ser inspeccionadas, y no les ha dado una audiencia de fianza ante un juez, y los tribunales no se ponen de acuerdo sobre si eso es legal. Un abogado (paso 4) puede decir si en este caso es posible una audiencia de fianza o un hábeas corpus, una petición a un tribunal federal para que ordene esa audiencia o la liberación.", fam_5fund:"Fondos de fianza sin fines de lucro que pueden pagar la fianza por usted (directorio)", fam_5l:["Se paga en línea por el sistema de ICE, llamado CeBONDS. Se paga el monto completo de una vez, solo por transferencia bancaria (Fedwire o ACH). No se acepta efectivo ni tarjetas.", "Puede pagarla un ciudadano de EE. UU., un residente permanente legal, un bufete de abogados o una organización sin fines de lucro. Si usted no tiene estatus legal, no vaya a una oficina de ICE a pagar: un fondo de fianza sin fines de lucro o un abogado puede pagar por usted. Quien pague necesita el nombre completo y el número A de la persona, y su propia prueba de estatus.", "Los pagos se atienden de 9 a.m. a 3 p.m., de lunes a viernes, en la zona horaria donde está detenida la persona. La revisión suele tardar de una a dos horas.", "¿No tiene cuenta bancaria? ICE dice que una compañía de fianzas autorizada o un grupo comunitario puede pagar por usted. Las compañías de fianzas cobran comisiones que no se devuelven, y algunas exigen un grillete electrónico: lea todo contrato antes de firmarlo."], fam_5a:"Página de ICE: pagar una fianza", fam_5n:"No a todas las personas se les da una fianza. La línea de la corte del paso 3 o un abogado puede decirle si se fijó una.", fam_6h:"6. Visitas, llamadas, correo y envío de dinero", fam_6p:"Las reglas son distintas en cada centro. Escriba el centro en el paso 2 y abra su página completa: la sección «Visitas, llamadas y correo» enlaza a la página de ICE para ese centro, con sus horarios y reglas. El teléfono del centro es la forma más segura de preguntar.", fam_6m:"Las cuentas de teléfono y el dinero para el economato (la tienda del centro) suelen pasar por una empresa con la que trabaja el centro; la página de ICE sobre el centro suele decir cuál y cómo (en inglés). Use solo las formas que indiquen esa página o el centro.", fam_6w_h:"Antes de visitar:", fam_6w:"normalmente hay que mostrar una identificación oficial con foto, y el centro puede revisarla. Si le preocupa su propio estatus migratorio, consulte primero con un abogado, o manténgase en contacto por teléfono, videollamada o cartas.", fam_4h:"4. Consiga ayuda gratuita", hl_hand:d => `(verificado a mano en su página oficial, ${d})`, fam_4in:"Desde dentro de la detención, la persona puede llamar gratis a esta línea marcando 9233#.", fam_4out:"Familiares y amigos pueden llamar al:", fam_kyr_h:"Lo que la persona debe saber", fam_kyr:["Tiene derecho a guardar silencio y a pedir un abogado.", "No debe firmar ningún papel que no pueda leer o no entienda. Firmar puede significar aceptar salir del país.", "Un abogado que haya presentado el formulario G-28 por la persona recibe aviso cuando ICE la traslada a otro centro. Los traslados pueden ser rápidos."], fam_dril:"Necesidades médicas, discapacidad o maltrato: avise al centro y luego llame gratis a la Línea de Información y Reportes sobre Detención de ICE, que recibe reportes de las personas detenidas y sus familias:", fam_note:"Cada teléfono y enlace de ayuda de esta página se revisa cada semana con la página oficial que lo publica (ICE, el Departamento de Justicia, el Departamento de Salud y Servicios Humanos, los ministerios de relaciones exteriores y los grupos nombrados), y se oculta si esa página ya no lo muestra. Aun así, un número puede cambiar entre revisiones.", fam_scam_h:"La ayuda aquí es gratis.", fam_scam:"El localizador de ICE, la línea del tribunal y las líneas de ayuda de abajo no cuestan nada. Nunca le pague a nadie que llame o escriba ofreciendo encontrar a la persona, acelerar el caso o conseguir una fianza. Solo un abogado o un representante acreditado por el Departamento de Justicia puede dar asesoría legal; un «notario» no puede.", fam_8c:"Línea del tribunal de inmigración (paso 3):", fam_all:"Los ocho pasos para familias: la línea del tribunal, la fianza, las visitas, el consulado y más", fam_anum:"El número A es la letra A y 8 o 9 dígitos. Aparece en la Notificación de Comparecencia (Notice to Appear), en el permiso de trabajo y en la mayoría de los papeles de ICE o del tribunal de inmigración.", gl_aria:"Globo con los vuelos y centros de ICE. Los mismos vuelos aparecen en la lista de abajo.", gl_l:"Girar el globo a la izquierda", gl_r:"Girar el globo a la derecha", gl_u:"Inclinar el globo hacia arriba", gl_d:"Inclinar el globo hacia abajo", tr_w_h:"Dónde se negó la entrada a funcionarios", tr_w:(n, l, p, o) => `De las ${n} negaciones verificadas, ${l} fueron en centros de detención de la lista del propio ICE (${p} de ellos de operación privada) y ${o} en oficinas y salas de detención temporal de ICE, donde se retiene a las personas durante horas o días antes de trasladarlas.${n - l - o > 0 ? ` ${n - l - o === 1 ? "La otra fue" : `Las otras ${n - l - o} fueron`} en otro tipo de lugar, que se ve en el gráfico.` : ""}`, tr_w_p:"Centro de detención de operación privada", tr_w_g:"Centro de detención operado por un gobierno", tr_w_x:"Oficina de ICE que no está en los registros de detención", tr_w_top:"Lugares con más de una negación", tr_w_n:n => `${n} negaciones`, tr_w_note:"Contado a partir de la lista de negaciones de la pestaña Visitas oficiales e inspecciones, donde cada una tiene su fuente. Un centro se cuenta como de operación privada según quién lo operaba ese día. Solo se cuentan las negaciones con una fuente pública, así que son mínimos, y un lugar que recibe más visitas tiene más ocasiones de negar la entrada.", z_in:"Acercar", z_out:"Alejar", z_reset:"Mapa completo", yr_h:"Año por año: qué creció", yr_p:(a, b) => `Los mismos dólares de contratos, divididos por año fiscal de ${a} a ${b}. Un año fiscal va de octubre a septiembre.`, yr_g:"Por lo que se compró", yr_x:x => x >= 1 ? `${x} veces el primer año` : `${Math.round(x * 100)}% del primer año`, yr_new:(y, n) => `No cobraron nada en el año fiscal ${y} y han cobrado desde entonces (${n})`, yr_new_p:y => `Entre los 60 mayores receptores: empresas sin dólares de contratos de ICE en el año fiscal ${y} y con al menos $5 millones desde entonces.`, yr_r:n => `Los mayores receptores, año por año (${n})`, yr_note:n => `Los dólares son obligaciones: dinero que ICE comprometió ese año, no dinero pagado, y una adjudicación cancelada cuenta como negativa. Las cifras anuales de cada empresa vienen de una búsqueda por nombre y solo se muestran cuando suman el total de esa empresa${n ? `; ${n} de las 60 mayores no lo hicieron y quedan fuera de esta lista` : ""}. Un nombre nuevo también puede ser una empresa existente que cambió de nombre o fue comprada.`,
 cp_h:"Cómo se adjudicaron los contratos", cp_p:"Cada registro federal de contrato indica si se permitió que otras empresas compitieran. Este es el código del propio gobierno en cada registro, sumado.", cp_fy:y => `Año fiscal ${y}`, cp_row:(nc, pct, c, nr) => `Sin competencia: ${nc} (${pct}%) · Con competencia: ${c} · Sin registrar: ${nr}`, cp_top:"Más dólares sin competencia, todo el período", cp_note:"\"Sin competencia\" incluye contratos adjudicados a una sola empresa sin licitación, adjudicaciones que continúan un contrato anterior con competencia y pedidos hechos sin competencia bajo un contrato existente. La ley lo permite en ciertos casos, como urgencia o un solo proveedor capaz; el registro no dice si el caso estaba justificado. \"Sin registrar\" es dinero en registros que no llevan código de competencia. Estos totales por año siguen el código de cada contrato, así que una orden hecha sin oportunidad justa bajo un contrato con competencia cuenta aquí como con competencia; la lista de contratos de abajo la cuenta aparte.",
 pq_h:"Cuándo se dio el dinero, por trimestre", pq_p:"De los informes periódicos de cada comité ante la FEC: sus donaciones a candidatos y comités federales en los informes que terminan en ese trimestre. Donde estos totales difieren de la lista de abajo, que se cuenta por receptor, se muestra la diferencia.",
 ml_iss:"Áreas temáticas nombradas en sus informes", ml_iss_n:"El número de informes trimestrales que marcan cada área temática en el formulario de divulgación (nombres en inglés, como en el formulario). Un informe puede marcar varias.", ml_q:"Trimestre por trimestre", ml_q_row:(own, out) => `Su propio informe: ${own} · Pagado a firmas externas: ${out}`,
 ox_held:"Personas detenidas en sus centros en el último conteo", ox_empty:fy => `Camas garantizadas vacías en un día promedio, año fiscal ${fy}`, ox_def:n => `Deficiencias por inspección de ICE (${n} ${n === 1 ? "inspección" : "inspecciones"})`, vg_1:"Obtener ayuda", vg_2:"Quién trabaja con ICE", vg_3:"Condiciones y supervisión", vg_4:"Dinero y patrones", vg_5:"Acerca de", tab_about:"Acerca de estos datos", ft_about:"Acerca de estos datos: de dónde vienen y sus límites", tab_trends:"Tendencias y patrones", tab_life:"Muertes, abuso sexual y embarazos informados", lf_lead:"Lo que el gobierno ha informado sobre embarazos bajo custodia de ICE, las denuncias de abuso sexual contadas en las auditorías del propio ICE, y cada muerte que ICE ha informado desde octubre de 2022, por año y centro, con los totales anuales de años anteriores.", lf_map_h:"Dónde se informaron muertes y denuncias de abuso sexual", lf_map_note:"Cada punto es un centro, y un punto más grande significa más. Las etiquetas sobre el mapa indican qué es cada color: toque una etiqueta para ocultarla o mostrarla, y toque un punto para abrir ese centro. Las muertes son las que ICE ha informado desde octubre de 2022, ubicadas en el centro que tenía a la persona cuando murió o fue llevada al hospital. Las denuncias de abuso sexual son las contadas en las auditorías que ICE ha publicado, así que un centro sin punto puede simplemente no haber sido auditado. Las cifras de embarazos existen solo como totales nacionales y no están en el mapa.", ov_lead:"Quién ha entrado a revisar estos centros, a quién se le negó la entrada, y los informes de inspección del propio ICE.",
  ov_insp_h:"Informes de inspección de ICE, por estado", ov_insp_n:(r,f)=>`${r} informes de ${f} centros. Toque un estado y luego una fecha para abrir el informe de ICE, o el nombre de un centro para abrir su página.`,
  ov_insp_note:"Son inspecciones de ICE a sí mismo y a sus contratistas. Cada informe está enlazado con el número de deficiencias que cita, cuando se pudo leer. La calificación de ICE (aprobada o reprobada) no está en la lista de informes; donde el archivo de estadísticas de ICE la da, aparece en la página del centro.",
  dn_h:"Miembros del Congreso a quienes se negó la entrada", dn_note:"Solo se listan las negaciones con fuente pública. Un funcionario a quien se negó la entrada y no lo dijo públicamente no aparece, así que el número real es mayor. Algunos centros los opera un estado o el sistema federal de prisiones para ICE, y la negación vino de ellos.",
  ag_nocounty:"Sin condado en la lista (en su mayoría agencias estatales)", ag_open:st=>st ? "Elija un condado arriba, o escriba un nombre, para ver sus agencias." : "Elija un estado y un condado arriba, o escriba un nombre, para ver las agencias.", ag_county:"Condado", ov_pick:"Elija un estado", ag_cty_first:"Primero elija un estado", ag_cty_all:n => `Todos los condados (${n})`,
  ag_state:"Estado", ag_find:"Agencia o condado", ag_ph:"Escriba un condado o agencia", ag_all:"Todos los estados",
  ag_lead:(n,d,k)=>`${k} agencias locales y estatales tienen ${n} acuerdos para hacer cumplir leyes de inmigración para ICE, llamados acuerdos 287(g). Una agencia puede tener hasta tres tipos. Lista publicada por ICE el ${d}.`,
  ag_count:(n,st)=>`${n} ${n==1?"acuerdo":"acuerdos"}${st ? " en "+st : ""}`, ag_more:n=>`Se muestran los primeros 150 de ${n}. Escriba para acotar la lista.`,
  ag_M:{T:"Fuerza de tarea", J:"Cumplimiento en cárcel", W:"Entrega de órdenes", "?":"Otro"}, ag_signed:d=>`acuerdo firmado el ${d}`,
  ag_models_h:"Qué significan los tres tipos",
  ag_T:"Fuerza de tarea: los agentes pueden interrogar y arrestar a personas por su estatus migratorio durante su trabajo policial habitual.",
  ag_J:"Cumplimiento en cárcel: los agentes interrogan a personas ya detenidas en la cárcel local sobre su estatus migratorio e inician trámites de deportación.",
  ag_W:"Entrega de órdenes: los agentes entregan órdenes de ICE a personas ya detenidas en la cárcel local.",
  ag_money:"Esta lista muestra quién firmó. No muestra cuánto gasta cada agencia en este trabajo ni cuánto se le paga.",
  tab_find:"Buscar un centro", noname:"Esta página busca centros, no personas. Nunca pide un nombre. Para buscar a una persona:", tab_flights:"Vuelos",
  k_intl:"Salió de o entró a EE. UU.", k_abroad:"Entre dos aeropuertos fuera de EE. UU.", k_dom:"Dentro de EE. UU.", k_hub:"Aeropuerto que usaron estos vuelos (más grande significa más)", k_fac:"Centro de detención (toque uno)",
  fl_help:"Arrastre para girar el globo. Las líneas son las posiciones que el avión transmitió; un hueco o un salto recto significa que se perdió la señal.",
  fu_h:n => `Todos los aeropuertos que usaron estos vuelos (${n})`, fu_lead:(d, seen, lost) => `En los ${d} días leídos, los aviones rastreados fueron vistos despegando o aterrizando ${seen} veces. Otros ${lost} despegues y aterrizajes no se cuentan aquí porque la señal se perdió antes de que el avión estuviera bajo y cerca de un aeropuerto.`, fu_us:"En los 50 estados", fu_ab:"Fuera de los 50 estados", fu_n:(dep, arr) => `${dep} ${+dep === 1 ? "salida" : "salidas"} · ${arr} ${+arr === 1 ? "llegada" : "llegadas"}`,
  fu_note:"Alexandria, Harlingen y Mesa no son los únicos aeropuertos que se muestran. Son la prueba que se usa para decidir que un avión de un contratista volaba para ICE ese día; todos los demás aeropuertos que ese avión usó el mismo día aparecen aquí. Un avión de contratista que no tocó ninguno de los tres en un día dado no está en los datos. La señal se pierde con más frecuencia fuera de Estados Unidos, así que los aeropuertos extranjeros están muy subcontados aquí; la tabla de países de abajo cuenta esos vuelos por el lugar donde terminó la señal. Que un aeropuerto aparezca aquí no prueba que todos los vuelos allí llevaran detenidos.",
  fl_how:"Cómo se eligen los vuelos: solo se leen aviones que vuelan con el indicativo de un contratista, y se conserva el día cuando el avión inicia o termina un vuelo en Alexandria, Harlingen o Mesa. Los aviones de contratistas también hacen vuelos chárter comunes, y los vuelos que evitan esos aeropuertos no aparecen, así que esto es un mínimo. No se identifica a nadie a bordo.",
  fl_lost:"\"Visto por última vez cerca de\" significa que la señal se perdió antes de aterrizar. El aeropuerto indicado es el más cercano, no un aterrizaje confirmado.",
  fl_lead:(n,t,i,d)=>`${n} vuelos de ${t} aviones de contratistas el ${d}, el día más reciente registrado. ${i} salieron de o entraron a EE. UU. Los datos de vuelos muestran adónde fue un avión, nunca quién iba a bordo: no pueden decirle si una persona en particular fue trasladada o deportada. Para eso, use el localizador de detenidos en Para familias.`,
  fl_h:d=>`Vuelos del ${d} (horas en UTC, de 7 a 8 horas más que la hora del Pacífico y de 4 a 5 más que la del Este)`, cm_h:"Mapa: centros de detención de operación privada", cm_lead:(n, s, beds, bn) => `${n} centros en ${s} estados. En ${bn} de ellos ICE paga por un número fijo de camas, estén ocupadas o no: ${beds} camas en total.`, cm_off:n => `${n} no se pudieron ubicar en el mapa y solo están en la lista de abajo.`, cm_note:"Un círculo más grande significa más camas que ICE paga estén ocupadas o no; los círculos más pequeños no tienen ese número registrado. Toque un círculo para abrir el centro.", tp_lead:"Lo que suman a lo largo del tiempo los registros de las otras pestañas. Cada gráfico se cuenta a partir de datos mostrados en otra parte de esta página; abra la pestaña correspondiente para el detalle y las fuentes.", tp_open:"Toque un tema para abrir sus gráficos.", tp_note:"Lea esto como pistas para verificar, no como conclusiones. Varias series están incompletas de maneras que cambian su forma; la nota bajo cada gráfico explica cómo.",
