/* layout pass, Oct 2026 */
:root{--ctl:#857c6c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ctl:#6d7894}}
:root[data-theme="dark"]{--ctl:#6d7894}
/* tables scroll inside themselves instead of pushing the page sideways */
.ttab{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ttab th{overflow-wrap:anywhere;hyphens:auto;vertical-align:bottom}
.ttab th:first-child,.ttab td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
/* paragraphs that follow one another get a gap */
.view p+p{margin-top:.6em}
/* one control outline everywhere, at readable contrast */
.fa input,input[type=search],select,.stabs button{border:1px solid var(--ctl)}
input[type=search]{border-width:1px;padding:10px 12px;min-height:44px;box-sizing:border-box}
.fa input:focus-visible,input[type=search]:focus-visible,select:focus-visible,.stabs button:focus-visible,.fa li button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* map legends are switches, not tabs: square, with a check when on */
.legend button,.legend span.lg{border-radius:6px}
.legend button[aria-pressed="true"]::after{content:"✓";font-size:.8em;color:var(--accent)}
.legend button[aria-pressed="false"]{opacity:.6;text-decoration:line-through}
/* map dots readable on the light map */
.usmap svg circle{stroke:var(--ink);stroke-opacity:.6;stroke-width:.6}
/* tiles you can open say so; an odd last tile fills the row */
.tiles button>span:not(.chg)::after{content:" ›";color:var(--accent);font-weight:700}
.tiles>:last-child:nth-child(odd):not(.find){grid-column:1/-1}
/* one fold marker: the same chevron for topics, lists and steps */
.sec>summary{display:flex;align-items:center;gap:10px;list-style:none;flex-wrap:wrap}
@media (max-width:600px){.sec>summary>span:not(:first-of-type):not(.agn){flex-basis:100%;padding-left:17px}
  .stabs{flex-wrap:wrap!important;overflow:visible!important;-webkit-mask-image:none!important;mask-image:none!important}.stabs button{white-space:normal!important}}
/* phones: the sub-topic buttons wrap onto several rows, so they scroll with the page instead of staying pinned over it */
@media (max-width:699px){.stabs{position:static}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 10px}.pgrid select{padding:10px}
@media (min-width:900px){.view .pick select{max-width:360px}}
.view summary.muted{min-height:44px!important}.view ul.plain li>a,.view .blk>a,.view .card>a:not(.bigbtn),.view .agb>a,#v-find p>a,.view p>a:only-child{min-height:44px!important}
.legend button,.kinds button,.fa .kinds button{min-height:44px}
.scrollbox:focus-visible{outline:3px solid var(--accent)}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before,.agd>summary::before{content:"";flex:none;width:0;height:0;border-left:7px solid var(--muted);border-top:6px solid transparent;border-bottom:6px solid transparent;transition:transform .15s}
.sec[open]>summary::before,.agd[open]>summary::before{transform:rotate(90deg)}
/* phones: less header before the content; the sub-tab bar is one row that scrolls sideways */
.menu{margin:0}
@media (max-width:640px){
  .tagline{font-size:.95rem}
  .status{font-size:.78rem}
  .stabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
  .stabs::-webkit-scrollbar{display:none}
  .stabs button{flex:none;scroll-snap-align:start;white-space:nowrap}
  .ttab{font-size:.8rem}
}
/* desktop: the topic list becomes a sidebar and the content uses the width */
@media (min-width:1100px){
  main{max-width:78rem;display:grid;grid-template-columns:17rem minmax(0,1fr);column-gap:40px;row-gap:20px;align-items:start}
  main>header{grid-column:1/-1}
  main>.menu{grid-column:1;grid-row:2/span 40;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
  main>.menu>summary{display:none}
  main>.menu .views{display:flex!important}
  main>*:not(header):not(.menu){grid-column:2;min-width:0}

  mt_total:(a, b) => `committed to contractors in fiscal years ${a} to ${b}, under ICE's own contracts (ICE money in DHS headquarters contracts is added in the by-agency chart)`, mt_top:g => `of it for one thing: ${g.toLowerCase()}`, mt_big:n => `to ${n}, the largest single company`, mt_fam:(n, k, top) => `to ${n} across ${k} of its companies${top ? ", the most to any one owner" : ""}`, mf_ice_note:(a, b) => `${a} in ICE's own contracts plus ${b} of ICE money in contracts awarded by DHS headquarters. Elsewhere on the page the ${a} figure is used when only ICE's own contracts are meant.`, mt_five:"of all contract money went to five contractors", mt_beds:n => `beds ICE pays for whether filled or not, at ${n} sites`, mt_beds_est:(a, r) => `About ${a} a year at ICE's median rate of $${r} a bed a day (an estimate).`, mt_bf:"Filled on an average day", mt_be:"Paid for and empty", mt_bu:"No count in ICE's file", mt_empty_op:e => `${e} paid-for beds empty on an average day`, mt_empty_t:(e, r) => `a year for about ${e} guaranteed beds left empty on an average day, at $${r} a bed (estimate)`, mt_empty_chg:d => `About $${d} a day`, mt_empty_note:fy => `Empty means a site held fewer people on an average day in fiscal ${fy} so far than the minimum ICE guaranteed to pay for, from ICE's own detention statistics file. Dollar figures use ICE's median rate per bed per day and are estimates, not contract prices. Whether an empty paid bed is waste is left to the reader.`, mt_bcost_all:(e, d, y, r) => `All sites: about ${e} paid-for beds empty on an average day. At $${r} a bed, about $${d} a day, ${y} a year (estimate).`, mt_bcost:(y, d, r) => `Empty beds at $${r} a day: about $${d} a day, ${y} a year (estimate)`, mt_bseg:(f, e, tot, u) => `${f} filled · ${e} empty · ${tot} guaranteed${u ? ` · ${u} no count` : ""}`, mt_beds_empty:(e, a) => `About ${e} of them sat empty on an average day, roughly ${a} a year paid for unused beds.`,
  mt_beds_used:(b, n, u, e, fy, a, r) => `Filled and empty: at the ${n} sites where ICE's file gives both numbers, ${b} beds are guaranteed. On an average day in fiscal ${fy} so far, about ${u} of them were filled and about ${e} sat empty (counting only sites holding fewer people than their guarantee). At $${r} a bed a day, the empty guaranteed beds come to roughly ${a} a year, plus or minus the same caveats: actual rates vary by contract, and a site whose guarantee began part-way through the year looks emptier than it is now. Sites over their guarantee pay extra for the additional people; that is not counted here.`, mt_beds_how:(b, r, a) => `Estimate: ${b} guaranteed beds × $${r} a day (ICE's median bed rate in fiscal 2026, from GAO) × 365 days ≈ ${a} a year. It is a rough guide, not a figure ICE reports: each contract sets its own rates, often with different prices for the guaranteed minimum and for beds above it, and some sites cost far more (Bureau of Prisons sites a median of $182; Florida's tent site $249).`,
  mb_h:"Beds: what they cost, and the ones ICE pays for whether or not they are filled", mb_g:"Beds ICE pays for whether or not they are filled", mb_p:(tot, n, all) => `ICE's own facility list shows a "guaranteed minimum" at ${n} of ${all} facilities: the number of beds it pays for every day even if they are empty. Together that is ${tot} beds. The list gives the bed count, not the price per bed.`, mb_by:"Guaranteed beds by kind of contract", mb_top:"The 15 largest guarantees",
  mb_note:d => `From ICE's detention statistics file dated ${d}. A facility with no guaranteed minimum is paid only for the beds used. Daily rates are in the contracts themselves, which this page does not have.`,
  mp_h:"Political money from detention companies", mp_p:(tot, n, d) => `Three companies that run detention centers for ICE each have a political committee that gives money to candidates' campaigns and to party committees. For the 2024 and 2026 election cycles (January 2023 on) those three committees reported giving ${tot} to ${n} other committees. Read from the Federal Election Commission on ${d}.`,
  mp_pac:{G:"The GEO Group", C:"CoreCivic", M:"Management & Training Corporation"}, mp_cyc:(a, b) => `2024 cycle ${a} · 2026 cycle so far ${b}`, mp_by:"Where it went", mp_list:"Every committee that received money",
  mp_k:{PREP:"Republican party committees", PDEM:"Democratic party committees", HREP:"House campaigns, Republican", HDEM:"House campaigns, Democratic", H:"House campaigns, other or no party on record", SREP:"Senate campaigns, Republican", SDEM:"Senate campaigns, Democratic", S:"Senate campaigns, other or no party on record", Q:"Other committees: leadership funds, joint fundraisers and other political committees"},
  mp_from:x => `from ${x}`, mp_usd:n => (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString("en-US"),
  mp_note:"What this is: money moved from one registered committee to another, on public record. Names are the receiving committees as they are registered; a campaign committee carries its candidate's name, but a party committee or joint fundraiser is not any one official. What this is not: it does not include personal donations by company executives or employees (those are under Named donors, below), spending by trade groups, or lobbying. A negative amount is a refund. A contribution does not show why it was given or that it changed any vote. Other ICE contractors have no committee on record, or have one but do most of their business outside detention, and are left out.",
  mv_h:"Members of Congress linked to that money, and their vote on the July 2025 funding law", mv_p:(n, usd, loose) => `${usd} of the total went to a campaign committee or leadership fund that the FEC ties to one member of Congress: ${n} members. The other ${loose} went to party committees and joint funds that belong to no single member. The vote shown is on H.R. 1, the July 2025 law that gave ICE its largest detention budget: House roll call 190 on July 3, 2025 (218 to 214) and Senate vote 372 on July 1, 2025 (50 to 50, the Vice President breaking the tie).`,
  mv_base:(y, n, t) => `Read this beside the party line. Of the ${t} linked members who were in office, ${y} voted yes and ${n} voted no. But every Republican in Congress except five voted yes and every Democrat voted no, whether or not they received this money. The records show who was funded and how they voted; they do not show that one caused the other.`,
  mv_yes:"Voted yes", mv_no:"Voted no", mv_out:"Not in Congress for the vote", mv_ch:{H:"House", S:"Senate"}, mv_pt:{R:"Republican", D:"Democrat", I:"Independent"}, mv_split:(c, l) => l ? (c ? `campaign ${c} + leadership fund ${l}` : `leadership fund ${l}`) : "campaign committee",
  ml_h:"Lobbying by detention and ICE flight companies", ml_p:"What each company reported spending to lobby Congress and federal agencies, from its quarterly filings under the Lobbying Disclosure Act. 2026 covers January to June.",
  ml_co:{GEO:"The GEO Group", CC:"CoreCivic", MTC:"Management & Training Corporation", CSI:"CSI Aviation"}, ml_own:"Company's own report", ml_out:"Outside firms' reports", ml_yr:"Year", ml_firms:"Lobbying firms hired, 2023 to mid-2026", ml_tg:"Who they lobbied (number of filings naming each)",
  ml_note:"The two columns must not be added without care. A company with its own lobbyists is meant to report everything it spends, including what it pays outside firms, so the columns can overlap; but the outside firms' reports sometimes exceed the company's own. The true figure is at least the larger column and at most the two together. Filings name the chamber or agency lobbied, not the member or official, and amounts are rounded to $10,000. Lobbyists' names are in the filings and are not repeated here. No lobbying filings were found for Akima, MVM, GardaWorld, Deployed Resources or LaSalle Corrections under those names.",
  ms_h:"What the listed companies tell investors", ms_p:"GEO Group and CoreCivic are traded on the stock exchange, so they must file annual reports with the Securities and Exchange Commission. Those reports say how much of their revenue comes from ICE.",
  ms_line:(fy, rev, pct, ice) => `${fy}: revenue ${rev}, ${pct}% of it from ICE (about ${ice})`, ms_hold:"Largest shareholders on record", ms_ins:"All directors and executive officers together", ms_src:"annual report", ms_prx:"proxy statement",
  ms_note:"Shareholders listed are those above 5%, from each company's March 2026 proxy statement. BlackRock and Vanguard are fund managers: the shares mostly sit in index funds held for millions of savers, including retirement plans. The ICE amount is the stated percentage times stated revenue, so it is rounded. The other large contractors are private or part of larger groups and file nothing comparable.",
  mx_h:"What the records do not show", mx:["The daily price of a detention bed at each facility. GAO gives ICE's median; each facility's rate is in its contract, not in a public table.", "Who owns private companies. The largest shareholders of the listed companies are under Beds and owners, in What the listed companies tell investors.", "What has been paid out to each company, as opposed to committed. Committed amounts can be cancelled or grow."],
  oc_link:(y, a, b, c) => `In fiscal year ${y} ICE committed ${a} for contracts, services and supplies. ${b} of it is tied to a published award with a named recipient. The rest, about ${c}, has no payee in public records: payments to other agencies, such as the Bureau of Prisons, and to counties for jail space are recorded this way. The Contracts sub-tab counts contract records rather than ICE's accounts, so its total for the same year is different; the two sources are not reconciled by ICE.`, oc_min_h:y => `ICE's spending in finer categories, fiscal year ${y}`, oc_min_note:"The federal government's own spending categories (object classes), as ICE reports them. The number after each name is the category code.", oc_min:{"11.1":"Pay, full-time staff", "11.3":"Pay, other staff", "11.5":"Overtime and other pay", "11.8":"Special pay", "12.1":"Benefits", "13.0":"Benefits for former staff", "21.0":"Travel and moving people", "22.0":"Moving goods", "23.1":"Rent paid to GSA", "23.2":"Other rent", "23.3":"Phones, utilities and other charges", "24.0":"Printing", "25.1":"Advisory and consulting services", "25.2":"Other services from non-federal sources", "25.3":"Goods and services from other federal agencies", "25.4":"Running and maintaining facilities", "25.5":"Research", "25.6":"Medical care", "25.7":"Maintaining equipment", "25.8":"Support of people (subsistence)", "26.0":"Supplies", "31.0":"Equipment", "32.0":"Land and buildings", "41.0":"Grants", "42.0":"Claims and indemnities", "43.0":"Interest", "44.0":"Refunds", "99.0":"Other"},
  st_money:"ICE contract work done in the state", st_money_n:(p, a, b) => `${p}% of all ICE-funded contract money, ${a} to ${b}, by where the work is done; services run from headquarters show up in Virginia and DC`,
  net_back:(b, n) => `Drawn here: money paid out. ${b} was also taken back from earlier awards, so the net figure is ${n}.`, net_h:"The whole network: who pays whom", net_lead:"Every payer on the left, the companies and governments they pay on the right, grouped by owner. Band widths are dollars committed from October 2023 to September 2026. A company with bands from several payers is paid by several agencies. Tap any box to light up its links.", net_rest:"Everyone else", net_n:n => `${n} payers`, net_tap:"Tap a payer or a company to see its links.", net_paidby:"Paid by:", net_parts:x => `Includes: ${x}`, net_subs:n => `It reported ${n} subcontracts; the largest:`, net_chain:x => `Ownership: ${x}`,
  mgr_src:"Where the money comes from", mgr_src_l:"The budget laws, and ICE's spending by kind (its own staff included).", mgr_who:"Who gets it", mgr_who_l:"In the order the money moves: every agency paying, the whole network at once, what ICE bought, contracts without competition, every large contractor, companies paid by several agencies, who owns them, beds (what they cost and the ones paid for empty or full), and who the contractors paid next.", mgr_infl:"Political money and lobbying", mgr_infl_l:"Money from the companies' political committees and staff to members of Congress, and lobbying.", mgr_gaps:"What the records do not show",
  mf_h:"Follow the money", mf_lead:(tot, M) => `ICE committed ${tot} to contractors from ${M.from} to ${M.to}, and other agencies paid billions more to hold, care for or move people. Start with the trail below: tap a payer to follow its money down to the companies paid.`,
  mf_g:{GUARD:"Guards and running detention sites", AIR:"Flights", SUPPORT:"Management, logistics and support services", IT:"Computer systems and software", EQUIP:"Radios, body armor and other equipment", MEDICAL:"Medical care", BUILD:"Construction", OTHER:"Everything else"}, mf_oc_lead:n => `Every federal product and service code not in a group above: ${n} codes. The largest are listed first, under the government's own name for each, then the companies paid the most under them.`, mf_oc_h:"What it was spent on", mf_oc_who:"Who was paid the most", mf_oc_rest:n => `${n} smaller codes together, after cancelled awards`,
  mf_gd:{GUARD:"Federal code S206, guard services. This is the code used for operating detention sites and guarding and transporting detainees.", AIR:"Federal code V211, air passenger travel. Charter flights, including removal flights.", SUPPORT:"Nine federal codes for program management, logistics, background checks and similar services. The code does not say what the work was.", IT:"Twelve federal codes for software, hardware and IT labor.", EQUIP:"Radio and video equipment, body armor, special clothing and office furniture.", MEDICAL:"Federal code Q201, managed healthcare.", BUILD:"Federal code Y1JZ, construction of buildings.", OTHER:"All the smaller codes together. Not broken down here."},
  mf_rest:"Other companies in this group", mf_note:"About these contract figures. The amounts are obligations (money committed), not payments, read from USAspending.gov (the date is in About this data) and will change. The groups come from the code written on each contract, not from reading the contracts. They cover contracts only: money ICE pays counties and the U.S. Marshals to hold people is mostly not here. What companies paid on to subcontractors is under Who the contractors paid next; who owns each company is under Beds and owners.",
  nc_h:"Contracts awarded without competition, and one-bid competitions", nc_lead:(n, all, a, tot, pct) => `${n} of the ${all} ICE contracts of $1 million or more were awarded without competition. They account for ${a} of the ${tot} committed on those contracts in the period: ${pct}%.`, nc_what:"“Not competed” is the government's own label. The law allows it in set cases, such as when only one company can do the work or the need is urgent, and the record must state which. This section lists every such contract so each can be checked. It does not say any of them was improper.", nc_reason_h:"The reason on record", nc_none:"No reason recorded", nc_all:"Every contract awarded without competition", nc_find:"Find by company, reason or description", nc_hits:n => n === 1 ? "1 contract matches." : `${n} contracts match.`, nc_off:n => n === 1 ? "1 offer received" : `${n} offers received`, nc_one_h:"Opened to competition, one offer received", nc_one_p:(n, a) => `${n} contracts are recorded as competed but drew a single offer, for ${a} in the period. The record counts these as competed.`, nc_one_all:"Every one-offer contract", nc_flag_h:"Patterns worth a closer look", nc_flag_p:"Each list below is a plain filter on the records, chosen because these are the cases auditors usually examine first. Appearing here is not a finding against anyone.", nc_f1:"Not competed, and $50 million or more in the period", nc_f2:fy => `Not competed, to a company with no ICE contract dollars in fiscal year ${fy}`, aw_more:n => `${n} more companies with a contract of $1 million or more`, aw_h:"Its contracts of $1 million or more", aw_h2:n => `${n}: contracts of $1 million or more`, aw_open:"Open this contract on USAspending", aw_win:(w, l) => `${w} committed in this period · ${l} over the contract's life so far`, aw_life:l => `${l} over the contract's life so far (the amount for this period was not read)`, aw_c:{C:"Competed", N:"Not competed", L:"Order placed without fair opportunity", "":"How it was awarded is not recorded"}, nc_L:"Order placed without fair opportunity", nc_lead_L:(n, a) => `${n} of these are orders placed under a contract that was itself competed, but without letting the contract\u2019s other holders compete for the order (the record names the exception, such as only one source, urgency or a follow-on order). They account for ${a}. Earlier versions of this page counted them as competed.`, fw_h:c => `ICE guard-service contracts performed in ${c}`, fw_note:c => `ICE contracts of $1 million or more filed under the federal code for guard services, the code used for running detention sites, with ${c} recorded as the place of performance. They are shown here because this is the only facility on ICE's list in ${c}. The records name a place, not a facility, so a contract here may cover other work in the same city.`, aw_note:M => `Every ICE contract of $1 million or more with activity from ${M.from} to ${M.to}, read from USAspending on ${M.read}. The first amount is what ICE committed inside that period; the second is over the whole life of the contract, which can begin earlier. A contract under $1 million over its life is not listed, so these can add up to less than the company's three-year total.`, co_ven_find:"Find a contractor", co_ven_hits:n => n === 1 ? "1 contractor matches." : `${n} contractors match.`, yr_see:"Each company's amounts year by year are under \u201cEvery large contractor, largest first\u201d.", co_ven_all:"Every large contractor, largest first", co_ven_h:"Companies ICE has committed the most money to", co_ven_lead:(n, M) => `The ${n} largest recipients of ICE contracts from ${M.from} to ${M.to}, as USAspending.gov showed them on ${M.read}.`, co_amt:m => m < 0 ? "\u2212" + T.en.co_amt(-m) : m >= 1000 ? `$${(m / 1000).toFixed(1)} billion` : m > 0 && m < 1 || m === 0 ? "under $1 million" : `$${m} million`, co_dg:a => a ? `Filed under the industry codes for guard and facilities services: ${a} (\u201cWhat ICE bought\u201d groups by what was bought instead, so its totals differ)` : "Filed under the industry codes for guard and facilities services",
  co_ven_note:"These are obligations (money committed under contracts), not payments made, and later reporting will change them. The label marks contracts filed under the federal codes for security guard and facilities support services; the records do not say what else a company does. One parent company can appear under several names. Payments to counties under agreements are mostly not in this data.", co_ven_src:"USAspending.gov",
  lg_h:st=>`Free legal help listed for ${st}`, lg_aba_any:n=>`A referral hotline for people in immigration detention, which the same list names for immigration courts in ${n} states.`, lg_aba:"From inside ICE detention, dial 2150# for this hotline. The Justice Department lists the toll-free number for people held at military sites.", lg_note:"From the Justice Department's list of free legal service providers, October 2026. This is a partial copy: check the full list for more providers and for what each one does.", lg_full:"Open the full list",
  lg_kind:{nonprofit:"Nonprofit", referral:"Referral service", attorney:"Private attorney"}, lg_courts:c=>`Listed for: ${c}`,
  vs_ice:"ICE's page for this facility: visiting hours, phone calls, mail and money", vs_none:"ICE has no public page for this facility.",
  vs_wait:"Plain-language visiting and phone rules for each facility are not on this page yet. Calling the facility is the surest way to ask.",
  dr_h:n=>`ICE's public death reports: ${n} ${n==1?"death":"deaths"} tied to this facility since October 2022`, dr_link:d=>`ICE's report on the death of ${d}`,
  dr_ev:{B:"ICE's report names this facility, and ICE's detention record shows a death here on that date.", R:"ICE's detention record shows a death here on that date. The report itself was unclear or unreadable.", P:"ICE's report says the person was held here. No matching detention record."},
  dr_note:"Each link opens ICE's own report, which names the person. A death is tied to the facility that was holding the person when they died or were taken to hospital, so the death itself may have happened in a hospital. A report that could not be tied to one facility is left out.",
  nat_match:m=>`Of ${m.total} deaths ICE has reported since ${m.from}, ${m.placed} are shown on a facility's page, ${m.both} of them confirmed by both ICE's report and ICE's detention records. ${m.outside} happened outside any facility: during an arrest, in transit, or before reaching one. ${m.checking} could not be tied to one facility. Every report was read in full.`,
  nat_none:"The reports for this year have not been read yet.", nat_how:"Each date opens ICE's report on that death. Tap a facility's name to open its page.", nat_untied:"Not tied to one facility",
  nat_ev:{B:"confirmed by ICE's detention record", R:"from ICE's detention record; report unclear", P:"from ICE's report", O:"", U:""},
  fm_h:"Map of facilities, by kind", fm_show:"Show", fm_show_all:"Every facility", fm_show_watch:"Facilities on the alert list", fm_k:{D:"Immigration detention center", J:"Local or state jail", H:"ICE hold room or office", F:"Federal prison", S:"Staging site", O:"Other or unclear"},
  fm_note:"Tap a dot to open that facility (every facility is also in the search box and the lists, for keyboard and screen-reader users). Tap a label to hide or show that kind. The kinds are read from each facility's name and code, because ICE's own facility-type label is not in these records, so some are grouped wrongly.",
  fm_about:"How to read the map", fm_extra_h:"About the facilities map",
  fm_nopos_h:"In ICE's records, but no location given", fm_nopos_note:"These facilities appear in ICE's detention records, so people were held there, but the records give no address or map position for them. Most are hold rooms. They are listed by the state the records give.",
  fm_off_h:"In U.S. territories, not drawn on this map", fm_off_note:"These have a known location in Puerto Rico, Guam or the Northern Mariana Islands, which this map does not show.", fm_nostate:"No state given",
  fm_noloc:"This facility is in ICE's detention records, but the records give no address or location for it.",
  om_h:"Where inspections, visits and refusals happened", om_k:["ICE inspection report", "Official refused entry", "Member of Congress visit", "Death reported by ICE"], om_note:"Bigger blue dots mean more inspection reports. Tap a dot to open that facility (each one is also in the lists below), or a label to hide or show that kind. Visits and refusals are shown only where the source names one facility, so most are not on the map.",
  ptr_h:"Patterns in the record", ptr_lead:"Counted from what is on this page. The numbers are small and the sources incomplete, so read these as leads to check, not conclusions.",
  tr_q_h:"Members' statements over time", tr_q:Q=>{ const d = Q.reduce((s,q)=>s+q[2],0), v = Q.reduce((s,q)=>s+q[1],0); return `${v} statements about visits and ${d} about being refused entry, from ${Q[0][0]} to ${Q[Q.length-1][0]}.`; },
  tr_q_note:(a, b, old, und) => `From members' own press pages. ${a} of ${b} members' pages could be read, the oldest release read is from ${old}, and older pages were read less fully, so a quiet quarter may only mean it was not read.${und ? " " + und + " statements carry no date and are not on this chart." : ""}`,
  tr_r_h:"Reasons given for refusing entry", tr_r:(n,k)=>`Of the ${n} checked refusals, ${k} cite a requirement to give notice in advance.`,
  tr_i_h:"ICE's inspections by fiscal year", tr_i:(n,m)=>`${n} inspection reports are linked. ${m} facilities have more than one.`, tr_i_note:"Only reports ICE has posted and that could be matched to a facility. ICE posts reports with a delay, so the newest year can still grow.",
  tr_s_h:"States with the most inspection reports",
  tr_d_h:"Deaths and inspections", tr_d:(n,k)=>`${n} facilities have at least one death tied to them since October 2022. ${k} of those have no ICE inspection report linked here.`, tr_d_note:"The number in brackets is deaths tied to the facility. No report linked can mean none was posted, or that it could not be matched by name. Hold rooms and jails used briefly are often not inspected under the same program.",
  lf_psum:P=>{ const a = P.find(r => /postpartum/i.test(r[0])), m = P.find(r => /Miscarr/.test(r[0])); return (a ? `${a[2]} pregnant, postpartum or nursing people in custody on February 16, 2026. ` : "") + (m ? `${m[2]} miscarriages recorded. ` : "") + "Births are not reported."; },
  lf_dsum:(Y,m,E)=>`Since October 2022: ${Y.map(([y,c]) => `${c} in fiscal ${y}`).join(", ")}.` + (m ? ` ${m.placed} of ${m.total} tied to a facility.` : "") + (E && E.length ? ` Earlier years, counted but not placed at a facility here: ${E.map(([y,c]) => `${c} in fiscal ${y}`).join(", ")}.` : ""),
  pa_h:"Sexual abuse reports", pa_k:"Sexual abuse allegations in ICE's audit", pa_link:"Read ICE's audit report",
  pa_when:d => "Audit of " + new Date(d + "T12:00:00").toLocaleDateString("en-US", {month:"long", year:"numeric"}), pa_n:n => n === 1 ? "1 allegation reported in the period audited" : `${n} allegations reported in the period audited`, pa_floor:n => `at least ${n} (the report does not give a total)`, pa_zero:"the report says none were reported", pa_ns:"the report does not give a count", pa_unread:"published; the count has not been read from the report yet", pa_sub:n => +n === 0 ? "none substantiated" : `${n} substantiated`,
  pa_sum:(a, n, tot) => `${tot} allegations counted · ${a} audits read · ${n} facilities with at least one allegation`, pa_lead:M => `Federal law requires an outside audit of how each facility prevents and responds to sexual abuse. ICE publishes the reports. All ${M.audits} reports it has published since ${M.from} were read. The map and this list show the most recent audit of each facility; earlier ones are on the facility page.`, pa_more:n => n === 1 ? "1 earlier audit on the facility page" : `${n} earlier audits on the facility page`, pa_un_h:"Audited places not in the detention records", pa_un_note:"These audits name a hold room, staging site or closed facility that could not be matched to a facility on this page, so they are not on the map.",
  pa_some_h:"Allegations reported", pa_zero_h:"Audit says none reported", pa_ns_h:"Audit gives no count",
  pa_note:"These are allegations, not findings: most audits do not say how many were proven. Each count covers only the period the audit looked at, usually the year before and sometimes longer, and only audited facilities appear, so a facility with no dot was not audited in that period: it does not mean nothing happened there. A bigger facility holds more people and will tend to have more reports. No person is named here.",
  pg_h:"Pregnancies and births", pg_lead:"What the government has said about pregnant, postpartum and nursing people in ICE custody, what it has not said, and how long women are held.",
  pg_rep_h:"What ICE and DHS have reported", pg_rep_note:"National totals only. The 2025-2026 figures come from the Department of Homeland Security's answers to a Senate inquiry, as reported by the sources linked. The two counts for February 16, 2026 use different definitions. One source puts deportations at about 400.",
  pg_not_h:"What is not reported", pg_not:["Births in custody: no count has been published.", "Which facilities: no figure is broken down by facility, so nothing here can be shown on a facility's page.", "Miscarriages outside ICE's own medical facilities: ICE says it does not track them there.", "Regular reports: DHS sent Congress a report twice a year from at least 2019. Those stopped in 2025.", "How far along a pregnancy was at booking, or when it began: not in any public record."],
  pg_len_h:"How long women are held", pg_len:W=>`From ICE's detention records: ${W.ended.n.toLocaleString()} stays by women ended in the year to ${W.as_of}. Half lasted ${W.ended.median_days} days or less. ${W.ended.bands[3].toLocaleString()} lasted ${(W.edges || [[0],[0],[0],[280]])[3][0] === 365 ? "a year" : (W.edges ? W.edges[3][0] : 280) + " days"} or more, and another ${W.open.bands[3].toLocaleString()} women still in custody on that date had been held that long.`,
  pg_bands:["Under 30 days", "30 to 89 days", "90 to 364 days", "A year or more"], pg_ended:n=>`Stays that ended in the past year (${n.toLocaleString()})`, pg_open:(n,d)=>`Still in custody on ${d} (${n.toLocaleString()})`,
  pg_len_note:"A stay is one unbroken period in ICE custody, across every facility the person was moved through. These records cover all women, not only those who were pregnant; they do not record pregnancy.",
  pg_q_h:"Reporting sexual abuse and assault", pg_q:["ICE is required to report sexual abuse and assault in its facilities. Its reports and the way to make a report are on ICE's own page:"], pg_prea:"ICE: sexual abuse and assault prevention and reporting",
  dt_h:"Deaths", dt_yes:(y,a,s)=>`ICE's detention records show ${a} ${a==1?"death":"deaths"} at this facility since ${s}, ${y} in the past year.`,
  dt_no:"No stay at this facility in ICE's detention records (from October 2021) ended in a death. ICE's own death reports, which can include deaths these records miss, are listed separately below.",
  dt_note:"A death appears here only when ICE recorded \"died\" as the reason the person left this facility. Overall, ICE's public death reports list more deaths than these records, but for a single facility the two counts can differ either way: a report may tie a death to the facility that sent the person to hospital, while the record shows where the stay ended.",
  rp_h:"Who represents this area in Congress", rp_house:d=>`House, ${d}`, rp_sen:"Senate", rp_wait:"House member: not looked up yet.",
  vi_h:"Visits by officials", vi_none:"No visit is logged for this facility yet. A visit is added when there is a public source: a news report, an official statement, or a post on the official's own verified account.", vi_denied:"Denied entry", vi_admitted:"Admitted",
  vi_rules:"Federal spending law bars the Department of Homeland Security from stopping members of Congress from visiting detention facilities or requiring advance notice. A federal judge suspended the notice rules the department issued in 2025 and in January 2026; the government has appealed. Since May 11, 2026, ICE has asked members to name the detainees they want to meet two business days ahead. The timeline on the Official visits and inspections tab has the dates and sources.", vi_rules_src:"Source: CBS News", vi_log:"This log is incomplete. It lists only visits that have a public source.",
  insp_none:"No ICE inspection report is matched to this facility yet.", a287_none:"No local agency in this facility's county is on ICE's list of 287(g) agreements.",
  ag_map:(c,n)=>`Each dot is a county with at least one agreement; bigger dots mean more agencies. ${c} counties shown. ${n} agencies have no county on ICE's list (mostly state agencies), a misspelled one, or are in a territory, and are in the list below only. Grey states have a law against these agreements. Tap a state to see its list.`,
  ag_ban:st=>`${st} has a state law that bars local agencies from signing these agreements.`, ag_ban_some:st=>` ICE's list still shows agreements here; they may predate the law or be under dispute.`, ag_src:"Source",
  ag_none:st=>`No agency in ${st} is on ICE's list.`, agc_n:n => n === 1 ? "1 agency in this county has signed an agreement with ICE." : `${n} agencies in this county have signed an agreement with ICE.`, agc_list:"Show this county in the full list", agc_none:"The agencies for this county could not be listed.", ag_call:"Call", ag_nophone:"No phone number matched yet",
  ag_contact:n=>n ? `Phone numbers and addresses come from a federal list of police offices that was last checked in 2018 or 2019. ${n} agencies are matched. Numbers can be out of date: if one fails, search the agency's own website.` : "Phone numbers for these agencies are not loaded yet.",
  st_meta:(m)=>{ const by = Object.entries(m.party||{}).map(([p,n])=>`${n} from ${({Democrat:"Democratic", Republican:"Republican", Independent:"independent"})[p] || p} members`).join(", "); const rd = m.read ? " Press pages read: " + Object.entries(m.read).map(([p,[a,b]])=>`${a} of ${b} ${({Democrat:"Democratic", Republican:"Republican", Independent:"independent"})[p] || p}`).join(", ") + "." : " Only about a third of members' press pages could be read so far, so this is incomplete for both parties."; return `Refusal statements found: ${by || "none"}. The oldest release read is from ${m.oldest || "an unknown date"}.${rd}`; },
  st_hist:"Earlier years: a search of news and members' sites for January 2020 to January 2025 found no case, from either party, where a source says a member was refused entry to an ICE, Border Patrol or migrant-shelter site. Cases where only cameras were barred, or where the site was not a custody site, are not counted. That search is not exhaustive.",
  st_h:"What members of Congress say on their own sites", st_fh:"Press statements that name this facility",
  st_note:"Collected automatically from members' official .gov press pages. These are the members' own statements and have not been checked. A statement can be about someone else's visit. The same rule is applied to every member of either party: a press release is kept when it mentions ICE, immigration or detention together with a visit, tour or inspection (or a visit refused), whatever its tone. Releases that only plan, request or argue about visits are left out. How many statements each party has depends on what members choose to publish.",
  tab_over:"Official visits and inspections", snap_open:"Open the full facility page", snap_close:"Stay on this page", snap_call:"Facility phone:", insp_all_h:"Inspection reports", bu_h:"Guaranteed beds that sat empty", bu_p:(fy, k, n, e, tot, pct) => `In fiscal year ${fy} so far, ${k} of the ${n} sites with a guaranteed number held fewer people on an average day than ICE had agreed to pay for. Together that is about ${e} beds paid for and not used on an average day, ${pct}% of the ${tot} guaranteed at those ${n} sites.`, bu_row:(gm, avg, e, pct) => `Pays for at least ${gm} · held ${avg} on an average day · ${e} empty (${pct}%)`, bv_said:(co, amt, least, beds, doc, pay) => `Company-stated: ${co} told investors it expects ${least ? "more than" : "about"} $${amt} million a year from this site, with ${beds} beds (${doc}).${pay ? " " + pay : ""}`, bv_calc:(n, least) => `Calculated by this page: ${least ? "at least" : "about"} $${n} per bed per day, if that yearly figure were spread evenly over every one of those beds. This is not a price from the contract.`, bv_doc:{annual:y => `its annual report for ${y}`, release:d => `its announcement of ${d}`}, bv_pay:{fixed:"The company says it is paid a fixed amount each month.", mixed:"The company says it is paid a fixed amount each month plus an amount per person held."}, bv_rest:"Company-stated figures at other sites", bv_sold:d => `The company sold this site to the Department of Homeland Security (announced ${d}) and says it expects to keep running it for ICE under its existing contract. The yearly figure was stated before the sale.`, bv_src:"Source", bv_note:"Where a line begins “Company-stated”, the yearly amount is what the company told its investors it expects, not what ICE has paid, and the bed count is the company's, which can differ from ICE's guaranteed minimum. The per-bed figure is this page's own division. No contract's daily price is public, so the dollar figure for empty beds on the beds tile is this page's estimate at ICE's median daily bed rate, not a billed amount.", bu_now:(n, d) => `Held on ${d}: ${n}`, bu_note:fy => `Both numbers come from ICE's own detention statistics file: the guaranteed minimum, and the average number of people held each day in fiscal year ${fy} to date. Read with care. The average covers the whole year so far, so a site that opened or whose guarantee began part-way through looks emptier than it is now; the line under each site gives the latest count. Some contracts guarantee a payment in other ways. An empty paid bed is a cost to taxpayers; whether it is waste is a judgment this page does not make.`, mp_kind:{D:"Leadership fund: a committee a politician controls, separate from their campaign", J:"Joint fundraiser: collects money and splits it among several committees"}, mp_spon:x => `Sponsor on record with the FEC: ${x}`, mp_share:x => `Shares what it raises with: ${x}`, mp_share_n:n => `Shares what it raises with ${n} committees (tap to list)`, mp_nodetail:"Whose fund each of these is, and which committees a joint fundraiser passes its money to, are in the FEC's records and will appear here once this page's FEC connection is set up.", op_money_l:"Separately, from Follow the money:", bu_left:n => `${n} more ${n === 1 ? "site has" : "sites have"} a guarantee but no population figure in ICE's file and ${n === 1 ? "is" : "are"} left out of this comparison.`, two_l:"Two routes", two_t:"This company holds ICE contracts directly and also receives subcontracts from another ICE contractor.", st_link:w => `Statement from ${w}`, st_member:"a member of Congress", st_nodate:"date not given", tab_fam:"For families", fam_lead:"If someone you know has been detained by immigration, start here. This page never asks for a name and sends nothing about you anywhere. (Your browser's history will show the pages you opened; clear it if others use your phone.)", fam_1h:"1. Find where the person is now", fam_1n:"If the locator shows nothing: it can take days to update after an arrest or a move. Try again later, and use step 2 in the meantime.", fam_kid:"If the person is under 18 and was alone, they are held by a different agency (ORR). Its call center for parents and relatives:", fam_2h:"2. Call the last place you know they were", fam_2p:"Type the last facility, city, state or ZIP code you know. You will get the numbers to call, and where people held there are usually sent next.", fam_call:"Ask if the person is there, and how to set up a call or visit:", fam_nophone:"ICE lists no phone number for this place.", fam_office:o => `The ICE office in charge of it (${o}):`, fam_next:"If they have been moved, these are the places people held here were most often sent next. Call them in this order:", fam_pct:p => `${p}% of those moved`, fam_legal:s => `Free legal help in ${s} (from the Justice Department's list):`, fam_full:"Everything on record for this facility", fam_3h:"3. Check the court case", fam_3p:"The immigration court's automated line gives the next hearing date and the case status, in English and Spanish, at any hour. You need the person's A-number (the letter A and 8 or 9 digits, on their immigration papers).", fam_3n:"free call", fam_3a:"Check the case online", fam_5h:"5. If a bond has been set", fam_5p:"A bond is money paid so the person can be released while the case goes on. ICE or an immigration judge sets the amount. According to ICE:", fam_5law:"Not everyone can get a bond hearing now. Since 2025, ICE has held many people who entered the US without being inspected with no bond hearing before a judge, and courts are divided on whether that is lawful. A lawyer (step 4) can say whether a bond hearing, or a habeas petition asking a federal court to order one or to release the person, is possible in this case.", fam_5fund:"Nonprofit bond funds that can pay a bond for you (directory)", fam_5l:["It is paid online through ICE's system, called CeBONDS. The full amount is paid at once, by bank transfer only (Fedwire or ACH). No cash or cards.", "A US citizen, a lawful permanent resident, a law firm or a non-profit can pay it. If you do not have lawful status yourself, do not go to an ICE office to pay: a nonprofit bond fund or a lawyer can pay for you. Whoever pays needs the person's full name and A-number, and their own proof of status.", "Payments are handled 9 a.m. to 3 p.m., Monday to Friday, in the time zone where the person is held. Review usually takes one to two hours.", "No bank account? ICE says a licensed bond company or a community group can pay for you. Bond companies charge fees you do not get back, and some require an ankle monitor: read any contract before you sign it."], fam_5a:"ICE's page: Post a Bond", fam_5n:"Not everyone is given a bond. The court line in step 3 or a lawyer can tell you if one has been set.", fam_6h:"6. Visits, calls, mail and sending money", fam_6p:"The rules are different at every facility. Type the facility in step 2 and open its full page: the section called “Visiting, calls and mail” links to ICE's own page for that facility, with its hours and rules. The facility's phone number is the surest way to ask.", fam_6m:"Phone accounts and money for the commissary (the facility store) usually go through a company the facility works with; ICE's page for the facility usually says which one and how. Use only the ways that page or the facility gives you.", fam_6w_h:"Before you visit:", fam_6w:"visitors usually have to show a government photo ID, and the facility may check it. If you are worried about your own immigration status, ask a lawyer first, or keep in touch by phone, video call or letters instead.", fam_4h:"4. Get free help", hl_hand:d => `(checked by hand on its official page, ${d})`, fam_4in:"From inside detention, a person can call this hotline free by dialing 9233#.", fam_4out:"Family and friends can call:", fam_kyr_h:"What the person should know", fam_kyr:["They have the right to stay silent and to ask for a lawyer.", "They should not sign any paper they cannot read or do not understand. Signing can mean agreeing to leave the country.", "A lawyer who has filed form G-28 for them is told when ICE moves them to another facility. Moves can happen fast."], fam_dril:"Medical needs, disability or mistreatment: tell the facility, then call ICE's Detention Reporting and Information Line, free, which takes reports from people held and their families:", fam_note:"Every phone number and help link on this page is checked each week against the official page that publishes it (ICE, the Justice Department, the Department of Health and Human Services, the foreign ministries and the groups named), and is hidden if that page no longer shows it. A number can still change between checks.", fam_scam_h:"Help here is free.", fam_scam:"The ICE locator, the court line and the hotlines below cost nothing. Never pay anyone who calls or messages offering to find the person, speed up the case or arrange a bond. Only a lawyer or a representative accredited by the Justice Department can give legal advice; a “notario” cannot.", fam_8c:"Immigration court line (step 3):", fam_all:"All eight steps for families: the court line, bond, visits, the consulate and more", fam_anum:"An A-number is the letter A and 8 or 9 digits. It is on the Notice to Appear, a work permit card, and most papers from ICE or the immigration court.", gl_aria:"Globe showing ICE flights and facilities. The same flights are listed below.", gl_l:"Turn the globe left", gl_r:"Turn the globe right", gl_u:"Tilt the globe up", gl_d:"Tilt the globe down", tr_w_h:"Where officials were refused entry", tr_w:(n, l, p, o) => `Of the ${n} checked refusals, ${l} were at detention sites on ICE's own list (${p} of them privately run) and ${o} were at ICE offices and hold rooms, where people are held for hours or days before being moved.${n - l - o > 0 ? ` ${n - l - o === 1 ? "The other one was" : `The other ${n - l - o} were`} at another kind of site, shown in the chart.` : ""}`, tr_w_p:"Privately run detention site", tr_w_g:"Government-run detention site", tr_w_x:"ICE office not in the detention records", tr_w_top:"Places with more than one refusal", tr_w_n:n => `${n} refusals`, tr_w_note:"Counted from the list of refusals in the tab on official visits, where each has its source. A site is counted as privately run by who ran it on the day. Only refusals with a public source are counted, so these are floors, and a place visited more often has more chances to refuse.", z_in:"Zoom in", z_out:"Zoom out", z_reset:"Whole map", yr_h:"Year by year: what grew", yr_p:(a, b) => `The same contract dollars, split by fiscal year ${a} to ${b}. A fiscal year runs from October to September.`, yr_g:"By what was bought", yr_x:x => x >= 1 ? `${x} times the first year` : `${Math.round(x * 100)}% of the first year`, yr_new:(y, n) => `Paid nothing in fiscal year ${y}, paid since (${n})`, yr_new_p:y => `Among the 60 largest recipients: companies with no ICE contract dollars in fiscal year ${y} and at least $5 million since.`, yr_r:n => `The largest recipients, year by year (${n})`, yr_note:n => `Dollars are obligations: money ICE committed in that year, not money paid out, and a cancelled award counts as a negative. The yearly figures for each company come from a search by company name and are shown only where they add up to that company's total${n ? `; ${n} of the 60 largest did not and are left out of this list` : ""}. A new name can also be an existing company that changed its name or was bought.`,
 cp_h:"How the contracts were awarded", cp_p:"Every federal contract record says whether other companies were allowed to bid. This is the government's own code on each record, added up.", cp_fy:y => `Fiscal year ${y}`, cp_row:(nc, pct, c, nr) => `Not competed: ${nc} (${pct}%) · Competed: ${c} · Not recorded: ${nr}`, cp_top:"Most not-competed dollars, whole period", cp_note:"\"Not competed\" covers contracts awarded to one company without bidding, follow-on awards to an earlier competed contract, and orders placed without competition under an existing contract. The law allows this in set cases, such as urgency or only one capable supplier; the record does not say whether a case was justified. \"Not recorded\" is money on records that carry no competition code. These yearly totals follow each contract's own code, so an order placed without fair opportunity under a competed contract counts as competed here; the list of contracts below counts it separately.",
 pq_h:"When the money was given, by quarter", pq_p:"From each committee's own periodic reports to the FEC: its contributions to federal candidates and committees in the reports ending in that quarter. Where these totals differ from the list below, which is counted by recipient, the difference is shown.",
 ml_iss:"Issue areas named on its filings", ml_iss_n:"The number of quarterly filings that tick each issue area on the disclosure form. A filing can tick several.", ml_q:"Quarter by quarter", ml_q_row:(own, out) => `Its own report: ${own} · Paid to outside firms: ${out}`,
 ox_held:"People held at its sites on the latest count", ox_empty:fy => `Guaranteed beds empty on an average day, fiscal year ${fy}`, ox_def:n => `Deficiencies per ICE inspection (${n} ${n === 1 ? "inspection" : "inspections"})`, vg_1:"Get help", vg_2:"Who works with ICE", vg_3:"Conditions and oversight", vg_4:"Money and patterns", vg_5:"About", tab_about:"About this data", ft_about:"About this data: where it comes from, and its limits", tab_trends:"Trends and patterns", tab_life:"Deaths, sexual abuse and pregnancies reported", lf_lead:"What the government has reported about pregnancies in ICE custody, the sexual abuse allegations counted in ICE\u2019s own audits, and every death ICE has reported since October 2022, by year and facility, with the yearly counts for earlier years.", lf_map_h:"Where deaths and sexual abuse allegations were reported", lf_map_note:"Each dot is a facility, and a bigger dot means more. The labels above the map say what each color is: tap a label to hide or show it, and tap a dot to open that facility (each one is also in the lists below). Deaths are the ones ICE has reported since October 2022, placed at the facility that was holding the person when they died or were taken to hospital. Sexual abuse allegations are the ones counted in audits ICE has published, so a facility with no dot may simply not have been audited. Pregnancy figures exist only as national totals and are not on the map.", ov_lead:"Who has gone in to check on these facilities, who was turned away, and what inspectors reported: ICE\u2019s own and independent ones.",
  ov_insp_h:"ICE's inspection reports, by state", ov_insp_n:(r,f)=>`${r} reports for ${f} facilities. Tap a state, then a date to open ICE's report, or a facility's name to open its page.`,
  ov_insp_note:"These are ICE's own inspections of itself and its contractors. Each report is linked with the number of deficiencies it cites where that could be read. ICE's pass or fail rating is not in the reports list; where ICE's statistics file gives one, it is on the facility's page.",
  dn_h:"Members of Congress turned away", dn_note:"Only refusals with a public source are listed. An official who was turned away and said nothing publicly is not here, so the true number is higher. Some sites are run by a state or the federal prison system for ICE, and the refusal came from them.",
  ag_nocounty:"No county listed (mostly state agencies)", ag_open:st=>st ? "Choose a county above, or type a name, to list its agencies." : "Choose a state and a county above, or type a name, to list the agencies.", ag_county:"County", ov_pick:"Choose a state", ag_cty_first:"Choose a state first", ag_cty_all:n => `All counties (${n})`,
  ag_state:"State", ag_find:"Agency or county", ag_ph:"Type a county or agency", ag_all:"All states",
  ag_lead:(n,d,k)=>`${k} local and state agencies hold ${n} agreements to do immigration enforcement for ICE, called 287(g) agreements. One agency can hold up to three kinds. List as published by ICE on ${d}.`,
  ag_count:(n,st)=>`${n} ${n==1?"agreement":"agreements"}${st ? " in "+st : ""}`, ag_more:n=>`Showing the first 150 of ${n}. Type to narrow the list.`,
  ag_M:{T:"Task force", J:"Jail enforcement", W:"Warrant service", "?":"Other"}, ag_signed:d=>`signed ${d}`,
  ag_models_h:"What the three kinds mean",
  ag_T:"Task force: officers can question and arrest people over immigration status during their regular police work.",
  ag_J:"Jail enforcement: officers question people already in the local jail about immigration status and start deportation paperwork.",
  ag_W:"Warrant service: officers serve ICE's warrants on people already in the local jail.",
  ag_money:"This list shows who signed. It does not show what any agency spends on the work or is paid for it.",
  tab_find:"Find a facility", noname:"This page searches facilities, not people. It never asks for a name. To look up a person:", tab_flights:"Flights",
  k_intl:"Left or entered the US", k_abroad:"Between two airports outside the US", k_dom:"Within the US", k_hub:"Airport these flights used (bigger means more)", k_fac:"Detention facility (tap one)",
  fl_help:"Drag to turn the globe. Lines are the positions the aircraft actually broadcast; a gap or straight jump means the signal was lost.",
  fu_h:n => `Every airport these flights used (${n})`, fu_lead:(d, seen, lost) => `Over the ${d} days read, the tracked aircraft were seen taking off or landing ${seen} times. Another ${lost} take-offs and landings are not counted here because the signal was lost before the aircraft was low and close to an airport.`, fu_us:"In the 50 states", fu_ab:"Outside the 50 states", fu_n:(dep, arr) => `${dep} out · ${arr} in`,
  fu_note:"Alexandria, Harlingen and Mesa are not the only airports shown. They are the test used to decide that a contractor aircraft was flying for ICE that day; every other airport that aircraft used the same day is listed here. A contractor aircraft that never touched one of the three on a given day is not in the data at all. Signal is lost most often outside the United States, so foreign airports are badly undercounted here; the country table below counts those flights by where the signal ended. An airport appearing here does not prove every flight there carried detainees.",
  fl_how:"How flights are picked: only aircraft flying under a contractor callsign are read, and a day is kept when the aircraft starts or ends a flight at Alexandria, Harlingen, or Mesa. Contractor planes also fly ordinary charters, and flights that avoid those airports are missed, so this is a minimum. Nobody on board is identified.",
  fl_lost:"\"Last seen near\" means the signal was lost before landing. The airport named is the closest one, not a confirmed landing.",
  fl_lead:(n,t,i,d)=>`${n} flights by ${t} contractor aircraft on ${d}, the newest day on record. ${i} left or entered the US. Flight data shows where a plane went, never who was on board: it cannot tell you whether a particular person was moved or deported. For that, use the detainee locator in For families.`,
  fl_h:d=>`Flights on ${d} (times in UTC, which is 7 or 8 hours ahead of Pacific time and 4 or 5 ahead of Eastern)`, cm_h:"Map: privately run detention sites", cm_lead:(n, s, beds, bn) => `${n} sites in ${s} states. At ${bn} of them ICE pays for a set number of beds whether or not they are filled: ${beds} beds in all.`, cm_off:n => `${n} could not be placed on the map and are only in the list below.`, cm_note:"A bigger circle means more beds ICE pays for whether filled or not; the smallest circles have no such number on record. Tap a circle to open the site.", tp_lead:"What the records on the other tabs add up to over time. Every chart here is counted from data shown elsewhere on this page; open the matching tab for the detail and the sources.", tp_open:"Tap a topic to open its charts.", tp_note:"Read these as leads to check, not conclusions. Several series are incomplete in ways that change their shape; the note under each chart says how.",
  pt_card:"Full scorecard", pt_fail:"This card could not be loaded. Check your connection and try again.", pt_g:(st, p) => `Governor of ${st}${p ? " (" + p + ")" : ""}`, pt_gw:(st, p, a, b) => `Governor of ${st}${p ? " (" + p + ")" : ""}, ${a} to ${b}`, pt_l:(ti, of, st) => `${ti}, ${of} (${st})`, pt_a:(ti, ag, st, d) => `Signed the 287(g) agreement for ${ag} (${st})${ti ? " as " + ti : ""}${d ? ", " + d : ""}`, pt_v:(post, co, firm, y) => `Lobbied for ${co} through ${firm} (${y}). Past government post: ${post}`, pt_d:(role, d, pl) => `Named in a dispute with ICE (${d}, ${pl}) as ${role}`, pt_w:(role, law) => `Wrote or sponsored ${law} (${role}), a law in a dispute with ICE`, pt_s:(law, bill) => `Sponsored ${bill} (${law})`, pt_gift:(n, u, who) => `Gave ${u} in ${n} gifts, by FEC filings${who ? ", listed as " + who : ""}. Most to:`, pt_ties:"Ties found across this site", pt_x:"These records were joined by first and last name only. They may not all be the same person; check each source.", pt_go_d:"Open the disputes for this state", pt_go_st:"Open this state's scorecard", pt_src:"Source", pt_moa:"Agreement", pt_law:"The law", pt_site:"Official site", pt_same:"Same name elsewhere on this site", pt_more:"More on this person", pt_dn:"Same name as someone else on this site", pt_none:"Nothing else on this site names this person.", more_wait:"Loading the rest of this tab…", more_fail:"Part of this tab could not be loaded. Check your connection, then open the tab again.", chg_h:(d, s0) => `What changed in the update of ${d} (since ${s0})`, chg_k:{held:"People in ICE detention, latest month", deaths:"Deaths in ICE custody listed by ICE, all years shown", agreements:"Active 287(g) agreements", contract_musd:"Committed to contractors in three fiscal years", facilities:"Facilities on ICE's list", allegations:"Sexual abuse allegations counted in audits", refusals:"Officials refused entry, checked reports", inspections:"ICE inspection reports linked"}, chg_note:"Only headline counts that moved are listed. A count can fall when a source corrects itself or drops a record.", raw_p:"The data files behind this page are public, with the code that builds it:", raw_a:"Open the data files", tp_tap:"Tap a number to see it drawn.", tp_close:"Close", tp_rest:"Every other contractor", tp_note_ob:"Dollars committed under contracts in the three fiscal years, from USAspending. Not payments made.", tp_note_fam:"Companies with the same owner in the federal contractor registry. A dash means the company is outside the 60 largest and its amount is not listed here.", tp_note_beds:"Guaranteed beds on ICE's own facility list, by who runs each site today.", op_um:(n, b) => `${n === 1 ? "One site" : n + " sites"} on ICE's list with ${b} guaranteed beds could not be matched to a facility here, so ${n === 1 ? "it is" : "they are"} in the page's headline bed total but not in these bars.`, n_sites:n => n === 1 ? "1 site" : `${n.toLocaleString()} sites`, tp_mo_ynote:"“Available to spend” is not a yearly budget. It includes money carried over from earlier years and, from fiscal year 2025, the extra money Congress gave ICE in July 2025 to spend through 2029. Do not add the years together. The newest year counts everything ICE has reported so far, which runs later than the quarter shown in the spending-by-kind breakdown. The Budget sub-tab of Follow the money has the detail.", tc_part:"(may still change)", tc_partn:"The last, lighter bar is a period that is not finished, or whose records are not all published yet, so it may still change.", tc_nums:"Show the numbers", tp_over_h:"Visits, refusals and inspections", tp_before:"Before 2025", fl_wait:"Loading the flight records…", fl_fail:"The flight records did not load. Check your connection and try again.", fl_retry:"Try again", tp_t_fl:d => `flights on record over ${d} days`, tp_t_ag:"active 287(g) agreements", tp_t_pa:(n, a, b) => `sexual abuse allegations counted in ${n} audits, ${a}–${b}`, tp_t_pg:(m, w, on) => `${m.charAt(   tp_lf_h:"Deaths and sexual abuse audits", tp_lf_lead:"Counts from ICE's own published records.", tp_lf_d:"Deaths in ICE custody listed by ICE, by fiscal year", tp_lf_dnote:"ICE's list can lag; recent deaths may not be posted yet.", tp_dt_h:"How long people had been held when they died", tp_dt:(x, P) => `ICE's detention records end ${x.n} stays with "died" since ${x.from}. Half of those people had been in ICE detention ${x.median_days} days or less. ${P(x.within30)} died within their first 30 days; ${P(x.over180)} had been held more than six months.`, tp_dt_n:m => `This is fewer than the ${m.total} deaths ICE has reported. The two sources count differently: for example, a person moved to a hospital may be recorded as released before they died. The records do not say how often this happens. The two lists do not line up one for one: ${m.both} reported deaths were matched to one of these records by place and date, and the rest could not be matched in either direction. ICE's death reports do not state a cause in a consistent form, so causes are not counted here; each report is linked from its facility.`, tp_lf_p:"Sexual abuse audits, by year of audit", tp_lf_pa:"Allegations counted in that year's audits", tp_lf_pn:"Audits published", tp_lf_pnote:"Each audit looks back about a year at one site, and different sites are audited each year, so a higher bar can mean more sites audited, not more abuse.", src_h:"Where each kind of data comes from, and how recent it is", stv_h:"Statements about visits that went ahead",

  lgl_h:"Legal", lgl_lead:"What this page is, what it is not, and how it treats you and the people in its records.",
  lgl_s:[
    ["Not legal advice", "Polar Star gives information, not legal advice. Nothing here creates a lawyer–client relationship. For a person's case, contact a lawyer or one of the free legal service providers listed on each facility page, or call the immigration court hotline."],
    ["Accuracy and sources", "Every figure comes from a public record: government data, government reports, court and contract records, or a named organization's published work. Each section links to its source and says how recent it is. Government records contain errors and gaps, and agencies sometimes stop publishing; where we know of a gap, the page says so. Before relying on a figure for a decision, a filing or a publication, check it against the linked source.", "Facility and contact details can change faster than the records do. To find where a person is right now, use ICE's online detainee locator and call the facility."],
    ["Independent, and never commercial", "Polar Star is not affiliated with, endorsed by, or funded by ICE, the Department of Homeland Security or any other government agency, company or political group. It is free, carries no advertising, and will never be sold or used for profit. Agency, company and product names identify the organizations in the records; their use does not imply any connection or endorsement."],
    ["Privacy", ["No accounts, no sign-in, and no forms that send anything.", "No cookies, no analytics, no advertising or tracking code. Fonts and code are served with the page, so loading it contacts no other company.", "Searches you type stay in your browser and are never sent anywhere.", "Links to outside sites (government pages, source documents) take you to those sites, which have their own privacy practices.", "The host that serves the page may keep ordinary server logs, as every website host does."]],
    ["People in the records", "Polar Star does not accept, store or show information about private people, with the one exception at the end of this section. Counts are made from records with no names, and small groups are not broken out where a person could be identified. Members of Congress and other officials are named only for actions taken in office, and candidates and former officials only as FEC records name them; companies and agencies are named as organizations. ICE's own public death reports, which this page links to, name the person who died; Polar Star does not repeat those names in its own text. The exception is political giving: people who gave more than $200 to a federal candidate or committee and named a detention or removal company as their employer are listed by name, as the Federal Election Commission publishes them, for the historical record. Only the name, employer and job as filed, the state, the amount, the date and the recipient are shown, never an address, and each gift links to its filing. Federal law forbids using these names to ask for money or for any commercial purpose; Polar Star uses them for neither."],
    ["Outside content", "Linked documents belong to their publishers. Polar Star links to them rather than copying them, and is not responsible for their content or availability."]],
  lgl_fix_h:"Corrections", lgl_fix:"Found an error or an outdated detail? Tell us what and where, with a source if you have one:", lgl_fix_none:"A contact address for corrections will be listed here at launch. Every correction will be checked against the source and dated in the update notes on the About this data tab.",

  rs_h:"For researchers, clerks and reporters", rs_lead:"How the numbers on this page are made, how to cite them, and what you may reuse.",
  rs_cite_h:"How to cite this page", rs_cite_p:"Give the date the data was built, and link to the exact view you used: every tab, and every facility, has its own address in the browser bar. For any figure that matters, cite the primary source linked beside it as well.",
  rs_cite:(pub, d, u) => `${pub}, Polar Star: immigration detention data (data built ${d}). ${u}`, rs_cite_n:"The page is rebuilt whenever its sources update, often several times a week, so figures can change; the date tells readers which version you saw. The update notes on the About this data tab list what changed.",
  rs_how_h:"How the numbers are made", rs_how:[
    "Counts only. Person-level records (detention stays, arrests, detainers) are read by automated scripts that write totals; no record about a person is kept or shown.",
    "Fiscal years run October to September: fiscal 2026 is October 2025 to September 2026.",
    "The newest month or year is usually unfinished. Charts draw it lighter or dashed and say so; compare it with care.",
    "Likely duplicate records, as flagged by the Deportation Data Project, are removed before counting.",
    "Money is what agencies committed (obligated) in federal spending data, not what was finally paid; money taken back is subtracted.",
    "When an agency's later file shows an earlier period as zero, the count from its earlier file is kept and the page says so.",
    "Each source has an expected update rhythm. When one falls behind, the page marks it as out of date rather than hiding it. The list of sources and their dates is on the About this data tab."],
  rs_dl_h:"Getting the data", rs_dl_p:"Every chart has a \"Show the numbers\" table with a button to download it as a spreadsheet file (CSV). Where a viewer blocks downloads, the button shows the table as text to copy instead. The source of every figure, with its date and link, is listed on About this data.",
  rs_cr_h:"Data from other projects", rs_cr_p:"Most figures come straight from government sources, which are public domain. Some come through other projects that collected or organized public records. Each one sets its own terms; here is what they allow and how this page credits them.",
  rs_cr:[["Deportation Data Project", "ICE records obtained under the Freedom of Information Act. Released under CC0: free to use, no conditions.", "Credited on every section that uses them, with a link to deportationdata.org."],
    ["adsb.lol (aircraft positions)", "Open Database License (ODbL): free to use with credit, and any database made from it must be shared under the same license.", "Credited as \"© adsb.lol contributors, ODbL\". The flight data this page builds from it is shared under the same license."],
    ["Tracking 287(g) (appelson)", "A daily archive of ICE's own 287(g) lists. The archive's code is MIT-licensed; the lists are ICE's public records.", "Credited on the State and local agencies working with ICE tab with a link to the archive."],
    ["TRAC, Syracuse University", "Published reports. The habeas counts are facts taken from a public TRAC report.", "Cited by name with a link to the report beside the figures."],
