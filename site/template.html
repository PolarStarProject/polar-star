  lgl_s:[
    ["No es asesoría legal", "Estrella Polar da información, no asesoría legal. Nada aquí crea una relación entre abogado y cliente. Para el caso de una persona, busque un abogado o uno de los servicios legales gratuitos que aparecen en la página de cada centro, o llame a la línea de la corte de inmigración."],
    ["Exactitud y fuentes", "Cada cifra viene de un registro público: datos del gobierno, informes del gobierno, registros de cortes y contratos, o el trabajo publicado de una organización nombrada. Cada sección enlaza a su fuente y dice qué tan reciente es. Los registros del gobierno tienen errores y vacíos, y las agencias a veces dejan de publicar; cuando conocemos un vacío, la página lo dice. Antes de usar una cifra para una decisión, un trámite o una publicación, verifíquela en la fuente enlazada.", "Los datos de contacto de un centro pueden cambiar más rápido que los registros. Para saber dónde está una persona ahora, use el localizador de detenidos de ICE y llame al centro."],
    ["Independiente, y nunca comercial", "Estrella Polar no está afiliada, respaldada ni financiada por ICE, el Departamento de Seguridad Nacional ni ninguna otra agencia del gobierno, empresa o grupo político. Es gratuita, no tiene anuncios y nunca se venderá ni se usará con fines de lucro. Los nombres de agencias, empresas y productos identifican a las organizaciones de los registros; usarlos no implica ninguna relación ni respaldo."],
    ["Privacidad", ["Sin cuentas, sin inicio de sesión y sin formularios que envíen algo.", "Sin cookies, sin analítica, sin anuncios ni código de rastreo. Las fuentes tipográficas y el código vienen con la página, así que al cargarla no se contacta a ninguna otra empresa.", "Lo que usted escribe en las búsquedas se queda en su navegador y nunca se envía.", "Los enlaces a otros sitios (páginas del gobierno, documentos fuente) lo llevan a esos sitios, que tienen sus propias prácticas de privacidad.", "El servicio que aloja la página puede guardar registros normales de servidor, como cualquier sitio web."]],
    ["Las personas en los registros", "Estrella Polar no acepta, guarda ni muestra información sobre personas particulares, con la única excepción que se explica al final de esta sección. Los conteos se hacen con registros sin nombres, y los grupos pequeños no se desglosan donde se podría identificar a alguien. Los miembros del Congreso y otros funcionarios se nombran solo por lo que hicieron en su cargo, y los candidatos y exfuncionarios solo como los nombran los registros de la FEC; las empresas y agencias se nombran como organizaciones. Los informes públicos de muertes de ICE, a los que enlaza esta página, nombran a la persona que murió; Estrella Polar no repite esos nombres en su propio texto. La excepción son las donaciones políticas: las personas que dieron más de $200 a un candidato o comité federal y indicaron como empleador a una empresa de detención o deportación aparecen con su nombre, tal como las publica la Comisión Federal de Elecciones, como registro histórico. Solo se muestran el nombre, el empleador y el puesto declarados, el estado, la cantidad, la fecha y el destinatario, nunca una dirección, y cada donación enlaza a su declaración. La ley federal prohíbe usar estos nombres para pedir dinero o con cualquier fin comercial; Estrella Polar no los usa para ninguna de las dos cosas."],
    ["Contenido externo", "Los documentos enlazados pertenecen a quienes los publican. Estrella Polar los enlaza en lugar de copiarlos y no responde por su contenido ni su disponibilidad."]],
  lgl_fix_h:"Correcciones", lgl_fix:"¿Encontró un error o un dato desactualizado? Díganos cuál y dónde, con una fuente si la tiene:", lgl_fix_none:"Al publicar la página aparecerá aquí una dirección de contacto para correcciones. Cada corrección se verificará con la fuente y quedará fechada en las notas de actualización de la pestaña Acerca de estos datos.",
  lgl_upd:d => `Esta página se actualizó por última vez el ${d}.`,
  rs_h:"Para investigadores, asistentes legales y periodistas", rs_lead:"Cómo se calculan las cifras de esta página, cómo citarlas y qué puede reutilizar.",
  rs_cite_h:"Cómo citar esta página", rs_cite_p:"Indique la fecha de los datos y enlace a la vista exacta que usó: cada pestaña y cada centro tienen su propia dirección en la barra del navegador. Para toda cifra importante, cite también la fuente original enlazada a su lado.",
  rs_cite:(pub, d, u) => `${pub}, Estrella Polar: datos sobre la detención migratoria (datos del ${d}). ${u}`, rs_cite_n:"La página se reconstruye cada vez que se actualizan sus fuentes, a menudo varias veces por semana, así que las cifras pueden cambiar; la fecha indica qué versión vio usted. Las notas de actualización en la pestaña Acerca de estos datos dicen qué cambió.",
  rs_how_h:"Cómo se calculan las cifras", rs_how:[
    "Solo conteos. Los registros por persona (estancias en detención, arrestos, solicitudes de retención) los leen programas automáticos que escriben totales; no se guarda ni se muestra ningún registro sobre una persona.",
    "Los años fiscales van de octubre a septiembre: el año fiscal 2026 es de octubre de 2025 a septiembre de 2026.",
    "El mes o año más reciente suele estar incompleto. Los gráficos lo dibujan más claro o punteado y lo dicen; compárelo con cuidado.",
    "Los registros que el Deportation Data Project marca como probables duplicados se quitan antes de contar.",
    "El dinero es lo que las agencias comprometieron (obligaron) en los datos de gasto federal, no lo que se pagó al final; el dinero recuperado se resta.",
    "Cuando un archivo posterior de una agencia muestra un periodo anterior como cero, se mantiene la cifra de su archivo anterior y la página lo dice.",
    "Cada fuente tiene un ritmo de actualización esperado. Cuando una se atrasa, la página la marca como desactualizada en lugar de ocultarlo. La lista de fuentes y sus fechas está en la pestaña Acerca de estos datos."],
  rs_dl_h:"Cómo obtener los datos", rs_dl_p:"Cada gráfico tiene una tabla \"Ver las cifras\" con un botón para descargarla como archivo de hoja de cálculo (CSV). Donde un visor bloquea las descargas, el botón muestra la tabla como texto para copiar. La fuente de cada cifra, con su fecha y enlace, está en Acerca de estos datos.",
  rs_cr_h:"Datos de otros proyectos", rs_cr_p:"La mayoría de las cifras vienen directamente de fuentes del gobierno, que son de dominio público. Algunas llegan a través de otros proyectos que reunieron u ordenaron registros públicos. Cada uno fija sus propias condiciones; esto es lo que permiten y cómo los reconoce esta página.",
  rs_cr:[["Deportation Data Project", "Registros de ICE obtenidos con la Ley de Libertad de Información. Publicados bajo CC0: libres de usar, sin condiciones.", "Reconocido en cada sección que los usa, con un enlace a deportationdata.org."],
    ["adsb.lol (posiciones de aeronaves)", "Licencia Open Database (ODbL): libre de usar con reconocimiento, y toda base de datos hecha a partir de ella debe compartirse con la misma licencia.", "Reconocido como \"© adsb.lol contributors, ODbL\". Los datos de vuelos que esta página construye con ella se comparten con la misma licencia."],
    ["Tracking 287(g) (appelson)", "Un archivo diario de las propias listas 287(g) de ICE. El código del archivo tiene licencia MIT; las listas son registros públicos de ICE.", "Reconocido en la pestaña Agencias estatales y locales que trabajan con ICE con un enlace al archivo."],
    ["TRAC, Universidad de Syracuse", "Informes publicados. Los conteos de hábeas son datos tomados de un informe público de TRAC.", "Citado por nombre con un enlace al informe junto a las cifras."],
    ["OurAirports, congress-legislators, HIFLD", "Dominio público.", "Reconocidos en la lista de fuentes."]],
  rs_lim_h:"Límites conocidos", rs_lim:[
    "ICE no ha publicado su archivo de estadísticas de detención con su frecuencia habitual de dos semanas; Alertas de los registros y El estado de los registros, en Acerca de estos datos, muestran cuánto tiempo ha pasado.",
    "Los registros de detención terminan en la entrega más reciente del Deportation Data Project, unos meses atrás.",
    "Los datos de gasto federal muestran a quién se pagó bajo un contrato, pero no cada pago: parte del gasto de ICE en contratos no tiene un beneficiario nombrado en los registros públicos.",
    "Los vuelos se siguen con las posiciones públicas de las aeronaves; un vuelo que apaga su transpondedor o sale de cobertura puede no aparecer."],
  lic_line:"Los registros del gobierno son de dominio público. Contenido del sitio © Polar Star Project, CC BY-NC-SA 4.0. Datos CC BY 4.0; datos de vuelos ODbL. Código PolyForm Noncommercial. Nombre y logotipo Polar Star™: todos los derechos reservados. Nunca comercial.",
  rs_use_h:"Qué puede reutilizar", rs_use:["Datos y cifras: siempre, citando la fuente. Los registros del gobierno son de dominio público.", "Los archivos de datos y cada tabla \"Ver las cifras\": cualquier uso, reconociendo a Polar Star Project (CC BY 4.0).", "Datos de vuelos: cualquier uso, reconociendo a los colaboradores de adsb.lol y a Polar Star Project; toda base de datos que construya con ellos debe compartirse con la misma licencia (ODbL).", "El texto, las explicaciones, los gráficos y el diseño de la página: uso no comercial, con reconocimiento, y versiones adaptadas con la misma licencia (CC BY-NC-SA 4.0).", "El código: uso no comercial, incluso por organizaciones benéficas, escuelas, investigadores y organismos públicos (PolyForm Noncommercial 1.0.0).", "Los nombres, el logotipo y el sello de Polar Star: no tienen licencia de reutilización. Puede mostrarlos sin modificar para referirse o enlazar a Polar Star, o en noticias e investigaciones sobre la página, pero no de un modo que sugiera que Polar Star Project hizo o respalda algo que no hizo."],
  tp_ar_h:"Arrestos, expulsiones y alternativas a la detención", tp_ar_lead:"Los registros del propio ICE: a quién arrestó y cómo, qué agencia hizo el arresto detrás de cada detención, cuántas personas expulsó y cuántas vigila fuera de la detención.", tp_ar_m:"Arrestos de ICE, por mes", tp_ar_all:"Todos los arrestos de ICE", tp_ar_comm:"En la comunidad", tp_ar_jail:"Desde cárceles y prisiones", tp_ar_287:"Mediante un acuerdo 287(g)", tp_ar_rest:"Todo lo demás", tp_ar_note:d => `Contado a partir de los registros de arrestos de ICE, obtenidos mediante la Ley de Libertad de Información y depurados por el Deportation Data Project (registros hasta el ${dateText(d)}). Se excluyen los probables duplicados (la misma persona en un mismo día). Estos conteos se acercan a los totales que anunció el DHS: unos 43,000 en junio de 2026 y más de 49,000 en julio.`, tp_ar_nc:"Proporción de arrestos de ICE de personas sin condena penal ni cargo pendiente, por mes", tp_ar_ncnote:"Según lo registra ICE al momento del arresto (su etiqueta: “otro infractor migratorio”). Las personas con un cargo pendiente pero sin condena no están en esta proporción.", tp_ar_how:"Cómo registró ICE cada arresto", tp_ar_lab:{"Non-Custodial Arrest":"En la comunidad (ICE: arresto sin custodia previa)", "Custodial Arrest":"Entregado desde la custodia de la policía o una cárcel (ICE: arresto en custodia)", "CAP Local Incarceration":"Desde una cárcel local (Programa de Extranjeros Criminales)", "CAP State Incarceration":"Desde una prisión estatal (Programa de Extranjeros Criminales)", "CAP Federal Incarceration":"Desde una prisión federal (Programa de Extranjeros Criminales)", "287(g) Program":"Mediante un acuerdo 287(g) con la policía local", "Located":"Localizado por ICE", "ERO Reprocessed Arrest":"Arresto reprocesado por ICE", "Other efforts":"Otros esfuerzos", "Other":"Otros métodos, cada uno con menos de 1% de los arrestos"}, tp_ar_ice:k => `Etiqueta de ICE: ${k}`, tp_t_ar:m => `arrestos de ICE en ${m}`, tp_bk_h:"Quién hizo el arresto detrás de cada nueva detención, por mes", tp_bk_ice:"Arrestados por ICE", tp_bk_cbp:"Arrestados por la CBP en la frontera", tp_bk_note:"De las estadísticas de detención de ICE: ingresos iniciales por agencia que arrestó. Hasta principios de 2025 la mayoría de quienes entraban a la detención de ICE habían sido arrestados por la CBP en la frontera; ahora casi todos son arrestados por ICE dentro del país.", tp_ag2_h:"Quién arrestó a las personas detenidas hoy", tp_ag2:(n, d, p, d0, p0) => `De las ${n} personas que ICE tenía detenidas el ${d}, ${p}% habían sido arrestadas por ICE y ${100 - p}% por la CBP.${p0 != null ? ` El ${d0}, ${p0}% habían sido arrestadas por la CBP.` : ""}`, tp_rm_h:"Expulsiones", tp_rm:(n, d, n0, d0) => `ICE reporta ${n} expulsiones en el año fiscal 2026 hasta el ${d}.${n0 ? ` Su informe del año fiscal 2025 contó ${n0} hasta el ${d0}.` : ""}`, tp_rm_note:"Las expulsiones son deportaciones con una orden. El año fiscal de ICE va de octubre a septiembre; no se incluyen los retornos ni las expulsiones sanitarias de la CBP.", tp_t_rm:d => `expulsiones de ICE en el año fiscal 2026, hasta el ${d}`, tp_rm_chg:(n, d) => `Año fiscal 2025: ${n} hasta el ${d}`, tp_pa_chg:(p, a, na, ka, b, nb, kb) => `Auditorías de ${a}: ${(na / ka).toFixed(1)} denuncias por auditoría (${na} en ${ka}), frente a ${(nb / kb).toFixed(1)} por auditoría (${nb} en ${kb}) en ${b}. Cada año se auditan centros distintos, así que no es una tendencia en ningún centro.`, tp_oc_chg:(p, a, b, y) => `${Math.abs(p)}% ${p > 0 ? "más" : "menos"} al mes que en el año fiscal ${y} (${a} al mes, frente a ${b})`, tp_rm_fy:d => { const x = new Date(d + "T12:00:00"); return "AF " + (x.getMonth() >= 9 ? x.getFullYear() + 1 : x.getFullYear()); }, tp_rm_day:"Expulsiones por día", tp_rm_dayh:"Expulsiones de ICE por día, por año fiscal", tp_rm_thru:d => `hasta el ${d}`, tp_rm_pct:(p, a, b) => `${Math.abs(p)}% ${p > 0 ? "más" : "menos"} por día que en el año fiscal 2025 (${a} al día, frente a ${b})`, tp_rm_daynote:x => `Se compara por día porque el informe de cada año termina en una fecha distinta: ${x}. De las estadísticas de detención de ICE.`, tp_atd_h:"Personas en alternativas a la detención", tp_atd:(n, d, per) => `${n} personas estaban inscritas el ${d}: controles por teléfono, grilletes electrónicos (brazaletes en el tobillo) y monitores de muñeca operados por BI Inc., una empresa de GEO Group.${per ? ` Solo la tecnología costó unos $${per} por persona al día; la gestión de casos y el resto del contrato cuestan más.` : ""}`, tp_atd_note:"De las estadísticas de detención de ICE, que toman estos conteos de los informes de participantes de BI Inc. Cada barra es el conteo del día de un informe.", tp_atd_t:{smartlink:"Controles por aplicación de teléfono (SmartLINK)", ankle_monitor:"Grillete electrónico (brazalete en el tobillo)", wristworn:"Monitor de muñeca", voiceid:"Controles por voz", gps:"Monitor GPS", dual_tech:"Dos tecnologías", dual_technology:"Dos tecnologías", no_tech:"Sin tecnología", no_technology:"Sin tecnología", veriwatch:"VeriWatch"}, tp_t_atd:d => `personas en alternativas a la detención (grilletes electrónicos, controles por teléfono) el ${d}`,
  sf_h:"Personal: quién recibe un sueldo por este trabajo", sf_lead:"Empleados federales de ICE y de las otras agencias que arrestan, detienen, juzgan y expulsan a personas, según los propios registros de personal del gobierno. Solo conteos; ningún nombre.", sf_ice:"Empleados de ICE", sf_ice_h:"Empleados de ICE, al final de cada mes", sf_ice_note:y => `De los registros de personal federal de la OPM (todas las personas en nómina el último día del mes). Septiembres anteriores: ${y}.`, sf_fl_h:"Personas que entraron y salieron de ICE, por mes", sf_hire:"Entraron", sf_left:"Salieron", sf_fl_note:"Contrataciones y traslados de entrada, y renuncias, jubilaciones, despidos y traslados de salida, según los registra la OPM.", sf_off_h:"Agentes y oficiales", sf_off:(a, b, c, m) => `En las dos series de puestos que cubren a los oficiales y agentes de ICE (1801 de control y 1811 de investigación penal), la OPM cuenta ${(a || 0).toLocaleString()} en enero de 2025, ${(b || 0).toLocaleString()} en enero de 2026 y ${c.toLocaleString()} en ${m}.`, sf_claim:(a, b) => `En enero de 2026 el DHS dijo que ICE había crecido a más de 22,000 oficiales y agentes, desde 10,000 al inicio del gobierno (según Government Executive). Los registros de la OPM ponen el punto de partida más alto, en ${a.toLocaleString()}, y el aumento hasta enero de 2026 en unos ${(Math.round((b - a) / 100) * 100).toLocaleString()}, no 12,000. La serie 1801 también incluye algunos puestos que no son oficiales de deportación.`, sf_all_h:m => `Personal en cada agencia, ${m}`, sf_ag:{ICE:"ICE", CBP:"CBP (Patrulla Fronteriza y puertos)", USCIS:"USCIS (servicios de ciudadanía e inmigración)", EOIR:"Cortes de inmigración (EOIR)", USMS:"Servicio de Alguaciles"}, sf_ser_h:m => `Puestos de ICE con más personas, ${m}`, sf_ser:{"1801":"Oficiales de control y cumplimiento (incluye oficiales de deportación) · 1801", "1811":"Investigadores penales (agentes especiales) · 1811", "0905":"Abogados · 0905", "0301":"Personal administrativo y de programas · 0301", "0343":"Analistas de gestión y programas · 0343", "1805":"Asistentes de investigación · 1805", "0318":"Secretarias · 0318", "2210":"Especialistas en informática · 2210", "0303":"Oficinistas y asistentes · 0303", "1802":"Apoyo de cumplimiento e inspección · 1802"}, sf_other:"Todos los demás puestos", tp_t_sf:m => `personas trabajando en ICE al final de ${m}`,
  oc_h:a => `Gasto de ${a}, por tipo`, oc_pay:"Su propio personal (sueldos y prestaciones)", oc_svc:"Contratos, servicios y suministros", oc_own:"Edificios, terrenos y equipo", oc_rest:"Subvenciones y otros", oc_part:(y, m) => `* Año fiscal ${y} hasta ${m === "June" ? "junio" : m === "March" ? "marzo" : m === "December" ? "diciembre" : m}: el último informe trimestral de la agencia.`, oc_gap:(a, b, c) => `En el año fiscal 2025 las cuentas de ICE muestran ${a} para contratos, servicios y suministros, mientras que los registros de contratos muestran ${b} comprometidos con contratistas. La diferencia, unos ${c}, no aparece desglosada por beneficiario en los registros públicos. Los pagos a otras agencias, como la Oficina de Prisiones, y a condados por espacio en cárceles se registran de esta forma.`, oc_note:"De los informes que ICE presenta al Tesoro cada trimestre (datos de cuentas de USAspending): dinero comprometido (obligado) en cada año fiscal desde las dos cuentas principales de ICE (Operaciones y Apoyo; Adquisiciones, Construcción y Mejoras), incluido el dinero de la ley de presupuesto de 2025. Las cuentas menores de ICE financiadas con tarifas (el programa de visas de estudiante, tarifas de usuario y fianzas perdidas, unos $0.2 a $0.4 mil millones al año) no informan por tipo, así que estos totales quedan algo por debajo de \"El dinero de ICE por año fiscal\", que cuenta todas las cuentas. El año más reciente llega solo hasta el último trimestre que ICE ha informado. Esto cuenta la nómina y todo lo demás; los registros de contratos solo muestran a quién se pagó mediante contratos.", oc_t:(y, m, a, b, c) => `comprometidos por ICE en el año fiscal ${y}${m ? ` hasta ${m === "June" ? "junio" : m === "March" ? "marzo" : m === "December" ? "diciembre" : m}` : ""}, desde sus dos cuentas principales: ${a} en su propio personal, ${b} en contratos y servicios, ${c} en edificios y equipo`,
  dk_t_last:(d, n) => `Último archivo publicado el ${d}. ICE ya se ha saltado unas ${n} actualizaciones quincenales.`,
  xl_state:"Cifras de un estado, lado a lado", xl_cd:"Muertes y denuncias por año y por quién opera cada centro, frente a cuántas personas detuvo cada uno, en Tendencias y patrones, en Daños y condiciones", xl_ovt:"Negaciones de entrada e inspecciones a lo largo del tiempo, y dónde ocurrieron, en Tendencias y patrones, en Daños y condiciones", xl_agt:"Acuerdos firmados a lo largo del tiempo y los que ya no figuran, al final de esta pestaña", xl_lobt:"Cabildeo y dinero político a lo largo del tiempo, en Tendencias y patrones", xl_wl:"Todos los centros de la lista de alertas, con quién los supervisa", xl_watch:"Centros cuyas muertes, denuncias o estancias largas están muy por encima de otros, en la lista de alertas", xl_src:"Cada fuente, primero las atrasadas, con su fecha y enlace, está en Acerca de estos datos", xl_gone:n => `Cada acuerdo que ya no está en la lista de ICE (${n}), estado por estado, está en Agencias estatales y locales que trabajan con ICE`, gone_lead:"Acuerdos que estuvieron en la lista publicada de 287(g) de ICE en algún momento desde el 19 de mayo de 2025 y ya no están, con la fecha de firma y la última lista en que aparecieron. ICE no da motivo ni fecha de fin; algunos pueden ser la misma agencia listada de nuevo con otro nombre.", xl_fl:"Los vuelos a lo largo del tiempo, los aeropuertos más activos y los países de destino, en Tendencias y patrones, en Control migratorio", xl_lim:"Límites conocidos de toda la página, para investigadores", xl_ocp:"Toque la cifra en los recuadros de Dinero, arriba, para ver el gráfico.", xl_oc:"El desglose completo, con categorías más detalladas, está en Siga el dinero", xl_hab:"Cuántas personas acuden a una corte federal para impugnar su detención (peticiones de hábeas)", xl_bond:"Dónde los jueces de inmigración conceden fianza con más y menos frecuencia", xl_mw:"Lo que paga cada agencia y programa, lado a lado, en Siga el dinero", xl_gov:"Los registros de cada agencia (CBP, HHS, FEMA, el Ejército y otras), en Agencias federales, programas estatales y otros países que trabajan con ICE", xl_cbpd:"Las muertes bajo custodia de la Patrulla Fronteriza y los puertos (CBP) están en la pestaña Agencias federales, programas estatales y otros países que trabajan con ICE", xl_stagr:"Cada centro operado por un estado, junto con los demás organismos estatales y locales en Agencias estatales y locales que trabajan con ICE", xl_stdet:"Detención operada por estados, en Agencias federales, programas estatales y otros países que trabajan con ICE", xl_ops:"Los centros de cada operador y lo que consta sobre ellos, en Tendencias y patrones, en Daños y condiciones", wt_h:"Cifras que destacan en los registros", wt_lead:"Se calcula a partir de los propios registros de esta página en cada actualización. Cada caso dice qué muestran los registros, dónde verificarlo y qué organismos lo supervisan. Solo hechos: nada aquí dice por qué ocurrió algo.", wt_t:n => n === 1 ? "punto abierto en la lista de alertas, con quién lo supervisa" : "puntos abiertos en la lista de alertas, con quién supervisa cada uno", wt_ice_t:"ICE no ha publicado las estadísticas de detención que se le exigen", wt_why:{deaths:"muertes", allegations:"denuncias de abuso sexual", long:"proporción de personas detenidas más de un año"}, wt_fac_t:(n, st, w) => `${n}, ${st}: ${w.length > 1 ? w.slice(0, -1).join(", ") + " y " + w[w.length - 1] : w[0]} muy por encima de otros centros`, wt_since:d => `En esta lista desde el ${d}.`, wt_ice:(D, last, ck) => [`El último archivo de estadísticas de detención de ICE tiene fecha del ${last}: ${D.days} días sin un archivo nuevo cuando se revisó la página de ICE el ${ck}.`, `El Congreso pidió este archivo cada dos semanas, así que faltan unas ${D.missed} actualizaciones.`, "El requisito se añadió en la ley de asignaciones del DHS del año fiscal 2020; la prensa ha señalado que se debate si sigue obligando a ICE."], wt_long_t:"Proporción de personas en detención de ICE por más de un año", wt_long:(D, d) => [`${D.n365.toLocaleString()} personas en detención de ICE el ${d} llevaban más de un año detenidas, y ${D.n180.toLocaleString()} más de seis meses (${D.p365}% y ${D.p180}% de las ${D.n.toLocaleString()} detenidas).`, "Las estancias largas suelen deberse a casos que siguen ante un juez o en apelación, lo que puede tardar más de un año. Los registros de ICE no dicen por qué una estancia en particular ha durado tanto, si se ha revisado ni si la persona tiene una orden final de expulsión.", D.ice365 != null ? `El archivo quincenal del propio ICE da una cifra menor, ${D.ice365.toLocaleString()} personas detenidas más de un año el ${dateText(D.ice_day)}. Esta cifra cuenta desde el inicio de cada estancia continua en detención de ICE, incluidos los traslados; el archivo de ICE no dice cómo mide, así que las dos no son directamente comparables.` : "", "Para las personas con una orden final de expulsión, la Corte Suprema fijó seis meses como el límite que se presume razonable cuando la expulsión no es razonablemente previsible (Zadvydas v. Davis, 2001). Los registros no pueden mostrar a cuántas de estas estancias se aplica; esa es la pregunta para los organismos de abajo."], wt_fac:(D, a, b, au, lo) => [D.dead != null ? `${D.dead} muertes informadas por ICE aquí de ${a} a ${b}: ${D.drate} por cada 10,000 personas detenidas durante un año, frente a ${D.dnat} en todos los centros de la lista de ICE en los mismos meses. Con la tasa general, una cifra tan alta saldría por azar unas ${Math.max(1, Math.round(100 * D.p))} veces de cada 100.` : "", D.alleg != null ? `La auditoría de ICE del ${au} contó ${D.alleg} denuncias de abuso sexual (denuncias presentadas, no hallazgos de que el abuso ocurrió): ${D.arate} por cada 1,000 personas detenidas durante un año, frente a ${D.anat} en los centros auditados. Con la tasa general, una cifra tan alta saldría por azar ${D.pa < 0.01 ? "menos de una vez" : "unas " + Math.round(100 * D.pa) + " veces"} de cada 100.` : "", D.n365 != null ? `$ a cámara", pol_law:{"P.L. 119-1":["Ley Laken Riley (S. 5), firmada el 29 de enero de 2025", "Obliga a ICE a detener a personas que no son ciudadanas y están acusadas, arrestadas o condenadas por robo, allanamiento, hurto en tiendas, agresión a un policía o un delito que mató o hirió gravemente a alguien, y permite a los estados demandar al gobierno federal por decisiones de aplicación de las leyes de inmigración. Fija reglas; no da dinero.", "Ley Laken Riley"], "P.L. 119-21":["La ley de presupuesto de julio de 2025 (H.R. 1), firmada el 4 de julio de 2025", "Dio $158.5 mil millones para la frontera y la aplicación de las leyes de inmigración hasta 2029, incluidos $45 mil millones para la detención de ICE. Siga el dinero tiene el detalle. Fue una ley presupuestaria amplia, sobre todo de impuestos, salud, energía y otros gastos, así que votar por ella no era solo votar sobre la aplicación de las leyes de inmigración.", "Ley de presupuesto de julio de 2025"], "P.L. 119-98":["Secure America Act (S. 2), firmada el 10 de junio de 2026", "Dio otros $46.6 mil millones para la aplicación de las leyes de inmigración hasta 2029: $31.1 mil millones para ICE (contratación, traslados, tecnología, instalaciones, acuerdos 287(g), personal jurídico), $13.0 mil millones para la Patrulla Fronteriza y $2.5 mil millones para el DHS.", "Secure America Act"]}, pol_rec:"Registro oficial", pol_house:"Cámara", pol_senate:"Senado", pol_ch_on:(c, d) => `${c}, ${d}`, pol_result:(y, n) => `${y} a favor, ${n} en contra.`, pol_party_line:(p, y, n) => `${p}: ${y} a favor, ${n} en contra`, pol_pty:{R:"Republicanos", D:"Demócratas", I:"Independientes"}, pol_money_h:"Dinero de comités de empresas de detención (GEO, CoreCivic, MTC)", pol_money_p:(n, tot, byp, cyc) => `${n} miembros recibieron ${tot} de los comités políticos de las tres empresas de detención (GEO, CoreCivic, MTC) en los ciclos electorales ${cyc}, para sus campañas o sus fondos de liderazgo: ${byp}.`, pol_money_c:"Léase con cuidado. Los votos sobre estas leyes se dividieron casi por completo según el partido, y este dinero fue sobre todo a un partido, así que comparar ambos muestra sobre todo el partido, no influencia. Aquí solo se cuenta el dinero de comités (PAC), de la Comisión Federal de Elecciones; el dinero de ejecutivos como individuos y el cabildeo están en Siga el dinero.", xl_polmoney:"El dinero de los comités por trimestre y destinatario, los donantes identificados y el cabildeo, en Dinero político y cabildeo, en Siga el dinero", xl_pol:"Los votos de cada miembro sobre las leyes de control migratorio, en Políticos", pol_find_h:"Buscar un miembro", pol_find_n:(a, c) => a === c ? String(a) : `${a} (${c} en funciones)`, pol_q:"Nombre o estado", pol_f_ch:"Cámara", pol_f_pa:"Partido", pol_f_st:"Estado", pol_f_pos:"Votos", pol_f_ex:"Además", pol_all:"Todos", pol_pos:{yes:"Votó a favor de todas las leyes en que votó", no:"Votó en contra de todas en que votó", mixed:"Votó en ambos sentidos"}, pol_ex_com:"Está en un comité que supervisa a ICE", pol_ex_money:"Recibió dinero de comités de empresas de detención (GEO, CoreCivic, MTC)", pol_ex_now:"En el Congreso ahora", pol_n_shown:n => `${n.toLocaleString()} ${n === 1 ? "miembro" : "miembros"}`, pol_who:(p, st, ch, d) => `${p.replace(/s$/, "")}, ${st} · ${ch}${d === "" || d == null ? "" : +d === 0 ? ", escaño único (at-large)" : ", distrito " + d}`, pol_y:"A favor", pol_n:"En contra", pol_p:"Presente", pol_x:"No votó", pol_novote:"No votó en estas leyes (no estaba en esa cámara entonces)", pol_com:c => `Comités que supervisan a ICE: ${c}`, pol_got:(t, c, l) => `Recibió ${t} de comités de empresas de detención (GEO, CoreCivic, MTC), ciclos 2024 y 2026 (${[c ? "campaña " + c : "", l ? "fondo de liderazgo " + l : ""].filter(Boolean).join(", ")}).`, pol_bio:"Biografía en el Congreso", pol_site:"Sitio oficial", pol_more:n => `Ver más (quedan ${n.toLocaleString()})`, pol_c_name:"Miembro", pol_c_party:"Partido", pol_c_state:"Estado", pol_c_ch:"Cámara", pol_ as que dijeron a la Comisión Federal de Elecciones que trabajan para una de estas empresas, en los ciclos electorales ${cyc}. Datos consultados en la FEC el ${read}.`, nd_c:["Cada donación es de registro público: el nombre, el empleador y el puesto del donante aparecen tal como el donante los dio en la declaración, y aquí no se verifican. Dos personas pueden tener el mismo nombre, y una persona puede aparecer escrita de dos formas.", "Un donante aparece con su nombre solo cuando sus donaciones a un comité pasan de $200 en un año (o en una elección, si es un candidato), así que quienes dan menos no están aquí.", "Las donaciones al comité político de la propia empresa aparecen en su propia línea: lo que ese comité da a candidatos ya se cuenta en la sección anterior, así que sumar las dos contaría el mismo dinero dos veces. Las donaciones hechas a través de WinRed o ActBlue se cuentan una sola vez.", "Donar a un candidato es legal. Una donación no es prueba de que se comprara o cambiara ningún voto.", "Algunos totales a un solo candidato superan el límite para una sola elección. Por lo general abarcan una primaria y una elección general, o incluyen donaciones que luego se pasaron a otro comité o se devolvieron. Cada donación enlaza al registro de la propia FEC (su búsqueda de ingresos), no a la declaración escaneada, que muestra la dirección del donante.", "Nunca se muestran direcciones. La ley federal (52 U.S.C. 30111(a)(4)) prohíbe usar estos nombres para pedir dinero o con cualquier fin comercial, y la FEC añade nombres inventados a las declaraciones para descubrir a quien lo haga."], nd_by_to:"Adónde fue el dinero", nd_and:" y ", nd_by_co:"Por empleador", nd_to:{O:"Al comité político de la propia empresa", R:"A candidatos y comités del Partido Republicano", D:"A candidatos y comités del Partido Demócrata", Q:"A otros comités (fondos de liderazgo, súper PAC y otros)", X:"A otros candidatos"}, nd_co:{GEO:"The GEO Group", CC:"CoreCivic", MTC:"Management & Training Corporation", LAS:"LaSalle Corrections", ICA:"Immigration Centers of America", CSI:"CSI Aviation"}, nd_list:"Todos los donantes identificados", nd_q:"Buscar un nombre, puesto, destinatario o miembro", nd_f_co:"Empleador", nd_shown:n => `${n.toLocaleString("es")} donante${n === 1 ? "" : "s"}`, nd_gifts:n => n === 1 ? "1 donación" : `${n} donaciones`, nd_each:"Cada donación", nd_to_c:"a", nd_rec:"registro en la FEC", nd_mem:n => `miembro del Congreso: ${n}`, nd_c_name:"Nombre declarado", nd_c_emp:"Empleador declarado", nd_c_job:"Puesto declarado", nd_c_st:"Estado", nd_c_co:"Empresa", nd_c_date:"Fecha", nd_c_usd:"Dólares", nd_c_to:"Comité destinatario", nd_c_party:"Partido", nd_c_mem:"Miembro del Congreso", nd_c_url:"Registro en la FEC (búsqueda de ingresos)", nd_fec:"Donaciones individuales en la FEC", nd_src:"Fuente: donaciones individuales detalladas (Anexo A) presentadas ante la Comisión Federal de Elecciones, en las que el donante nombró a uno de estos empleadores. Se dejan fuera las empresas grandes en las que el trabajo para ICE es una parte pequeña de lo que hace su personal (Amentum, Akima, Ahtna).", xl_dn:"Donantes identificados que trabajan para estas empresas", pol_staff:(u, n) => `Contribuciones de personas que declararon como empleador una empresa de detención o deportación (dato que da el propio donante a la FEC): ${u} de ${n} donante${n === 1 ? "" : "s"} identificado${n === 1 ? "" : "s"}.`, pol_staff_p:(n, u) => `Aparte, los comités de ${n} miembros recibieron ${u} de personas que dijeron trabajar para estas empresas. Cada donante aparece con su nombre y su declaración en Siga el dinero.`, pol_c_staff:"Donaciones del personal de las empresas (dólares)", nd_small:(n, u) => `Se cuenta cada donación detallada, por pequeña que sea: ${n} de estas donaciones fueron de menos de $200 y suman ${u}. Las donaciones pequeñas repetidas muchas veces se suman al total de cada donante y de cada destinatario.`, nd_rec_line:(n, u) => `${n.toLocaleString()} ${n === 1 ? "dona ara apoyarlo", pc_top_o:"Gasto externo para oponerse", pc_top_none:"Nada declarado en este ciclo.", pc_top_tie:(n, u) => `Además: otros ${n} comités dieron exactamente ${u}, lo mismo que la cantidad más pequeña de arriba. No se enumeran uno por uno, para no elegir a ninguno por encima de los demás; el registro en la FEC del comité del miembro los incluye a todos.`, pc_top_fec:"Registro en la FEC", pc_top_n:n => `${n.toLocaleString()} ${n === 1 ? "gasto" : "gastos"}`, pc_top_note:"Los nombres de los comités son los declarados. No se incluyen las donaciones de comités de partido ni las transferencias de comités de recaudación conjunta; el gasto externo es dinero que un grupo gastó por su cuenta, no dinero dado al miembro. Aparecer en esta lista solo dice que un grupo donó o gastó; no dice nada sobre las opiniones ni los votos del miembro.", off_to_h:"Dónde se pueden plantear preguntas sobre la conducta de un miembro", pol_ex_flag:"Coinciden puestos en comités, dinero de contratistas y centros", pc_flag:"Este miembro cumple la regla de coincidencias (puestos en comités, dinero de contratistas y centros) que se muestra en Políticos.", pc_flag_go:"Ver la regla y la lista", fam_7h:"7. Comuníquese con el consulado de la persona", fam_7p:"El país de la persona tiene consulados en EE. UU. que pueden encontrar a sus ciudadanos bajo custodia de ICE, visitarlos, ayudar con documentos y dar seguimiento al caso, tenga o no abogado. Dé al consulado el nombre completo de la persona, su fecha de nacimiento, su número A si lo tiene y el centro del paso 2.", fam_7mx:"Para ciudadanos mexicanos, la línea de ayuda del gobierno de México, las 24 horas (CIAM):", fam_7n:"La embajada de cada país en Washington, D.C. enumera sus consulados en su sitio web. Un consulado no puede lograr que liberen a alguien, pero puede revisar cómo lo tratan y ayudar con los documentos de viaje.", fam_7ca:"Para otros países:", fam_cons:{consular:"Los consulados de cada país en EE. UU. (lista del Departamento de Estado, en inglés)", gt:"Guatemala: Ministerio de Relaciones Exteriores (consulados y ayuda a ciudadanos)", hn:"Honduras: Secretaría de Relaciones Exteriores (consulados y ayuda a ciudadanos)", sv:"El Salvador: Ministerio de Relaciones Exteriores (consulados y ayuda a ciudadanos)"}, fam_8h:"8. Si la persona tal vez ya fue deportada", fam_8p:"El localizador de ICE deja de mostrar a una persona cuando la sacan del país. La línea de la corte de inmigración del paso 3 dice si un juez ordenó la deportación. El consulado del paso 7 suele recibir aviso cuando deportan a uno de sus ciudadanos y puede decir cuándo y dónde llegó.", fam_8n:"Los vuelos de deportación a muchos países salen de unos pocos aeropuertos; la pestaña de vuelos los muestra, pero ningún registro público dice quién iba en un vuelo.", fam_8l:["Pregunte al consulado (paso 7) si su país recibe los vuelos de deportación y dónde puede recibir ayuda la persona al llegar.", "Pertenencias y dinero que la persona tenía en detención: pregunte al centro donde estuvo (paso 2) cómo recuperarlos.", "Las apelaciones y las solicitudes para reabrir un caso tienen plazos estrictos, algunos de solo 30 días. Hable con un abogado (paso 4) lo antes posible."], tab_state:"Su estado", sv_lead:"Elija un estado para ver quién lo representa en el Congreso, cada uno con su ficha, y todas las cifras que esta página tiene sobre el estado, lado a lado: centros, acuerdos con ICE, inspecciones, negaciones de entrada y más.", sv_score:s => `${s}: ficha`, sv_reps:s => `${s}: miembros del Congreso`, sv_mem_h:"Quién representa a este estado", sv_pick:"Estado:", sv_choose:"Elija un estado", cv_co:"Empresa", cv_award:"Contrato", cv_what:"Para qué es", cv_usd:"Dólares", cv_musd:"Millones de dólares comprometidos", cv_from:"Inicio", cv_to:"Fin", cv_comp:"Cómo se adjudicó (C con competencia, N sin competencia, L orden sin oportunidad justa)", cv_offers:"Ofertas recibidas", cv_reason:"Motivo registrado", cv_link:"Enlace", cv_date:"Fecha", cv_place:"Lugar", cv_who:"A quién se le negó", cv_kind:"Tipo de funcionario", cv_body:"Organismo", cv_code:"Código del centro", cv_fac:"Centro", cv_title:"Informe", cv_def:"Deficiencias citadas", sec_cite:(pub, ti, d, u) => `${pub}, Estrella Polar: “${ti}” (datos del ${d}). ${u}`, pol_pty1:{R:"Partido Republicano", D:"Partido Demócrata", I:"Independiente"}, nw_h:"Cobertura de noticias", nw_lead:"Noticias sobre ICE y la inmigración de muchos medios, reunidas por Ground News, que muestra cómo cubren cada noticia medios de todo el espectro político. Los enlaces abren Ground News; esta página no elige las noticias.", nw_ice:"Servicio de Inmigración y Control de Aduanas (ICE)", nw_us:"Inmigración en EE. UU.", nw_dhs:"Departamento de Seguridad Nacional", nw_note:"Ground News es un sitio independiente que se sostiene con suscripciones. Sus etiquetas de izquierda, centro y derecha son calificaciones propias, basadas en grupos externos que califican medios, no de esta página. Las páginas de temas se abren sin cuenta; algunas funciones piden registrarse.", so_h:"Organizaciones que comparten noticias y novedades", so_lead:"Organizaciones, medios de noticias y agencias del gobierno que publican sobre ICE, la detención y la inmigración en Bluesky o Instagram, cuando sus cuentas pasan la revisión semanal. Los grupos de un estado en particular aparecen en Su estado.", so_warn:"Estas cuentas son para noticias y novedades, no para ayuda legal. Para un abogado, use el paso 4 en Para familias. Nunca le pague a alguien que encontró en internet para encontrar a una persona o lograr que la liberen.", fo_lead:"Organizaciones sin fines de lucro, clínicas legales y agencias públicas que ayudan a las personas detenidas por ICE y a sus familias: ayuda legal gratuita, ayuda para niños, mujeres y personas LGBTQ, fondos de fianza, visitas, grupos religiosos y servicios para inmigrantes. Elija el tipo de ayuda que necesita y su estado.", fo_warn:"Aparecer aquí no es un respaldo. La ayuda verdadera es gratuita: nunca le pague a alguien que encontró en internet para encontrar a una persona o lograr que la liberen. Llame antes de ir.", fo_kind:"Tipo de ayuda", fo_who:"Para quién es", fo_what:"Qué hace", fo_t:{kids:"Niños", women:"Mujeres", lgbtq:"Personas LGBTQ", legal:"Ayuda legal gratuita", bond:"Fondos de fianza", visitation:"Visitas", services:"Servicios para inmigrantes", faith:"Grupos religiosos", community:"Grupos comunitarios", advocacy:"Defensa de derechos", research:"Investigación", news:"Noticias"}, fo_st:"Estado", fo_st_any:"Cualquier estado", fo_n:(n, st) => `${n} organizaciones${st ? ` que trabajan en ${st} o en todo el país` : ""}`, fo_and:"Si elige más de un tipo, la lista muestra las organizaciones que ofrecen todos.", fo_none:"Ninguna ofrece aquí todos los tipos que eligió. Quite uno para ver más.", fo_natl:"En todo el país", fo_offices:s => `En todo el país; trabajo local en ${s}`, fo_in:s => `Trabaja en ${s}`, fo_web:"Sitio web", fo_meta:(d, n) => `Sitios web, teléfonos y registros del IRS revisados el ${d}. ${n} organizaciones.`, fo_how_h:"Cómo se eligen las organizaciones", fo_how:"Una organización aparece solo si es una agencia del gobierno, una organización sin fines de lucro registrada ante el IRS (o un proyecto de una), una clínica universitaria o una institución religiosa; ayudar a inmigrantes o a personas detenidas es central en su trabajo; no vende nada y nunca cobra por encontrar o liberar a nadie; no recauda dinero para casos individuales en su ficha; y no publica datos personales de agentes ni de personas detenidas. Cada semana la página revisa que su sitio web siga funcionando y siga siendo suyo, que sus teléfonos sigan en su sitio y que exista su registro del IRS. Una organización que no pasa la revisión se oculta hasta que vuelva a pasarla.", fo_st_h:s => `Organizaciones que ayudan a las familias en ${s}`, fo_st_go:"Ver también las organizaciones nacionales", so_warn_s:"Para noticias y novedades, no para ayuda legal. Nunca le pague a alguien que encontró en internet para encontrar a una persona o lograr que la liberen.", so_in:s => `Trabaja en ${s}`, so_natl:"Trabaja en todo el país", so_based:x => `con sede en ${x}`, so_st_h:"Organizaciones de este estado que comparten noticias y novedades", so_how_h:"Cómo se eligen las organizaciones", so_how:"Una cuenta aparece solo si pertenece a una agencia del gobierno, una organización sin fines de lucro registrada ante el IRS, un medio de noticias, una universidad o una institución religiosa; el sitio web de la propia organización la enlaza; la inmigración o la detención es central en su trabajo; y no vende servicios, no cobra por encontrar o liberar a alguien, no recauda dinero para casos individuales ni publica datos personales de agentes o de personas detenidas. Cada semana se revisan automáticamente el enlace del sitio web, el registro del IRS y, en Bluesky, que haya una publicación en los últimos 90 días; la cuenta que no pasa se quita. Instagram no permite revisar la actividad sin iniciar sesión, así que la actividad en Instagram no se revisa. La página cubre solo Bluesky e Instagram. Aparecer en la lista no es un respaldo.", so_meta:(d, n) => `Revisado el ${d}. ${n} organizaciones en total, incluidas las de cada estado.`, so_kind:{government:"Agencia del gobierno", news:"Medio de noticias", advocacy:"Organización de defensa", community:"Organización comunitaria", research:"Instituto de investigación", service:"Servicios para refugiados e inmigrantes"}, so_bi:"Inglés y español", so_es:"Español", rb_line:(n, ti, of) => `Dirigido por ${ti} ${n}, ${of}.`, rb_src:d => `Página oficial, revisada el ${d}`, ag_moa:"Acuerdo firmado (PDF; copia archivada de la página 287(g) de ICE)", go_fail:d => `no confirmado en el sitio oficial esta semana (la revisión falló el ${d})`, go_h:"Gobernadores", go_lead:"El gobernador de cada estado y, junto a cada uno, lo que muestran los registros de esta página para ese estado. Los gobernadores dirigen las agencias estatales, incluidas las que firman sus propios acuerdos con ICE; los acuerdos de condados y ciudades los firman esas agencias locales.", go_since:d => `en el cargo desde ${d}`, go_287:n => `${n.toLocaleString()} ${n === 1 ? "acuerdo" : "acuerdos"} 287(g) en el estado.`, go_ban:"La ley estatal prohíbe estos acuerdos.", go_stag:(n, x) => `${n} firmados por agencias estatales: ${x}.`, go_sites:x => `Centros de detención operados por el estado: ${x}.`, go_fac:n => `${n} ${n === 1 ? "centro" : "centros"} de detención de ICE en el estado en esta página.`, go_site:"Sitio oficial del gobernador", go_more:n => `, y ${n} más`, go_note:d => `Los nombres y el partido vienen de Wikidata o, cuando Wikidata no es claro, de una lista mantenida a mano, y se revisan cada semana con el sitio web oficial del gobernador (última revisión: ${d}). Si ese sitio no respondió o no nombra al gobernador, el nombre se muestra igual, marcado. Las agencias estatales son las que llevan el nombre del estado en la lista de ICE. El dinero político de las campañas estatales se reporta a cada estado, no a la FEC, y no se muestra aquí.`, lo_cov:(n, m) => `Se muestran ${n} de las ${m} cárceles registradas: las demás no tienen una página oficial que nombre a la persona a cargo, o no se pudo revisar la página.`, lo_h:"Alguaciles (sheriffs) y jefes de cárceles que detienen personas para ICE", lo_lead:"Cárceles locales que detienen personas para ICE bajo un acuerdo, y el funcionario que dirige cada una, por lo general el alguacil elegido.", lo_note:"Cada nombre aparece solo mientras el sitio web del condado o de la oficina nombra a esa persona; la revisión es semanal, y una oficina que cambia de titular sale de la lista hasta que se actualiza su sitio. Las cárceles sin página oficial para revisar no aparecen. Las agencias que firmaron acuerdos 287(g) enlazan su acuerdo firmado en Agencias estatales y locales que trabajan con ICE.", rv_h:"Exfuncionarios del gobierno que cabildean para empresas de detención", rv_lead:"Cabilderos que trabajan para GEO Group, CoreCivic, Management & Training Corp. y CSI Aviation y que declararon un cargo público anterior en sus reportes federales de cabildeo.", rv_was:cp => `Cargo anterior, como se declaró: ${cp}`, rv_for:(co, firm, y) => `Cabildeó para ${co} a través de ${firm}, ${y}`, rv_note:"De los reportes de la Ley de Divulgación de Cabildeo (lda.gov). La ley federal exige que cada cabildero declare cualquier cargo ejecutivo o del Congreso cubierto que haya tenido en los últimos 20 años; la redacción es del propio cabildero.", ag_cty:k => /\b(County|Parish|Borough|Municipality|Census Area|City)$/.test(k) ? k.replace(/ County$/, "").replace(/^(.*) Parish$/, "Parroquia de $1") : "Condado de " + k, pol_vp:"El vicepresidente desempató a favor.", cy_held:n => `${n} ${n === 1 ? "cantidad queda fuera" : "cantidades quedan fuera"} hasta revisarse: cada una figura como contribución de los fondos propios del comité, pero supera los $10,000 que un PAC puede dar a un candidato para una primaria y una elección general. Puede ser legal si el miembro también compitió en una elección especial o una segunda vuelta, o puede ser dinero de donantes registrado con el código equivocado.`, cy_h:"PAC enfocados en la política de EE. UU. hacia un país específico", cy_lead:"Comités de acción política y super PAC cuyo nombre registrado nombra un país extranjero (o a su pueblo, como lo hace un grupo de política exterior), más cualquier comité cuyo propio registro ante la FEC nombre a uno de ellos como afiliado, y lo que cada uno dio o gastó en miembros actuales del Congreso. La misma regla se aplica a todos los países. Un PAC cuyo nombre no nombra un país no aparece con esta regla, sea cual sea el país en que se enfoca.", cy_by_name:"Aparece porque su nombre registrado nombra el país", cy_by_aff:x => `Aparece como afiliado de ${x}`, cy_gave:(u, n, p) => `Dio ${u} de sus propios fondos a ${n} ${n === 1 ? "miembro actual" : "miembros actuales"}${p ? " (" + p + ")" : ""}.`, cy_sup:u => `Gastó ${u} para apoyar a miembros actuales.`, cy_opp:u => `Gastó ${u} para oponerse a miembros actuales.`, cy_who:"Miembros", cy_m_g:u => `dio ${u} de sus propios fondos`, cy_m_e:u => `transmitió ${u} de donantes individuales`, cy_fwd:(u, n, p) => `Transmitió ${u} de donantes individuales a ${n} ${n === 1 ? "miembro actual" : "miembros actuales"}${p ? " (" + p + ")" : ""}: los donantes dieron al comité e indicaron el miembro; el comité pasó el dinero. Es dinero de los propios donantes, contado aparte de lo que dio el comité.`, cy_m_s:u => `gastó ${u} a favor`, cy_m_o:u => `gastó ${u} en contra`, cy_src:"Registro público de la afiliación", cy_note:(c, d) => `De los propios reportes de cada comité ante la FEC del ciclo ${c}, leídos el ${d}. Se mantienen aparte, sin sumarse, tres tipos de dinero: contribuciones de los fondos del propio comité a los comités de campaña de los miembros; dinero de donantes que el comité transmitió como intermediario (contribuciones destinadas); y gasto independiente a favor o en contra de los miembros. Los nombres formados solo con "American" (por ejemplo "Irish American") describen una comunidad de EE. UU. y no se incluyen. Un PAC de EE. UU. debe financiarse con ciudadanos o residentes permanentes de EE. UU.: los extranjeros no pueden donar a campañas de EE. UU.`, cy_pc_h:"PAC enfocados en la política de EE. UU. hacia un país específico", cy_pc_p:"Comités de la lista en Políticos que dieron o gastaron en este miembro en este ciclo.", opm_h:"Otro dinero político", xl_opm:"PAC enfocados en un país y agentes extranjeros registrados, en Otro dinero político (en Dinero y patrones)", opm_lead:"Dos registros públicos, separados de los registros de ICE de las otras pestañas: comités de acción política de EE. UU. enfocados en la política de EE. UU. hacia un país (financiados, por ley, por ciudadanos y residentes permanentes de EE. UU.), y personas y firmas registradas como agentes de un gobierno o partido extranjero. Los mismos miembros del Congreso votan sobre la aplicación de la ley migratoria y su financiamiento, así que estos registros están aquí para quien quiera ver completo quién los financia y cabildea. Cuando la firma de un agente extranjero registrado también cabildea para una empresa de detención, se indica; nada más aquí vincula a estos grupos con la detención.", fg_h:"Agentes extranjeros registrados", fg_lead:"Personas y empresas registradas ante el Departamento de Justicia bajo la Ley de Registro de Agentes Extranjeros (FARA) para representar en EE. UU. a un gobierno, partido u otro mandante extranjero.", fg_sum:(r, p, c) => `${r.toLocaleString()} registrados que trabajan para ${p.toLocaleString()} mandantes extranjeros de ${c} países y territorios.`, fg_pick:"País", fg_choose:"Elija un país", fg_rem_n:n => `${n.toLocaleString()} deportados por ICE`, fg_rem:(n, span) => `ICE deportó a ${n.toLocaleString()} personas a este país (${span}).`, fg_by:(rg, n) => `Agente registrado: ${rg} (FARA n.º ${n})`, fg_both:"Este registrado también cabildea para una empresa de detención (vea Dinero político y cabildeo).", fg_since:d => `mandante desde ${d}`, fg_doc:"Reporte que describe el trabajo (Anexo A/B)", fg_note:d => `De los registros FARA eFile del Departamento de Justicia, leídos el ${d}. "Agente extranjero" es una condición legal de registro que declara el propio registrado, no una conclusión de que haya actuado mal. Los registrados también reportan contribuciones políticas, pero solo en documentos escaneados, que aquí no se leen. Los países aparecen en orden alfabético.`, tab_orgs:"Organizaciones que ayudan a las familias", tab_news:"Cobertura de noticias", tab_disp:"Disputas de ICE con gobiernos estatales y locales", dp_lead:"Disputas formales en el registro público entre ICE (o el Departamento de Seguridad Nacional o el Departamento de Justicia cuando actúan en el control migratorio) y un gobierno estatal, de condado, de ciudad o tribal, o una de sus agencias o funcionarios: demandas presentadas por cualquiera de las partes, órdenes firmadas, cartas formales y citaciones, y cargos e investigaciones penales que involucran a funcionarios o agentes de cualquiera de las partes. Cada caso enlaza su propia fuente. Se indica quién inició cada uno; nada aquí dice quién tiene la razón.", dp_kind:{lawsuit:"Demanda", law:"Ley estatal o local, y la respuesta federal", order:"Orden firmada, carta formal o citación", charge:"Cargo penal", investigation:"Investigación penal"}, dp_natl:"Todo el país", dp_kn:{lawsuit:n => `${n} ${n === 1 ? "demanda" : "demandas"}`, law:n => `${n} ${n === 1 ? "ley" : "leyes"} con respuesta federal`, order:n => `${n} ${n === 1 ? "orden o carta" : "órdenes y cartas"}`, charge:n => `${n} ${n === 1 ? "cargo penal" : "cargos penales"}`, investigation:n => `${n} ${n === 1 ? "investigación penal" : "investigaciones penales"}`}, dp_by:{federal:"Iniciada por la parte federal", state_local:"Iniciada por la parte estatal o local"}, dp_sum:(n, parts, f, l, last) => `${n} disputas registradas: ${parts.join(", ")}. ${f} iniciadas por la parte federal y ${l} por la parte estatal o local. La más reciente: ${last}.`, dp_f_st:"Estado", dp_f_kind:"Tipo", dp_all:"Todos", dp_shown:n => `${n} en pantalla`, dp_status:(d, s) => `Lo último registrado (${d}): ${s}`, dp_stsrc:"fuente de este paso", dp_src:"Fuente", dp_gov:n => `Gobierna hoy: ${n}`, dp_key_i:"Las etiquetas sólidas son el registro propio de la persona. Las etiquetas punteadas son vínculos indirectos, a través de un fondo de recaudación conjunta, una firma de cabildeo con muchos clientes o alguien que trabajó para ella; dicen menos sobre la persona.", dp_stale:(d, n) => `El último paso encontrado es del ${d}, ${n} días antes de esta actualización; el caso puede haber avanzado desde entonces.`, dp_fac:n => `Aparece en ${n} ${n === 1 ? "disputa" : "disputas"} entre ICE y gobiernos estatales o locales.`, dp_fac_go:"Verlas", dp_sv:(n, s) => `${n} ${n === 1 ? "disputa" : "disputas"} entre ICE y ${s} o sus gobiernos locales`, dp_sv_go:"Abrir la lista", dp_pc_mine:n => `Aparece en ${n} ${n === 1 ? "disputa" : "disputas"}, o redactó la ley en el centro de ellas:`, dp_sk:{copy:"(copia del registro, alojada en otro sitio)", news:"(nota de prensa)"}, dp_dock:"Expediente judicial", dp_newer:d => `El expediente judicial tiene escritos posteriores a este paso (el más reciente: ${d}); abra el expediente para verlos.`, dp_key_h:"Cómo leer a las personas de esta pestaña", dp_key_p:"Cada miembro del Congreso se marca según cómo votó las tres leyes federales de control migratorio de arriba, y cada persona se cruza con el resto de esta página. Una marca significa que los propios registros de esta página muestran ese vínculo; tóquela para ver el detalle.", dp_v:{for:(y, n) => `votó a favor ${y} de ${y + n}`, ag:(y, n) => `votó en contra ${n} de ${y + n}`, mix:(y, n) => `dividido: ${y} a favor, ${n} en contra`}, dp_vk:{for:"Votó a favor de todas las leyes de control migratorio en que votó", ag:"Votó en contra de todas en que votó", mix:"Votó en ambos sentidos"}, dp_tn:{dm:"$ detención", jf:"fondo conjunto", lf:"$ firma de cabildeo", fs:"exempleado cabildea", ov:"coincidencias", re:"entrada negada", vi:"visita de supervisión"}, dp_tk:{dm:"Recibió dinero de comités de empresas de detención o de personas que trabajan para ellas (Políticos, Siga el dinero)", jf:"Participa en un fondo de recaudación conjunta que recibió dinero de comités de empresas de detención; no se puede saber qué parte le llegó", lf:"Una firma de cabildeo contratada por una empresa de detención o de vuelos de ICE, o sus cabilderos, le donó o le rindió homenaje (perfiles de firmas de cabildeo)", fs:"Alguien que trabajó para esta persona ahora cabildea en una firma contratada por una empresa de detención o de vuelos de ICE (no se cuentan pasantes)", ov:"Cumple la regla de coincidencias de Políticos: puestos en comités, dinero de contratistas y centros", re:"Se le negó la entrada a un centro de ICE (Visitas oficiales e inspecciones)", vi:"Hizo una visita de supervisión a un centro de ICE y publicó una declaración"}, dp_tt:{dm:(p, s) => `Dinero de comités de empresas de detención: ${p}; donaciones del personal de las empresas: ${s}.`, jf:x => `Fondos de recaudación conjunta que recibieron dinero de comités de empresas de detención: ${x}.`, lf:x => `Firmas de cabildeo contratadas por empresas de detención o de vuelos de ICE cuyo dinero político le llegó: ${x}.`, fs:x => `Exempleados que ahora cabildean en: ${x}.`, ov:"Cumple la regla de coincidencias de Políticos.", re:x => `Entrada negada: ${x}.`, vi:n => `${n} ${n === 1 ? "visita publicada" : "visitas publicadas"} de supervisión.`}, dp_key_n:"Las personas sin voto registrado (gobernadores, alcaldes, legisladores estatales) no se marcan a favor ni en contra: esta página no tiene ningún voto suyo sobre estas leyes. Los nombres se cruzan por nombre y apellido, así que dos personas con el mismo nombre podrían confundirse; el detalle de cada marca dice de dónde viene. Una marca es un registro, no una conclusión de que alguien actuó mal. Las marcas de dinero vienen de lo que esta página sigue: el dinero de empresas de detención y contratistas de ICE y de las firmas de cabildeo que esas empresas contratan. El dinero de grupos con otras posturas sobre la política migratoria no se sigue aquí, así que su ausencia no dice nada.", dp_law:"Ley u orden en disputa:", dp_by_w:"redactada por", dp_com:s => `Miembros por ${s} en los comités que redactan la ley migratoria (Judicial, Seguridad Nacional):`, dp_fed_h:"Las leyes federales de control migratorio y quién las propuso", dp_fed_p:"La mayor parte de los poderes de ICE vienen de la Ley de Inmigración y Nacionalidad y sus enmiendas. Estas son las leyes aprobadas desde 2025 que amplían la detención o financian el control migratorio, las mismas cuyos votos están en Políticos.", dp_spon:"Propuesta por:", dp_gov_then:n => `Gobernaba entonces: ${n}`, dp_reps:s => `Miembros del Congreso por ${s}`, sv_gov:n => `Gobierna: ${n}`, dp_dead:d => `(este enlace no cargó en la revisión del ${d})`, xl_dp_ref:"Los funcionarios estatales y locales a quienes se negó la entrada a centros de ICE aparecen con las demás negaciones en Supervisión", dp_how:"Se incluye un caso cuando dos gobiernos están en lados opuestos y uno de ellos dio un paso formal en el registro público: presentó una demanda, firmó una orden o envió una carta formal, emitió una citación, promulgó una ley que la otra parte respondió formalmente, o presentó un cargo penal o abrió una investigación penal. ICE está en un lado de cada caso, o el DHS o el Departamento de Justicia cuando actúan en el control migratorio. Cada caso se basa en el registro mismo: la demanda o el expediente judicial, el texto firmado o el comunicado del propio organismo. Cuando el registro solo se encontró como copia alojada en otro sitio, o un paso posterior solo en una nota de prensa, el enlace lo indica. No se incluyen protestas, discursos ni disputas solo entre personas o grupos privados. No se nombra a agentes federales por debajo de los cargos de designación política, ni a empleados locales que no sean funcionarios electos o designados.", dp_note:"Reunido a mano a partir de registros públicos desde enero de 2025, así que la lista no está completa. Cada estado del caso es el último paso encontrado, con su fecha; un caso puede haber avanzado desde entonces. Cada enlace a una fuente se revisa cada semana.", xl_orgs:"Organizaciones, medios y agencias que publican sobre ICE y la inmigración en Bluesky e Instagram", xl_news:"Noticias sobre ICE y la inmigración de medios de todo el espectro político, a través de Ground News", xl_orgs_st:"Grupos de un estado, en Su estado", tab_ven:"Otros contratistas de ICE", vn_lead:"Empresas a las que ICE paga por algo distinto de operar centros de detención: tecnología y datos, vuelos, equipo, consultores y personal, atención médica, construcción. Cada empresa aparece según lo que pagó la mayor parte de su dinero de ICE, así que todo su total queda en un grupo; la pestaña de Dinero clasifica cada contrato por su propio código federal de producto, así que los dos desgloses difieren. Los operadores de centros de detención están en Empresas que trabajan con ICE.", vn_caution:"Un contrato muestra lo que ICE compró, no lo que la empresa piensa sobre la inmigración. El cabildeo muestra en qué dijo trabajar una empresa ante el Congreso o las agencias, no cómo votó ni qué pidió.",

  vn_note:(a, b, r, lr, ly) => `Contratos de ICE de $1 millón o más con actividad del ${a} al ${b}, leídos de USAspending.gov el ${r}; las cantidades son lo que ICE comprometió dentro de ese periodo. Las empresas matrices son las que registra USAspending. ${lr ? `El cabildeo viene de los reportes de la Ley de Divulgación de Cabildeo del Senado desde ${ly}, leídos el ${lr}, para contratistas con $10 millones o más, emparejados por el nombre del cliente en cada reporte. La cifra suma los reportes propios de la empresa y lo que las firmas externas declaran haber cobrado, que pueden coincidir, así que es una cifra máxima.` : "El cabildeo de estas empresas aún no se ha leído."}`,

  ag_names:(s, c) => `Quién firmó: ${s.toLocaleString()} acuerdos muestran el nombre de quien firmó por la agencia y ${c.toLocaleString()} más muestran el contacto de la agencia que indica el acuerdo. Los nombres se leen de los PDF escaneados de ICE y solo se muestran cuando se leen con claridad: un nombre en la línea de firma, un cargo local y el mismo apellido una segunda vez en el acuerdo. Las firmas a mano o borrosas quedan en blanco; el enlace al PDF muestra el original.`,
  jf_h:"Adónde enviaron el dinero los comités de recaudación conjunta",
  jf_p:(n, co, rc, pc, sent, rcp, cyc) => `${n} comités de recaudación conjunta recibieron ${co} de los comités de las empresas de detención en ${cyc}. En total recaudaron ${rc} de todos sus donantes, así que el dinero de las empresas fue el ${pc}% de lo que recibieron. Transfirieron ${sent} a ${rcp} comités políticos: las campañas, comités de partido y PAC que participan en ellos.`,
  jf_est:e => `Cuando el dinero llega a un comité de recaudación conjunta se mezcla, así que ningún dólar puede rastrearse desde una empresa hasta su destino final. Como estimación, si cada comité repartió el dinero de las empresas igual que todo lo demás, unos ${e} llegaron a los comités de abajo. Cada «parte estimada de las empresas» usa esa regla.`,

  dt_no_rep:n => `${n == 1 ? "Esa muerte no aparece" : `Ninguna de esas ${n} muertes aparece`} en los registros de detención estancia por estancia de ICE (desde octubre de 2021), que a menudo no incluyen muertes; los informes de arriba son el conteo más completo.`, fa_person:"Esta página no puede buscar a una persona por nombre o número A. Para encontrar a alguien, use el buscador de ICE:", fa_loc:"Abrir el localizador de ICE", pq_gap:(co, cyc, q, r) => `${co}, ${cyc}: sus informes periódicos suman ${q}; la lista por destinatario, ${r}. La FEC lleva los dos conteos por separado; la diferencia no se ha podido atribuir a un destinatario, así que la lista por destinatario no la incluye.`, pol_money_x:(n, u, all, ut) => `El partido es el actual de cada miembro. El desglose por votación en Siga el dinero cuenta ${all} destinatarios y ${ut}: suma ${n} ${n == 1 ? "persona" : "personas"} que no están en esta lista de miembros (exmiembros o candidatos), con ${u}, y usa el partido registrado al momento de la votación.`, tp_mw_out:"El Servicio de Alguaciles, el Ejército y el fondo de subvenciones del DHS para estados no están en esta gráfica; están en Cada agencia y programa.", tp_mw_neg:x => `Los años en que se retiró más dinero del que se comprometió se dibujan en cero: ${x}.`, mt_empty_base:(b, n) => `(de ${b} camas garantizadas en los ${n} centros con cifras de población)`, jf_lead:(co, e) => `De los ${co} que las empresas de detención dieron a estos comités, se estima que ${e} se transfirieron a otros comités.`, lg_else:st => `En otras partes de ${st}: listados para otras cortes de inmigración`, vn_viz_cat:"Dinero de ICE por tipo de trabajo", vn_viz_tap:"Contratos de $1 millón o más, de octubre de 2023 a septiembre de 2026. Toque una barra para abrir ese grupo.", vn_viz_lob:"Mayor cabildeo federal declarado desde 2023", vn_viz_lobn:"Cifras máximas: los reportes de la propia empresa más los de firmas externas, que pueden coincidir. Cabildeo sobre cualquier tema, no solo in   wd_fh:"Informes de otros inspectores sobre este centro", wd_note:"Investigado a mano el 5 de octubre de 2026. La lista del Inspector General probablemente está completa hasta su informe más reciente; la de la Defensoría es parcial. Los memorandos de la oficina de derechos civiles desde 2021 se recogen cada semana del archivo público que mantiene el Project On Government Oversight y se vinculan con un centro por su nombre; los anteriores se encontraron a mano y están incompletos. Un hallazgo se cita o se resume del propio informe; donde no se muestra, abra el informe.", op_run:n => `Operado por ${n}`, op_hist:(n, a, b) => a ? `Antes, del ${a} al ${b}: operado por ${n}.` : `Antes, hasta el ${b}: operado por ${n}.`, op_chg:"el operador cambió durante este período", cd_chg:n => `${n} auditoría${n === 1 ? " abarca" : "s abarcan"} un período en que cambió el operador, así que no se cuenta${n === 1 ? "" : "n"} en la tasa de ninguna de las dos empresas y se mantiene${n === 1 ? "" : "n"} en la lista de centros.`, ct_chg:n => `Las cifras de la corte son un solo total por lugar para todo el período, así que ${n} decisiones en centros que cambiaron de operador dentro de él no se cuentan en el total de ningún operador.`, op_chg2:"otro operador manejó este centro durante parte del período", op_was:"Centros que operó antes", op_until:d => `hasta el ${d}`, op_since:d => `desde el ${d}`, op_hist_note:n => `Cada muerte, inspección, informe, visita negada y auditoría se cuenta bajo la empresa que operaba el centro en esa fecha, no bajo el operador de hoy. ${n} centros tienen un cambio de operador registrado desde octubre de 2022, cada uno con su fuente en la página del centro. En los demás no se encontró ningún cambio, pero en unos 30 centros antiguos ninguna fuente confirma que la misma empresa los operó todo el tiempo, así que se asume que no cambiaron. Un informe se ubica por el día en que se publicó, que puede ser posterior al período que describe.`, op_n:{GEO:"The GEO Group", C   cd_h:"Muertes y denuncias de abuso sexual: por año y según quién opera el centro", cd_lead:(a, b) => `Conteos de los propios informes de auditoría y de muertes de ICE, frente al total de días de detención en cada centro de ${a} a ${b}, para poder comparar centros grandes y pequeños.`,
  cd_f_h:"Lo que muestran los registros", fx_held:"Cuánto tiempo llevan detenidas las personas", fx_bond:"Decisiones de fianza en la corte de inmigración", fx_abuse:"Denuncias y muertes, frente a cuántas personas detuvo cada centro", fx_ops:"Centros de operación privada y de gobierno, lado a lado", cd_find:(o, x) => [
    `Se usan aquí ${x.aud} auditorías en ${x.audSites} centros cuyo informe da tanto un total como el periodo que ese total cubre, con registros de población para todo ese periodo. Quedan fuera: ${x.noPer} cuyo informe no indica el periodo y ${x.outside} cuyo periodo empezó antes que los registros de población. Las ${x.aud} usadas cuentan ${x.alleg} denuncias: ${o} por cada 1,000 personas detenidas durante un año.`,
    `Centros de operación privada: ${x.privRate} por cada 1,000 (${x.privAud} auditorías). Centros operados por un gobierno: ${x.pubRate} por cada 1,000 (${x.pubAud} auditorías). Con tan pocas auditorías de centros de gobierno, esa diferencia no es un hallazgo.`,

  cd_note:"Lea esto con cuidado. Una denuncia es un reporte presentado, no una conclusión de que hubo abuso; un conteo más alto también puede indicar un centro donde la gente puede denunciar. El conteo de cada auditoría se compara con el periodo que su propio informe dice cubrir, de uno a tres años; cada uno de estos informes se leyó para confirmarlo. Las tasas basadas en pocas auditorías o muertes cambian mucho con un solo hecho. Estas cifras muestran dónde se registraron los hechos, no que un operador los haya causado.",

  sg_c1:"Ingresos a aislamiento por cada 100 personas detenidas, al año", sg_c1n:(a, b, t, u) => `ICE lo llama segregación. Los conteos son los ingresos que ICE informó cada mes de ${a} a ${b}: ${t} en total. Una persona puede ser aislada más de una vez. ${u} ingresos corresponden a nombres que esta página no pudo vincular con un solo centro y quedan fuera. El número después de cada nombre es la cantidad de ingresos.`,
